 («de små båtene . Mange»)", "Preposisjon: «eller døde av sult og»", "Gradbøyning / sammenligning", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen"], "tags": ["best", "komp", "konj", "prep"]}, {"id": "L25-4", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (4/8)", "text": "[[Etter]] omtrent en måned ble de sultne [[og]] forfrosne sjøfolkene funnet av lokale fiskere. [[Etterpå/Deretter/Så]] tilbrakte de over tre måneder [[sammen]] med folket på Røst. I midten [[av]] mai 1432 begynte de på [[reisen/turen]] tilbake til Italia.", "blanks": [["Etter"], ["og"], ["Etterpå", "Deretter", "Så"], ["sammen"], ["av"], ["reisen", "turen"]], "labels": ["Preposisjon: «Etter omtrent en»", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («lokale fiskere. Etterpå tilbrakte de»)", "Ordforråd: ordet må passe i sammenhengen («tre måneder sammen med folket»)", "Preposisjon: «I midten av mai 1432»", "Ordforråd: ordet må passe i sammenhengen («de på reisen tilbake til»)"], "tags": ["konj", "prep"]}, {"id": "L25-5", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (5/8)", "text": "Den første delen av [[hjemreisen/hjemturen/reisen/turen]] dro de med de lokale tørrfiskbåtene [[til]] Trondheim. Den stormfulle reisen, skipsforliset, oppholdet [[på]] Røst og hjemturen er beskrevet av [[Querini]] selv og av to menn i [[hans]] følge. Querinis beskrivelse er et historisk dokument [[av]] stor verdi for nordlendingene. Her blir [[det]] for første gang fortalt hvordan [[folket/befolkningen/menneskene]] på Røst og andre steder langs [[kysten]] i Nord-Norge levde. Querini hadde mye positivt å [[si/fortelle]] om menneskene på Røst. Han framhever [[deres]] enkle liv, hvor hardt de arbeidet, og [[han]] omtaler dem som gode mennesker.", "blanks": [["hjemreisen", "hjemturen", "reisen", "turen"], ["til"], ["på"], ["Querini"], ["hans"], ["av"], ["det"], ["folket", "befolkningen", "menneskene"], ["kysten"], ["si", "fortelle"], ["deres"], ["han"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («delen av hjemreisen dro de»)", "Preposisjon: «lokale tørrfiskbåtene til Trondheim. Den»", "Preposisjon: «skipsforliset, oppholdet på Røst og»", "Ordforråd: ordet må passe i sammenhengen («beskrevet av Querini selv og»)", "Eiendomspronomen (ikke refleksivt fordi eieren ikke er subjekt)", "Preposisjon: «historisk dokument av stor verdi»", "Perfektum partisipp", "Ordforråd: ordet må passe i sammenhengen («fortalt hvordan folket på Røst»)", "Ordforråd: ordet må passe i sammenhengen («steder langs kysten i Nord-Norge»)", "Refleksivt eiendomspronomen «sin/si/sitt/sine» viser tilbake til subjektet", "Eiendomspronomen (ikke refleksivt fordi eieren ikke er subjekt)", "Pronomen: riktig form (subjekt/objekt) og referanse"], "tags": ["best", "part", "prep"]}, {"id": "L25-6", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (6/8)", "text": "Querini [[var]] mer død enn levende da han [[ble]] funnet av folkene på Røst, og [[det]] er derfor forståelig at han omtalte [[sine]] redningsmenn og deres levemåte så positivt. Det er [[først]] og fremst italienernes skildring av hverdagslivet [[og]] levekårene til den nordnorske kystbefolkning i seinmiddelalderen [[som]] gjør inntrykk. Blant annet omtaler Querini [[veldig/meget/ganske]] detaljert fisket og tørrfiskproduksjonen på stedet. [[Det]] sjeldne kulturmøtet har gitt oss en [[av]] de få beskrivelsene vi overhodet har av [[den]] folkelige kystkulturen i Norge fra middelalderen.", "blanks": [["var"], ["ble"], ["det"], ["sine"], ["først"], ["og"], ["som"], ["veldig", "meget", "ganske"], ["Det"], ["av"], ["den"]], "labels": ["Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Passiv: bli + perfektum partisipp", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Refleksivt eiendomspronomen «sin/si/sitt/sine» viser tilbake til subjektet", "Fast uttrykk: «først og fremst»", "Konjunksjon/subjunksjon som binder sammen setningene", "Relativpronomen «som» innleder en leddsetning", "Gradsadverb som forsterker adjektivet/adverbet", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Preposisjon: «oss en av de få»", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form"], "tags": ["best", "komp", "konj", "pass", "prep", "uttr", "verb"]}, {"id": "L25-7", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (7/8)", "text": "Querini [[beskriver]] en primitiv, men lykkelig befolkning på den [[lille]] øya ved \"Culo Mundi\" - verdens ende - som [[levde]] i idyllisk tilstand av fred [[og]] uskyldighet. Den negative holdningen til folk og natur som [[man/en]] møter i seinere beskrivelser fra disse områdene, [[er]] fraværende hos venetianerne.", "blanks": [["beskriver"], ["lille"], ["levde"], ["og"], ["man", "en"], ["er"]], "labels": ["Verb i presens: velg et verb som passer i sammenhengen («Querini beskriver en primitiv,»)", "Ordforråd: ordet må passe i sammenhengen («på den lille øya ved»)", "Verb i preteritum som passer i sammenhengen («- som levde i idyllisk»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («disse områdene, er fraværende hos»)"], "tags": ["best", "konj", "verb"]}, {"id": "L25-8", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (8/8)", "text": "I dag blir [[den]] dramatiske hendelsen for nesten 600 år [[siden]] brukt til å framstille Pietro Querini som [[den]] første tørrfiskeksportøren og til å styrke båndene [[mellom]] Italia og Nord-Norge både når det [[gjelder]] næringsliv og kultur. Som et minne om det som [[skjedde/hendte]] den gangen, har man reist et minnesmerke over Pietro Querini på den lille [[øya/øyen]] utenfor Røst.", "blanks": [["den"], ["siden"], ["den"], ["mellom"], ["gjelder"], ["skjedde", "hendte"], ["øya", "øyen"]], "labels": ["Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Fast uttrykk: «år siden»", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Preposisjon: «styrke båndene mellom Italia og»", "Fast uttrykk: «når det gjelder»", "Verb i preteritum som passer i sammenhengen («det som skjedde den gangen,»)", "Ordforråd: ordet må passe i sammenhengen («den lille øya utenfor Røst.»)"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L26-1", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (1/8)", "text": "På 1800-tallet var det [[stor]] befolkningsøkning i Norge, og det ble [[etter]] hvert trangt om plassen. De som [[ikke]] eide jord, hadde det vanskelig, for [[det]] var heller ikke lett å finne [[seg/nok]] arbeid. Noen flyttet innenfor landets grenser [[for]] å oppnå bedre levevilkår, men mange [[dro/reiste/flyttet/utvandret]] til USA.", "blanks": [["stor"], ["etter"], ["ikke"], ["det"], ["seg", "nok"], ["for"], ["dro", "reiste", "flyttet", "utvandret"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («var det stor befolkningsøkning i»)", "Fast uttrykk: «etter hvert»", "Nektelse – betydning og plassering (i leddsetning foran verbet)", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Refleksivt pronomen (refleksivt verb)", "Fast uttrykk: «for å»", "Verb i preteritum som passer i sammenhengen («men mange dro til USA.»)"], "tags": ["konj", "uttr", "verb"]}, {"id": "L26-2", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (2/8)", "text": "Utvandringen til USA kan [[deles]] i to perioder, nemlig før og [[etter]] 1865. Den første perioden kalles pionertiden. De som da dro over Atlanterhavet, [[kalles/var]] pionerer. De våget å dra til [[den]] ukjente og ofte farefulle villmarken i [[vest/Amerika/USA]]. På denne måten åpnet de veien [[for]] alle de menneskene som skulle komme [[etter/dit/etterpå]]. Det første utvandrerfølget fra Norge reiste [[i]] 1825.", "blanks": [["deles"], ["etter"], ["kalles", "var"], ["den"], ["vest", "Amerika", "USA"], ["for"], ["etter", "dit", "etterpå"], ["i"]], "labels": ["s-passiv etter modalverb", "Preposisjon: «før og etter 1865. Den»", "Ordforråd: ordet må passe i sammenhengen («over Atlanterhavet, kalles pionerer. De»)", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Ordforråd: ordet må passe i sammenhengen («villmarken i vest . På»)", "Preposisjon: «de veien for alle de»", "Preposisjon: «skulle komme etter . Det»", "Preposisjon: «Norge reiste i 1825.»"], "tags": ["best", "pass", "prep"]}, {"id": "L26-3", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (3/8)", "text": "Det var ikke bare vanskene [[med]] å etablere seg i villmarken i Amerika [[som]] møtte emigrantene. Reisen over havet fra [[Norge]] til Amerika var hard. Den eneste [[måten/muligheten]] å krysse havet på var med [[båt/skip]]. Reisen varte i månedsvis og var [[både/veldig/svært/ganske/for]] dyr og farlig.", "blanks": [["med"], ["som"], ["Norge"], ["måten", "muligheten"], ["båt", "skip"], ["både", "veldig", "svært", "ganske", "for"]], "labels": ["Preposisjon: «bare vanskene med å etablere»", "Relativpronomen «som» innleder en leddsetning", "Ordforråd: ordet må passe i sammenhengen («havet fra Norge til Amerika»)", "Ordforråd: ordet må passe i sammenhengen («Den eneste måten å krysse»)", "Ordforråd: ordet må passe i sammenhengen («var med båt . Reisen»)", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["konj", "prep"]}, {"id": "L26-4", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (4/8)", "text": "I 1865 var [[det]] kommet ca. 78 000 nordmenn til USA. De [[fleste]] kom fra bygdene. I 1870- og 1880-årene økte [[utvandringen]] både fra bygdene og byene sterkt. [[Fram/frem]] til første verdenskrigs begynnelse i 1914 [[flyttet/dro/utvandret]] det omtrent 680 000 nordmenn til USA.", "blanks": [["det"], ["fleste"], ["utvandringen"], ["Fram", "frem"], ["flyttet", "dro", "utvandret"]], "labels": ["Perfektum partisipp", "Verb i preteritum: velg et verb som passer i sammenhengen («USA. De fleste kom fra»)", "Ordforråd: ordet må passe i sammenhengen («1880-årene økte utvandringen både fra»)", "Ordforråd: ordet må passe i sammenhengen («byene sterkt. Fram til første»)", "Verb i preteritum som passer i sammenhengen («i 1914 flyttet det omtrent»)"], "tags": ["part", "verb"]}, {"id": "L26-5", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (5/8)", "text": "Norge [[er/var]] et av de landene som, regnet etter [[folketall]], mistet flest mennesker til Amerika. Båtselskapene [[kjempet]] om passasjerene. De annonserte til og [[med]] i avisene for å få fylt [[opp/alle]] skipene sine.", "blanks": [["er", "var"], ["folketall"], ["kjempet"], ["med"], ["opp", "alle"]], "labels": ["Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Ordforråd: ordet må passe i sammenhengen («regnet etter folketall , mistet»)", "Verb i preteritum som passer i sammenhengen («Amerika. Båtselskapene kjempet om passasjerene.»)", "Fast uttrykk: «til og med»", "Ordforråd: ordet må passe i sammenhengen («få fylt opp skipene sine.»)"], "tags": ["uttr", "verb"]}, {"id": "L26-6", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (6/8)", "text": "I USA kunne nybyggerne [[få]] opptil 650 mål jord uten annen [[betaling/kostnad/innsats]] enn et oppmålingsgebyr. Dette virket forlokkende [[på/for]] folk som kom fra en jordfattig [[liten]] bygd. Mange startet derfor med jordbruk. [[Andre]] fikk arbeid på de store jernbaneanleggene [[som]] etter hvert ble bygd.", "blanks": [["få"], ["betaling", "kostnad", "innsats"], ["på", "for"], ["liten"], ["Andre"], ["som"]], "labels": ["Mengdeord / determinativ", "Ordforråd: ordet må passe i sammenhengen («uten annen betaling enn et»)", "Preposisjon: «virket forlokkende på folk som»", "Ordforråd: ordet må passe i sammenhengen («en jordfattig liten bygd. Mange»)", "Mengdeord / determinativ", "Relativpronomen «som» innleder en leddsetning"], "tags": ["best", "konj", "prep"]}, {"id": "L26-7", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (7/8)", "text": "For dem [[som]] tenkte på å emigrere, ble det [[viktig]] å ha venner og familie i [[det/dette]] nye landet. Gjennom brevene fra dem [[fikk/mottok]] de informasjon om reisen, hvordan det [[hadde]] gått med dem som hadde dradd og [[om]] arbeids- og samfunnsforholdene i det nye [[landet]].", "blanks": [["som"], ["viktig"], ["det", "dette"], ["fikk", "mottok"], ["hadde"], ["om"], ["landet"]], "labels": ["Relativpronomen «som» innleder en leddsetning", "Ordforråd: ordet må passe i sammenhengen («ble det viktig å ha»)", "Ordforråd: ordet må passe i sammenhengen («familie i det nye landet.»)", "Verb i preteritum som passer i sammenhengen («fra dem fikk de informasjon»)", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Preposisjon: «dradd og om arbeids- og»", "Ordforråd: ordet må passe i sammenhengen («det nye landet .»)"], "tags": ["konj", "prep", "verb"]}, {"id": "L26-8", "src": "luke", "kind": "luke", "title": "Norsk utvandring på 1800-tallet (8/8)", "text": "Det norske bygdesamfunnet ble preget av [[utvandringen]] på flere måter. På den ene [[side/siden]] mistet man mange av de unge, [[og]] dermed nyttig arbeidskraft. Men på den [[annen/andre]] side ble det bedre plass for [[de/folk]] som var igjen. Etter århundreskiftet ble [[det]] satt i gang tiltak for å [[bremse/redusere/stoppe]] utvandringen. Da var det igjen behov [[for]] arbeidskraft i Norge.", "blanks": [["utvandringen"], ["side", "siden"], ["og"], ["annen", "andre"], ["de", "folk"], ["det"], ["bremse", "redusere", "stoppe"], ["for"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («preget av utvandringen på flere»)", "Ordforråd: ordet må passe i sammenhengen («den ene side mistet man»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Fast uttrykk: «på den annen»", "Pronomen: riktig form (subjekt/objekt) og referanse", "Perfektum partisipp", "Verb i infinitiv", "Fast uttrykk: «behov for»"], "tags": ["best", "konj", "part", "uttr", "verb"]}, {"id": "L27-1", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (1/7)", "text": "En gammel legende forteller at Sunniva [[var]] en vakker, irsk prinsesse som levde [[på]] 900-tallet. Da faren hennes døde, arvet [[hun]] kongeriket. Legenden beretter også om hvordan [[det]] gikk da hun en vakker dag [[fikk]] besøk av en viking som krevde [[å]] få både henne og landet hennes. [[Fordi/Siden/Ettersom/Da]] den kristne prinsessen slett ikke ville [[ha]] en hedning til mann, bestemte hun [[seg]] med en gang for å [[forlate]] Irland, og hun tok med seg [[de/folk]] som ville følge henne.", "blanks": [["var"], ["på"], ["hun"], ["det"], ["fikk"], ["å"], ["Fordi", "Siden", "Ettersom", "Da"], ["ha"], ["seg"], ["forlate"], ["de", "folk"]], "labels": ["Verb i preteritum som passer i sammenhengen («at Sunniva var en vakker,»)", "Preposisjon: «som levde på 900-tallet. Da»", "Pronomen: riktig form (subjekt/objekt) og referanse", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Fast uttrykk: «fikk besøk»", "Infinitivsmerke «å» foran verbet", "Konjunksjon/subjunksjon som binder sammen setningene", "Verb i infinitiv", "Fast uttrykk: «bestemte hun seg»", "Verb i infinitiv", "Pronomen: riktig form (subjekt/objekt) og referanse"], "tags": ["best", "konj", "prep", "uttr", "verb"]}, {"id": "L27-2", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (2/7)", "text": "Sunniva og [[hennes]] folk gikk da straks om bord [[på/i]] noen skip og dro så av [[sted/gårde]]. Da det plutselig blåste opp til [[storm]], drev de lenge rundt ute på [[havet/sjøen]], men til slutt kom de i [[land]] på øya Selja på norskekysten. Her [[levde]] de lenge av fisk fra sjøen [[og]] det de ellers kunne finne i [[naturen/området]].", "blanks": [["hennes"], ["på", "i"], ["sted", "gårde"], ["storm"], ["havet", "sjøen"], ["land"], ["levde"], ["og"], ["naturen", "området"]], "labels": ["Eiendomspronomen (ikke refleksivt fordi eieren ikke er subjekt)", "Preposisjon: «om bord på noen skip»", "Fast uttrykk: «av sted»", "Ordforråd: ordet må passe i sammenhengen («opp til storm , drev»)", "Ordforråd: ordet må passe i sammenhengen («ute på havet , men»)", "Fast uttrykk: «i land»", "Verb i preteritum som passer i sammenhengen («norskekysten. Her levde de lenge»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («finne i naturen .»)"], "tags": ["best", "konj", "prep", "uttr", "verb"]}, {"id": "L27-3", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (3/7)", "text": "Etter en tid begynte mange folk [[på/fra]] fastlandet å mistenke utlendingene for å [[ta/stjele]] sauene deres. En stor flokk menn [[tok]] med seg våpen og dro [[ut/over/sammen]] til øya for straks å få slutt [[på]] tyveriet. Da Sunniva og følget så [[hva/det]] som ventet dem, flyktet de med en [[gang]] og gjemte seg i en fjellhule. [[Den]] raste ned over irene slik at [[de/alle]] omkom og ble begravd i en [[stor]] steinrøys.", "blanks": [["på", "fra"], ["ta", "stjele"], ["tok"], ["ut", "over", "sammen"], ["på"], ["hva", "det"], ["gang"], ["Den"], ["de", "alle"], ["stor"]], "labels": ["Preposisjon: «mange folk på fastlandet å»", "Verb i infinitiv", "Fast uttrykk: «tok med seg»", "Ordforråd: ordet må passe i sammenhengen («og dro ut til øya»)", "Fast uttrykk: «slutt på»", "Spørreord i indirekte spørsmål / leddsetning", "Fast uttrykk: «med en gang»", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («i en stor steinrøys.»)"], "tags": ["best", "konj", "prep", "uttr", "verb"]}, {"id": "L27-4", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (4/7)", "text": "Litt senere oppdaget noen folk [[i/fra]] området et sterkt, blått lys over [[dette]] stedet. De begynte derfor å lete [[under]] steinene. Her fant de alle de [[døde]] kroppene til utlendingene som hadde slått [[seg]] ned på denne øya. Det var [[mange]] som mente at de omkomne utlendingene [[sikkert/faktisk/nok/utvilsomt]] var hellige. Derfor tok de vare [[på]] alt det som de hadde funnet.", "blanks": [["i", "fra"], ["dette"], ["under"], ["døde"], ["seg"], ["mange"], ["sikkert", "faktisk", "nok", "utvilsomt"], ["på"]], "labels": ["Preposisjon: «noen folk i området et»", "Ordforråd: ordet må passe i sammenhengen («lys over dette stedet. De»)", "Preposisjon: «å lete under steinene. Her»", "Verb i preteritum: velg et verb som passer i sammenhengen («alle de døde kroppene til»)", "Fast uttrykk: «slått seg ned»", "Mengdeord / determinativ", "Ordforråd: ordet må passe i sammenhengen («omkomne utlendingene sikkert var hellige.»)", "Fast uttrykk: «tok de vare på»"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L27-5", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (5/7)", "text": "[[På]] øya Selja ble det senere bygd [[opp/både]] et kloster og en kirke. Derfor [[ble]] denne øya ikke bare et meget [[viktig]] kulturelt senter, men også et religiøst [[senter]] på Vestlandet. Omtrent hundre år senere [[ble]] et sølvskrin med levningene etter Sunniva [[flyttet]] fra Selja til Bergen.", "blanks": [["På"], ["opp", "både"], ["ble"], ["viktig"], ["senter"], ["ble"], ["flyttet"]], "labels": ["Preposisjon: «På øya Selja»", "Ordforråd: ordet må passe i sammenhengen («senere bygd opp et kloster»)", "Passiv: bli + perfektum partisipp", "Ordforråd: ordet må passe i sammenhengen («et meget viktig kulturelt senter,»)", "Verb i presens: velg et verb som passer i sammenhengen («et religiøst senter på Vestlandet.»)", "Passiv: bli + perfektum partisipp", "Verb i preteritum som passer i sammenhengen («etter Sunniva flyttet fra Selja»)"], "tags": ["pass", "prep", "verb"]}, {"id": "L27-6", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (6/7)", "text": "Navnet Sunniva [[er]] opprinnelig angelsaksisk, og det betyr «solgave». [[Etter]] hvert økte den irske prinsessens popularitet [[blant]] nordmennene, særlig her i vest. Dette [[er]] nok grunnen til de mange variantene [[av]] dette navnet som fremdeles er et [[veldig]] populært jentenavn. Mange steder fins det [[fremdeles]] bilder og statuer av den kjente [[og]] kjære helgenen.", "blanks": [["er"], ["Etter"], ["blant"], ["er"], ["av"], ["veldig"], ["fremdeles"], ["og"]], "labels": ["Verb i presens: velg et verb som passer i sammenhengen («Navnet Sunniva er opprinnelig angelsaksisk,»)", "Fast uttrykk: «etter hvert»", "Preposisjon: «prinsessens popularitet blant nordmennene, særlig»", "Ordforråd: ordet må passe i sammenhengen («vest. Dette er nok grunnen»)", "Preposisjon: «mange variantene av dette navnet»", "Gradsadverb som forsterker adjektivet/adverbet", "Ordforråd: ordet må passe i sammenhengen («fins det fremdeles bilder og»)", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["komp", "konj", "prep", "uttr", "verb"]}, {"id": "L27-7", "src": "luke", "kind": "luke", "title": "Sankta Sunniva (7/7)", "text": "Vanligvis blir Norge nå [[for]] tiden regnet som et protestantisk land, [[men]] det finnes fortsatt en del rester [[av/fra]] de gamle, katolske skikkene. Sankta Sunniva [[blir]] for eksempel sett på som den [[mest]] kjente helgenen i Vest-Norge.", "blanks": [["for"], ["men"], ["av", "fra"], ["blir"], ["mest"]], "labels": ["Fast uttrykk: «for tiden»", "Konjunksjon/subjunksjon som binder sammen setningene", "Preposisjon: «del rester av de gamle,»", "Ordforråd: ordet må passe i sammenhengen («Sankta Sunniva blir for eksempel»)", "Gradbøyning / sammenligning"], "tags": ["komp", "konj", "prep", "uttr"]}, {"id": "L28-1", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (1/10)", "text": "Dialekten i Oslo øst sprer seg mest av norske dialekter. Men hva skjer med dialekten til [[dem]] som flytter fra Østlandet? Tone, 17 år, flyttet fra Oslo [[til]] Bergen som 7-åring. I dag, etter 10 år i Bergen, snakker hun fremdeles østlandsdialekt. Forsker Ann-Kristin Molde vil undersøke hva som skjer med [[dialekten/språket]] til personer som [[flytter]] som barn. Hun er spesielt interessert i hva [[som]] skjer med dialekten til [[barn/dem]] som flytter fra Østlandet. [[Hun/Molde]] tror at når et barn med østlandsdialekt flytter, er det stor sjanse for at han eller hun vil holde på dialekten [[sin]]. De utflyttede østlandsbarna vil svært [[ofte/sannsynlig]] fortsette å snakke østlandsk. Barn som flytter fra Vestlandet eller Nord-Norge [[vil]] i mindre grad holde på sine dialekter [[etter]] at de har flyttet. De vil i mye større grad [[begynne]] å snakke den lokale dialekten på sitt nye hjemsted.", "blanks": [["dem"], ["til"], ["dialekten", "språket"], ["flytter"], ["som"], ["barn", "dem"], ["Hun", "Molde"], ["sin"], ["ofte", "sannsynlig"], ["vil"], ["etter"], ["begynne"]], "labels": ["Pronomen: riktig form (subjekt/objekt) og referanse", "Preposisjon: «fra Oslo til Bergen som»", "Ordforråd: ordet må passe i sammenhengen («skjer med dialekten til personer»)", "Verb i presens: velg et verb som passer i sammenhengen («personer som flytter som barn.»)", "Spørreordet er subjekt i leddsetningen → «hva som»", "Ordforråd: ordet må passe i sammenhengen («dialekten til barn som flytter»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Refleksivt eiendomspronomen «sin/si/sitt/sine» viser tilbake til subjektet", "Ordforråd: ordet må passe i sammenhengen («vil svært ofte fortsette å»)", "Modalverb + infinitiv", "Preposisjon: «sine dialekter etter at de»", "Ordforråd: ordet må passe i sammenhengen («større grad begynne å snakke»)"], "tags": ["best", "konj", "prep", "verb"]}, {"id": "L28-2", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (2/10)", "text": "§Større språklig likhet§ Dialektene i Norge [[blir]] stadig likere, men fortsatt er det klare språklige forskjeller [[mellom]] folk fra de ulike landsdelene Østlandet, Vestlandet, Trøndelag og Nord-Norge. Innenfor hver landsdel [[kan]] imidlertid utjevningen mellom lokale dialekter variere. På Østlandet blir dialektene i [[de]] ulike områdene stadig mer like. På Vestlandet er [[det]] ikke lett å se noen tilsvarende prosess. Her skiller de lokale dialektene [[seg]] ennå klart fra hverandre.", "blanks": [["blir"], ["mellom"], ["kan"], ["de"], ["det"], ["seg"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («i Norge blir stadig likere,»)", "Preposisjon: «språklige forskjeller mellom folk fra»", "Modalverb + infinitiv", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Refleksivt pronomen (refleksivt verb)"], "tags": ["best", "prep", "verb"]}, {"id": "L28-3", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (3/10)", "text": "Det er mange [[grunner/årsaker]] til at talemålet endrer seg i dag. At folk flytter mer enn før, er kanskje en [[av]] de viktigste. Tidligere forskning viser at media betyr mye for [[at]] man lærer nye ord. Men påvirkning fra media får sjelden folk til å [[endre/forandre]] uttalen sin eller til å bruke andre bøyingsendelser, fraser og setninger. Det er i direkte kommunikasjon mellom folk at uttalen og strukturen i [[språk/dialekter]] påvirkes. En slik direkte kommunikasjon skjer [[blant]] annet når folk som kommer fra ulike steder, [[går]] på samme skole eller jobber på samme arbeidsplass.", "blanks": [["grunner", "årsaker"], ["av"], ["at"], ["endre", "forandre"], ["språk", "dialekter"], ["blant"], ["går"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («er mange grunner til at»)", "Preposisjon: «kanskje en av de viktigste.»", "Konjunksjon/subjunksjon som binder sammen setningene", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («strukturen i språk påvirkes. En»)", "Fast uttrykk: «blant annet»", "Ordforråd: ordet må passe i sammenhengen («ulike steder, går på samme»)"], "tags": ["konj", "prep", "uttr", "verb"]}, {"id": "L28-4", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (4/10)", "text": "§Språklige livshistorier§ Selv om [[vi]] har en utjevning av dialektene i Norge, ser vi fortsatt på [[dialektene]] som en viktig indikator for hvor folk kommer [[fra]]. Men dette hovedmønsteret stemmer [[ikke]] alltid, for folk kan ha flyttet fra et sted til et annet [[uten]] å bytte dialekt.", "blanks": [["vi"], ["dialektene"], ["fra"], ["ikke"], ["uten"]], "labels": ["Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («fortsatt på dialektene som en»)", "Preposisjon: «folk kommer fra . Men»", "Nektelse – betydning og plassering (i leddsetning foran verbet)", "Preposisjon: «et annet uten å bytte»"], "tags": ["best", "konj", "prep"]}, {"id": "L28-5", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (5/10)", "text": "Et viktig spørsmål blir derfor [[hva]] som skjer med folks dialekt når de flytter, og hva som er årsakene til det. Noen kvalitative studier som [[har]] undersøkt hva som skjer med et lite [[utvalg/antall]] personer som har flyttet, har gitt oss viktig kunnskap [[om]] hvilke faktorer som har betydning.", "blanks": [["hva"], ["har"], ["utvalg", "antall"], ["om"]], "labels": ["Spørreord i indirekte spørsmål / leddsetning", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Ordforråd: ordet må passe i sammenhengen («et lite utvalg personer som»)", "Preposisjon: «viktig kunnskap om hvilke faktorer»"], "tags": ["konj", "prep", "verb"]}, {"id": "L28-6", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (6/10)", "text": "§Innflyttere; mulige språkvalg§ Innflyttere har flere mulige språkvalg [[når]] de kommer flyttende til et nytt sted. Disse [[valgene]] er ikke alltid bevisste. Det første mulige språkvalget er å beholde [[den]] dialekten som man har fra før, kanskje med noen små endringer som for eksempel å bytte ut [[noen/enkelte]] ord. Dette er det vanligste som skjer når [[man]] flytter som voksen. Flytter man fra Oslo til Bergen, vil man da hovedsaklig beholde østlandsdialekten, men begynne å [[bruke]] noen typiske vestlandske ord.", "blanks": [["når"], ["valgene"], ["den"], ["noen", "enkelte"], ["man"], ["bruke"]], "labels": ["Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («sted. Disse valgene er ikke»)", "Ordforråd: ordet må passe i sammenhengen («å beholde den dialekten som»)", "Mengdeord / determinativ", "Pronomen: riktig form (subjekt/objekt) og referanse", "Verb i infinitiv"], "tags": ["best", "konj", "verb"]}, {"id": "L28-7", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (7/10)", "text": "Det [[andre]] mulige språkvalget som innflyttere har, er å bytte til den dialekten som flertallet [[på]] det nye stedet snakker. Dette er det mest vanlige når man [[flytter]] som barn. Flytter man med foreldrene sine fra Oslo til Bergen, vil man da vanligvis begynne å [[bruke/snakke]] bergensk.", "blanks": [["andre"], ["på"], ["flytter"], ["bruke", "snakke"]], "labels": ["Mengdeord / determinativ", "Preposisjon: «som flertallet på det nye»", "Verb i presens: velg et verb som passer i sammenhengen («når man flytter som barn.»)", "Verb i infinitiv"], "tags": ["best", "prep", "verb"]}, {"id": "L28-8", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (8/10)", "text": "Det tredje mulige språkvalget er å kombinere den dialekten man har fra [[før]], med dialekten på stedet man flytter til. Dette kan skje på to forskjellige [[måter]]. For det første kan man utvikle en blandingsdialekt, der man bruker noen elementer fra [[begge]] dialektene. En mulighet om man flytter fra Oslo til Bergen, er å beholde [[for]] eksempel rulle-r og tonefallet som man har fått i Oslo, og kombinere det [[med]] bergenske bøyingsendelser og ord. For det andre kan man [[veksle]] mellom å bruke de to dialektene, for eksempel ved å bruke østlandsk hjemme og bergensk på [[jobben/skolen]]..", "blanks": [["før"], ["måter"], ["begge"], ["for"], ["med"], ["veksle"], ["jobben", "skolen"]], "labels": ["Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («to forskjellige måter . For»)", "Mengdeord / determinativ", "Fast uttrykk: «for eksempel»", "Preposisjon: «kombinere det med bergenske bøyingsendelser»", "Ordforråd: ordet må passe i sammenhengen («kan man veksle mellom å»)", "Ordforråd: ordet må passe i sammenhengen («bergensk på jobben ..»)"], "tags": ["best", "konj", "prep", "uttr"]}, {"id": "L28-9", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (9/10)", "text": "§Faktorer som påvirker språkvalgene§ Hvilke faktorer [[påvirker]] språkvalgene innflytterne gjør? Som nevnt tidligere er alder en faktor. En annen faktor er språksamfunnet man flytter til. Det er nokså sannsynlig at man forandrer dialekten sin dersom [[man]] flytter inn i et ganske homogent språksamfunn, der flertallet av [[innbyggerne]] snakker samme dialekt. Men dersom man kommer til et mer heterogent språksamfunn med mange ulike [[dialekter]], er dette mindre sannsynlig. En tredje faktor er mer individuelle forhold, for eksempel i hvor stor grad man generelt ønsker og klarer å tilpasse seg andre. Man kan også [[stille]] spørsmål om i hvor stor grad dialekten innflyttere har fra før, fører til skifte av dialekt eller ikke. Noe som [[også]] er viktig for språkvalget, er hvor dialekten er plassert i det sosiale prestisjehierarkiet i Norge. Det kan være [[vanligere]] å legge fra seg en dialekt som er stigmatisert enn en dialekt som ikke er det. Det er også sannsynlig [[at]] det er lettere å beholde en dialekt som har høy prestisje.", "blanks": [["påvirker"], ["man"], ["innbyggerne"], ["dialekter"], ["stille"], ["også"], ["vanligere"], ["at"]], "labels": ["Verb i presens: velg et verb som passer i sammenhengen («Hvilke faktorer påvirker språkvalgene innflytterne»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («flertallet av innbyggerne snakker samme»)", "Ordforråd: ordet må passe i sammenhengen («mange ulike dialekter , er»)", "Fast uttrykk: «stille spørsmål»", "Ordforråd: ordet må passe i sammenhengen («Noe som også er viktig»)", "Gradbøyning / sammenligning", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["best", "komp", "konj", "uttr", "verb"]}, {"id": "L28-10", "src": "luke", "kind": "luke", "title": "De sterkeste dialektene (10/10)", "text": "§Sterke norske dialekter§ Talemålet i Oslo vest har nok tradisjonelt hatt [[stor/høy/størst/mest]] prestisje i Norge. I våre dager ser det ut til at det er dialekten i Oslo øst som har størst påvirkning på de lokale dialektene i Osloregionen. [[Begge]] disse to østlandsdialektene blir mye brukt på tv og i filmer, og folk hører dem derfor ganske ofte. De fleste kjenner også flere som [[snakker]] en av dem. Forsker Ann Kristin Molde studerer hva som skjer ved flytting om man har en av disse dialektene. §Utflyttede østlandsbarn som spesiell gruppe§ Hovedhypotesen hennes er at flere utflyttede østlandsbarn [[beholder]] dialekten enn innflyttere fra [[andre]] steder. Det [[kan]] være at østlandsbarna ikke føler et særlig [[sterkt]] press på å bytte dialekt fordi dialekten de [[snakker]], lett blir forstått av alle. En annen mulig grunn er at disse østlandske dialektene som nevnt oppleves som prestisjedialekter, og at de utflyttede østlandsbarna [[derfor/dermed]] ikke ønsker å endre talemålet sitt. Ann Kristin Molde håper med undersøkelsen sin å kunne gi et [[klart/tydelig]] bilde av hovedmønstrene i hva som kjennetegner og motiverer språkvalgene til innflyttere.", "blanks": [["stor", "høy", "størst", "mest"], ["Begge"], ["snakker"], ["beholder"], ["andre"], ["kan"], ["sterkt"], ["snakker"], ["derfor", "dermed"], ["klart", "tydelig"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («tradisjonelt hatt stor prestisje i»)", "Mengdeord / determinativ", "Verb i presens: velg et verb som passer i sammenhengen («flere som snakker en av»)", "Verb i presens: velg et verb som passer i sammenhengen («utflyttede østlandsbarn beholder dialekten enn»)", "Mengdeord / determinativ", "Modalverb + infinitiv", "Ordforråd: ordet må passe i sammenhengen («et særlig sterkt press på»)", "Ordforråd: ordet må passe i sammenhengen («dialekten de snakker , lett»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («gi et klart bilde av»)"], "tags": ["best", "konj", "verb"]}, {"id": "L29-1", "src": "luke", "kind": "luke", "title": "Hurtigruta (1/6)", "text": "En reise med hurtigruta langs [[den]] norske kysten kan være en interessant [[opplevelse/erfaring]]. Det er mye mer enn bare [[en]] vanlig båtreise. Turen tar elleve [[dager]] og ti netter fra Bergen i sør [[til]] Kirkenes i nordøst like ved den russiske [[grensen/grensa]]. Strekningen er på over 2500 sjømil, og [[hurtigruta/skipene/båtene]] anløper 35 havner. Hurtigruta går i [[all]] slags vær, i regn eller snø, [[sommer]] og vinter, gjennom åpne havstrekninger [[og]] smale sund. Den passerer Vestkapp og Nordkapp, [[høye/mange]] fjell, øyer og skjær.", "blanks": [["den"], ["opplevelse", "erfaring"], ["en"], ["dager"], ["til"], ["grensen", "grensa"], ["hurtigruta", "skipene", "båtene"], ["all"], ["sommer"], ["og"], ["høye", "mange"]], "labels": ["Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Ordforråd: ordet må passe i sammenhengen («en interessant opplevelse . Det»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Ordforråd: ordet må passe i sammenhengen («tar elleve dager og ti»)", "Preposisjon: «i sør til Kirkenes i»", "Ordforråd: ordet må passe i sammenhengen («den russiske grensen . Strekningen»)", "Ordforråd: ordet må passe i sammenhengen («sjømil, og hurtigruta anløper 35»)", "Mengdeord / determinativ", "Verb i presens: velg et verb som passer i sammenhengen («eller snø, sommer og vinter,»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («og Nordkapp, høye fjell, øyer»)"], "tags": ["best", "konj", "prep", "verb"]}, {"id": "L29-2", "src": "luke", "kind": "luke", "title": "Hurtigruta (2/6)", "text": "Den første [[hurtigruta]] var dampbåten Vesteraalen som gikk fra Trondheim til Hammerfest [[i]] 1893. Med den ble kommunikasjonene [[mye]] bedre. Brev som tidligere hadde [[brukt/tatt]] tre uker på denne strekningen [[om]] sommeren og fem måneder om [[vinteren]], kunne nå komme fram i løpet [[av]] noen få dager med hurtigruta.", "blanks": [["hurtigruta"], ["i"], ["mye"], ["brukt", "tatt"], ["om"], ["vinteren"], ["av"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («Den første hurtigruta var dampbåten»)", "Preposisjon: «til Hammerfest i 1893. Med»", "Ordforråd: ordet må passe i sammenhengen («ble kommunikasjonene mye bedre. Brev»)", "Perfektum partisipp", "Preposisjon: «denne strekningen om sommeren og»", "Ordforråd: ordet må passe i sammenhengen («måneder om vinteren , kunne»)", "Fast uttrykk: «i løpet av»"], "tags": ["part", "prep", "uttr"]}, {"id": "L29-3", "src": "luke", "kind": "luke", "title": "Hurtigruta (3/6)", "text": "Senere ble [[strekningen/ruten]] utvidet nordover og sørover og anløpsstedene ble [[flere]]. I 1898 kom Bergen med og [[ble]] det sørligste stedet for reisen. Hurtigruta [[var]] lenge den eneste forbindelsen som mange små [[steder/byer/plasser]] ved kysten hadde med verden utenfor; [[den]] kom med post og varer, men [[også]] med gjester fra andre land. Hver [[dag/gang]] kom noe nytt og samtidig noe kjent. [[Men]] tidene forandret seg, og etter hvert som [[landet/Norge/kysten/vi/man]] fikk broer, tunneler og flyplasser, mistet [[den/hurtigruta]] mye av sin betydning.", "blanks": [["strekningen", "ruten"], ["flere"], ["ble"], ["var"], ["steder", "byer", "plasser"], ["den"], ["også"], ["dag", "gang"], ["Men"], ["landet", "Norge", "kysten", "vi", "man"], ["den", "hurtigruta"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («Senere ble strekningen utvidet nordover»)", "Gradbøyning / sammenligning", "Passiv: bli + perfektum partisipp", "Verb i preteritum som passer i sammenhengen («reisen. Hurtigruta var lenge den»)", "Verb i presens: velg et verb som passer i sammenhengen («mange små steder ved kysten»)", "Ordforråd: ordet må passe i sammenhengen («verden utenfor; den kom med»)", "Ordforråd: ordet må passe i sammenhengen («varer, men også med gjester»)", "Ordforråd: ordet må passe i sammenhengen («land. Hver dag kom noe»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («hvert som landet fikk broer,»)", "Ordforråd: ordet må passe i sammenhengen («flyplasser, mistet den mye av»)"], "tags": ["komp", "konj", "pass", "verb"]}, {"id": "L29-4", "src": "luke", "kind": "luke", "title": "Hurtigruta (4/6)", "text": "Nå er [[det]] mest turister fra inn- og utland [[som]] reiser. Det er mange slags passasjerer [[om]] bord. Det kan være japanske amatørfotografer, [[tyske/franske/svenske/ osv.]] pensjonister eller unge amerikanere som vil [[oppleve/se]] midnattssola og Nordkapp, eller det kan [[være]] norske studenter som reiser hjem i [[ferien(e)/helgen(e)]].", "blanks": [["det"], ["som"], ["om"], ["tyske", "franske", "svenske", "osv."], ["oppleve", "se"], ["være"], ["ferien(e)", "helgen(e)"]], "labels": ["Perfektum partisipp", "Relativpronomen «som» innleder en leddsetning", "Fast uttrykk: «om bord»", "Ordforråd: ordet må passe i sammenhengen («japanske amatørfotografer, tyske pensjonister eller»)", "Verb i infinitiv", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («hjem i ferien(e) .»)"], "tags": ["konj", "part", "uttr", "verb"]}, {"id": "L29-5", "src": "luke", "kind": "luke", "title": "Hurtigruta (5/6)", "text": "På sin reise langs kysten [[stopper/stanser/anløper]] hurtigruta mange steder. Noen steder, særlig [[i]] byene, blir den gjerne liggende i [[mange/flere/noen]] timer, og det er mulig for [[passasjerene]] å ta seg en tur på [[land]] for å se seg om. Men [[det]] viktigste er likevel livet om bord.", "blanks": [["stopper", "stanser", "anløper"], ["i"], ["mange", "flere", "noen"], ["passasjerene"], ["land"], ["det"]], "labels": ["Verb i presens: velg et verb som passer i sammenhengen («langs kysten stopper hurtigruta mange»)", "Preposisjon: «steder, særlig i byene, blir»", "Mengdeord / determinativ", "Ordforråd: ordet må passe i sammenhengen («mulig for passasjerene å ta»)", "Fast uttrykk: «på land»", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L29-6", "src": "luke", "kind": "luke", "title": "Hurtigruta (6/6)", "text": "[[Et]] viktig symbol om bord på hurtigruta [[er]] postkassa som henger på veggen ved resepsjonen, og [[som]] tømmes med jevne mellomrom. På den [[måten]] kan ingen glemme at hurtigruta i [[mange/flere]] år hadde ansvar for at [[posten]] kom fram.", "blanks": [["Et"], ["er"], ["som"], ["måten"], ["mange", "flere"], ["posten"]], "labels": ["Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Verb i presens: velg et verb som passer i sammenhengen («på hurtigruta er postkassa som»)", "Relativpronomen «som» innleder en leddsetning", "Ordforråd: ordet må passe i sammenhengen («På den måten kan ingen»)", "Mengdeord / determinativ", "Ordforråd: ordet må passe i sammenhengen («for at posten kom fram.»)"], "tags": ["best", "konj", "verb"]}, {"id": "L30-1", "src": "luke", "kind": "luke", "title": "Den lange søvnen (1/7)", "text": "Når det begynner å [[bli]] mørkere om høsten, ønsker nok [[mange/noen/enkelte]] at de kunne slippe å stå opp og bare sove til våren kommer, slik som en del dyr gjør. Denne vintersøvnen hos dyr kalles dvale, og vi sier at dyrene går i dvale. Dvalen [[skyldes]] forandringer i lys og temperatur. [[I]] Norge går mange dyr og nesten [[alle]] insekter i dvale.", "blanks": [["bli"], ["mange", "noen", "enkelte"], ["skyldes"], ["I"], ["alle"]], "labels": ["Verb i infinitiv", "Mengdeord / determinativ", "Verb i presens: velg et verb som passer i sammenhengen («dvale. Dvalen skyldes forandringer i»)", "Preposisjon: «og temperatur. I Norge går»", "Mengdeord / determinativ"], "tags": ["best", "prep", "verb"]}, {"id": "L30-2", "src": "luke", "kind": "luke", "title": "Den lange søvnen (2/7)", "text": "Det finnes faktisk ingen felles kjennetegn [[for/hos/mellom]] dyr som går i dvale. Insekter blir enten underkjølt, [[eller]] de tørker inn. Hos mange dyr [[synker/senkes/faller]] kroppstemperaturen. Hos noen små [[dyr]] går kroppstemperaturen nesten ned mot null, [[men/mens]] hos større dyr, som bjørn og grevling, synker den bare noen [[få]] grader.", "blanks": [["for", "hos", "mellom"], ["eller"], ["synker", "senkes", "faller"], ["dyr"], ["men", "mens"], ["få"]], "labels": ["Preposisjon: «felles kjennetegn for dyr som»", "Konjunksjon/subjunksjon som binder sammen setningene", "Verb i presens: velg et verb som passer i sammenhengen («mange dyr synker kroppstemperaturen. Hos»)", "Ordforråd: ordet må passe i sammenhengen («noen små dyr går kroppstemperaturen»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Mengdeord / determinativ"], "tags": ["best", "konj", "prep", "verb"]}, {"id": "L30-3", "src": "luke", "kind": "luke", "title": "Den lange søvnen (3/7)", "text": "Før dyrene går i [[dvale]], må de legge på seg, slik at de kan overleve en hel vinter uten å spise. [[Ingen]] fugler går i dvale, for de må klare [[å]] fly. Derfor kan de ikke legge på [[seg]] så mye som det er nødvendig [[for]] å overleve en vinter i dvale.", "blanks": [["dvale"], ["Ingen"], ["å"], ["seg"], ["for"]], "labels": ["Fast uttrykk: «går i dvale»", "Mengdeord / determinativ", "Infinitivsmerke «å» foran verbet", "Fast uttrykk: «legge på seg»", "Fast uttrykk: «for å»"], "tags": ["best", "uttr", "verb"]}, {"id": "L30-4", "src": "luke", "kind": "luke", "title": "Den lange søvnen (4/7)", "text": "[[Dvalen]] har en viktig funksjon. Det kan nemlig [[være]] en god strategi for dyrene å gå i dvale hvis det er [[vanskelig/krevende]] å finne mat. Det gjelder spesielt [[hvis/når/der/hvor/om/dersom]] mulighetene til å vandre til [[andre/nye]] områder er små. For bjørnen, for [[eksempel]], kan det være vanskelig å [[finne/få]] mat om vinteren. Da er det lurt å [[legge]] seg til å sove.", "blanks": [["Dvalen"], ["være"], ["vanskelig", "krevende"], ["hvis", "når", "der", "hvor", "om", "dersom"], ["andre", "nye"], ["eksempel"], ["finne", "få"], ["legge"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («Dvalen har en»)", "Ordforråd: ordet må passe i sammenhengen («kan nemlig være en god»)", "Ordforråd: ordet må passe i sammenhengen («det er vanskelig å finne»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Mengdeord / determinativ", "Fast uttrykk: «for eksempel»", "Verb i infinitiv", "Verb i infinitiv"], "tags": ["best", "konj", "uttr", "verb"]}, {"id": "L30-5", "src": "luke", "kind": "luke", "title": "Den lange søvnen (5/7)", "text": "Men [[det/dvalen/dvale]] er også en farlig strategi, [[så/og]] det er nok derfor det bare [[er/finnes]] noen få dyrearter som gjør det. Hvis dyrene [[ikke]] greier å legge på seg nok i [[løpet]] av høsten, har de dårlige sjanser. Det er jo umulig å vite hvor lang [[vinteren/dvalen]] vil bli. Dessuten kan det komme rovdyr [[som]] kan grave seg inn og spise dem.", "blanks": [["det", "dvalen", "dvale"], ["så", "og"], ["er", "finnes"], ["ikke"], ["løpet"], ["vinteren", "dvalen"], ["som"]], "labels": ["Formelt subjekt «det» (eller utbrytning «det er … som»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («det bare er noen få»)", "Nektelse – betydning og plassering (i leddsetning foran verbet)", "Fast uttrykk: «i løpet av»", "Ordforråd: ordet må passe i sammenhengen («hvor lang vinteren vil bli.»)", "Relativpronomen «som» innleder en leddsetning"], "tags": ["konj", "uttr"]}, {"id": "L30-6", "src": "luke", "kind": "luke", "title": "Den lange søvnen (6/7)", "text": "Dyrene som [[går]] i dvale, våkner når temperaturen går [[opp]], og når dagene blir lengre, det vil si når vi får [[mer]] lys. I tillegg tror [[man/en/forskerne]] at noen av dyrene har [[en/ei]] indre hormonell klokke som forteller [[dem/dyrene]] at det er på tide å [[våkne]]. Oppvåkningen tar som regel noen få dager, [[men/mens/og]] enkelte insekter kan våkne i løpet [[av]] noen timer.", "blanks": [["går"], ["opp"], ["mer"], ["man", "en", "forskerne"], ["en", "ei"], ["dem", "dyrene"], ["våkne"], ["men", "mens", "og"], ["av"]], "labels": ["Fast uttrykk: «går i dvale»", "Ordforråd: ordet må passe i sammenhengen («temperaturen går opp , og»)", "Gradbøyning / sammenligning", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Pronomen: riktig form (subjekt/objekt) og referanse", "Verb i infinitiv", "Konjunksjon/subjunksjon som binder sammen setningene", "Fast uttrykk: «i løpet av»"], "tags": ["best", "komp", "konj", "uttr", "verb"]}, {"id": "L30-7", "src": "luke", "kind": "luke", "title": "Den lange søvnen (7/7)", "text": "Til en viss [[grad]] kan et dyr overleve uten å gå i dvale. [[Noen/Mange/Enkelte]] bjørner greier å overleve vinteren [[ved]] å finne mat istedenfor å gå og legge [[seg]]. Og det hender at man treffer på pinnsvin [[i]] desember. Så for noen dyr er det altså [[mulig]] å holde seg våken, men det ender [[som]] regel dårlig for de som prøver på [[det]]. Mange andre dyr, som for eksempel insekter, er hormonelt programmert til å gå i dvale, så de [[har]] ikke noe valg. Og flaggermus, for eksempel, er avhengige av å [[spise/ete/fange/finne]] insekter, så de ville ikke ha hatt noen [[sjanse/mulighet]] til å overleve en norsk vinter [[hvis/om/dersom]] de ikke gikk i dvale.", "blanks": [["grad"], ["Noen", "Mange", "Enkelte"], ["ved"], ["seg"], ["i"], ["mulig"], ["som"], ["det"], ["har"], ["spise", "ete", "fange", "finne"], ["sjanse", "mulighet"], ["hvis", "om", "dersom"]], "labels": ["Fast uttrykk: «til en viss grad»", "Mengdeord / determinativ", "Preposisjon: «overleve vinteren ved å finne»", "Fast uttrykk: «gå og legge seg»", "Preposisjon: «på pinnsvin i desember. Så»", "Ordforråd: ordet må passe i sammenhengen («det altså mulig å holde»)", "Fast uttrykk: «ender som regel»", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Ordforråd: ordet må passe i sammenhengen («så de har ikke noe»)", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («hatt noen sjanse til å»)", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["best", "konj", "prep", "uttr", "verb"]}, {"id": "L31-1", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (1/13)", "text": "Om få dager legger ekspedisjonen Kon-Tiki 2 ut på sin ferd mot Påskeøya. Mange nye og gamle spørsmål skal testes ut. Thor Heyerdahl (1914–2002) [[var]] en eksperimentell arkeolog, forfatter og eventyrer. Han [[ble]] kjent gjennom en ekspedisjon [[kalt]] «Kon-Tiki» i 1947, [[da/der]] han seilte 8000 km over Stillehavet i en håndbygget flåte fra Sør-Amerika [[til]] Tuamotuøyene. Ekspedisjonen skulle vise at folk for lenge [[siden]] kunne ha gjort lange sjøreiser [[og]] skapt kontakter mellom tilsynelatende separate kulturer. Han gjennomførte [[også]] andre seilaser med sivbåtene «Ra», «Ra II» og «Tigris» for å demonstrere muligheten for kontakt [[mellom]] vidt atskilte folkeslag [[i]] oldtiden.", "blanks": [["var"], ["ble"], ["kalt"], ["da", "der"], ["til"], ["siden"], ["og"], ["også"], ["mellom"], ["i"]], "labels": ["Verb i preteritum som passer i sammenhengen («Heyerdahl (1914–2002) var en eksperimentell»)", "Passiv: bli + perfektum partisipp", "Ordforråd: ordet må passe i sammenhengen («en ekspedisjon kalt «Kon-Tiki» i»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Preposisjon: «fra Sør-Amerika til Tuamotuøyene. Ekspedisjonen»", "Fast uttrykk: «for lenge siden»", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («Han gjennomførte også andre seilaser»)", "Preposisjon: «for kontakt mellom vidt atskilte»", "Preposisjon: «atskilte folkeslag i oldtiden.»"], "tags": ["konj", "pass", "prep", "uttr", "verb"]}, {"id": "L31-2", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (2/13)", "text": "Thor Heyerdahl fikk mye motbør i [[det]] vitenskapelige miljøet for de kontroversielle teoriene [[sine]], men folk [[flest]] lot seg fascinere av ekspedisjonsfareren og eventyreren. Teorien [[som]] Heyerdahl ville bevise med Kon-Tiki-ekspedisjonen, var [[at]] Polynesia hadde blitt befolket [[av]] mennesker som [[kom]] seilende fra Sør-Amerika.", "blanks": [["det"], ["sine"], ["flest"], ["som"], ["at"], ["av"], ["kom"]], "labels": ["Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Refleksivt eiendomspronomen «sin/si/sitt/sine» viser tilbake til subjektet", "Ordforråd: ordet må passe i sammenhengen («men folk flest lot seg»)", "Relativpronomen «som» innleder en leddsetning", "Konjunksjon/subjunksjon som binder sammen setningene", "Preposisjon: «blitt befolket av mennesker som»", "Verb i preteritum som passer i sammenhengen («mennesker som kom seilende fra»)"], "tags": ["best", "konj", "prep", "verb"]}, {"id": "L31-3", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (3/13)", "text": "DNA-studier har i ettertid vist at migrasjonen hovedsakelig gikk motsatt [[vei]], altså fra Polynesia til Sør-Amerika. Noen DNA-spor tyder likevel [[på]] at Heyerdahl hadde delvis [[rett]]. En ny DNA-studie bekrefter nemlig [[at]] den genetiske bakgrunnen hos Påskeøya-folket [[er]] polynesisk, men med 16 prosent europeisk innslag og 8 [[prosent]] fra amerikanske urfolk. Funnene er datert til perioden 1280–1490, altså trolig [[før]] Columbus sine erobrere inntok Amerika i 1492.", "blanks": [["vei"], ["på"], ["rett"], ["at"], ["er"], ["prosent"], ["før"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («gikk motsatt vei , altså»)", "Fast uttrykk: «tyder likevel på»", "Fast uttrykk: «delvis rett»", "Konjunksjon/subjunksjon som binder sammen setningene", "Verb i presens: velg et verb som passer i sammenhengen («hos Påskeøya-folket er polynesisk, men»)", "Ordforråd: ordet må passe i sammenhengen («og 8 prosent fra amerikanske»)", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["konj", "uttr", "verb"]}, {"id": "L31-4", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (4/13)", "text": "§Støtte og utfordre Heyerdahls teori§ [[I]] høst legger en ny gruppe forskere [[ut]] på ekspedisjon i Stillehavet [[for]] å undersøke Heyerdahls teorier nærmere. Men Kon-Tiki 2 skal ikke seile helt til Polynesia slik Heyerdahl [[gjorde]]. Det er derimot Påskeøya som er målet for reisen, og der [[skal]] flåtene snu og seile tilbake til Sør-Amerika. Ekspedisjonen har valgt denne ruten både for å støtte, men [[også]] for å utfordre, Heyerdahls teorier.", "blanks": [["I"], ["ut"], ["for"], ["gjorde"], ["skal"], ["også"]], "labels": ["Preposisjon: «Heyerdahls teori§ I høst legger»", "Ordforråd: ordet må passe i sammenhengen («gruppe forskere ut på ekspedisjon»)", "Fast uttrykk: «for å»", "Verb i preteritum som passer i sammenhengen («slik Heyerdahl gjorde . Det»)", "Modalverb + infinitiv", "Ordforråd: ordet må passe i sammenhengen («støtte, men også for å»)"], "tags": ["prep", "uttr", "verb"]}, {"id": "L31-5", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (5/13)", "text": "Målet [[for]] den opprinnelige Kon-Tiki-ekspedisjonen var for Heyerdahl å [[bevise]] at det var mulig å krysse store havstrekninger med en enkel, håndbygget [[flåte]]. Det klarte han. Han hadde også en [[teori]] om at Polynesia var befolket av [[folk]] som kom over havet [[fra]] Sør-Amerika. Hans teori var at søramerikanere måtte [[ha]] brukt flåter som ble drevet fram med vind og havstrømmer til Polynesia – og at [[det]] var umulig å komme tilbake til [[det]] stedet flåten reiste fra.", "blanks": [["for"], ["bevise"], ["flåte"], ["teori"], ["folk"], ["fra"], ["ha"], ["det"], ["det"]], "labels": ["Preposisjon: «Målet for den opprinnelige»", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («enkel, håndbygget flåte . Det»)", "Ordforråd: ordet må passe i sammenhengen («også en teori om at»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Preposisjon: «over havet fra Sør-Amerika. Hans»", "Ordforråd: ordet må passe i sammenhengen («søramerikanere måtte ha brukt flåter»)", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Ordforråd: ordet må passe i sammenhengen («tilbake til det stedet flåten»)"], "tags": ["best", "konj", "prep", "verb"]}, {"id": "L31-6", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (6/13)", "text": "Ekspedisjonslederen på Kon-Tiki 2, Torgeir Sæverud Higraff, mener imidlertid at flåtene har seilt [[begge]] veier, og han vil nå vise at det er mulig å [[seile/reise/dra]] tur–retur Påskeøya. Dessuten [[mener/tror]] han at de som krysset store havområder i tidlige [[tider]], seilte langt raskere [[enn]] det Heyerdahls ekspedisjon gjorde, og at de [[kunne]] styre båtene.", "blanks": [["begge"], ["seile", "reise", "dra"], ["mener", "tror"], ["tider"], ["enn"], ["kunne"]], "labels": ["Mengdeord / determinativ", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («Påskeøya. Dessuten mener han at»)", "Ordforråd: ordet må passe i sammenhengen («i tidlige tider , seilte»)", "Gradbøyning / sammenligning", "Modalverb + infinitiv"], "tags": ["best", "komp", "verb"]}, {"id": "L31-7", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (7/13)", "text": "§Nøklene til fart og styring§ Senkekjøler og styrepinner er viktige [[for]] å kunne bestemme farten til flåten og til å styre [[den]]. Man vet ikke [[sikkert/helt]] hvordan de gamle flåtene så [[ut]], men på samme måte som Heyerdahl har også [[denne]] ekspedisjonen [[brukt]] flere hundre år gamle tegninger [[av]] inka-flåter som inspirasjon i byggingen, i tillegg til at de [[har]] undersøkt arkeologiske [[funn]] av slike styrepinner og senkekjøler.", "blanks": [["for"], ["den"], ["sikkert", "helt"], ["ut"], ["denne"], ["brukt"], ["av"], ["har"], ["funn"]], "labels": ["Fast uttrykk: «for å»", "Ordforråd: ordet må passe i sammenhengen («å styre den . Man»)", "Ordforråd: ordet må passe i sammenhengen («vet ikke sikkert hvordan de»)", "Ordforråd: ordet må passe i sammenhengen («flåtene så ut , men»)", "Ordforråd: ordet må passe i sammenhengen («har også denne ekspedisjonen brukt»)", "Verb i preteritum som passer i sammenhengen («denne ekspedisjonen brukt flere hundre»)", "Preposisjon: «gamle tegninger av inka-flåter som»", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Ordforråd: ordet må passe i sammenhengen («undersøkt arkeologiske funn av slike»)"], "tags": ["prep", "uttr", "verb"]}, {"id": "L31-8", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (8/13)", "text": "I jakten på den best egnede flåtemodellen [[fikk]] båtbygger Ola Borgsfjord tidligere i høst i oppdrag å [[lage]] tre flåtemodeller. De tre modellene ble [[testet]] ut i Havlaboratoriet ved NTNU, og under testingen fikk forskerne bekreftet og avkreftet [[noen]] av antagelsene [[de]] hadde om konstruksjonen.", "blanks": [["fikk"], ["lage"], ["testet"], ["noen"], ["de"]], "labels": ["Verb i preteritum som passer i sammenhengen («egnede flåtemodellen fikk båtbygger Ola»)", "Verb i infinitiv", "Perfektum partisipp", "Mengdeord / determinativ", "Pronomen: riktig form (subjekt/objekt) og referanse"], "tags": ["best", "part", "verb"]}, {"id": "L31-9", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (9/13)", "text": "– Vi fikk bekreftet at det [[å]] gjøre stokkene spissere og rundere foran [[ga/gav]] flåten bedre fart. Det å gjøre selve baugen, framsiden av båten, spissere ga også [[en]] viss effekt, men ikke [[like]] mye som vi hadde [[trodd]]. Og vi fikk oss en aha-opplevelse når det [[gjaldt]] den bakre delen av flåten, for her [[hadde]] de ulike utformingene ingen effekt. Det samme gjaldt om det var mellomrom mellom stokkene i flåten eller [[ikke]]. Det ga heller ikke noen særlig [[effekt]], oppsummerer Håvard Holm. Noe som derimot gjorde en forskjell, [[var]] avrunding av alle skarpe kanter. Skarpe kanter på flåten [[gjør]] at man mister energi og framdrift.", "blanks": [["å"], ["ga", "gav"], ["en"], ["like"], ["trodd"], ["gjaldt"], ["hadde"], ["ikke"], ["effekt"], ["var"], ["gjør"]], "labels": ["Infinitivsmerke «å» foran verbet", "Verb i preteritum som passer i sammenhengen («rundere foran ga flåten bedre»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Gradbøyning / sammenligning", "Ordforråd: ordet må passe i sammenhengen («vi hadde trodd . Og»)", "Fast uttrykk: «når det gjaldt»", "Verb i preteritum som passer i sammenhengen («for her hadde de ulike»)", "Nektelse – betydning og plassering (i leddsetning foran verbet)", "Ordforråd: ordet må passe i sammenhengen («noen særlig effekt , oppsummerer»)", "Verb i preteritum som passer i sammenhengen («en forskjell, var avrunding av»)", "Ordforråd: ordet må passe i sammenhengen («på flåten gjør at man»)"], "tags": ["best", "komp", "konj", "uttr", "verb"]}, {"id": "L31-10", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (10/13)", "text": "§Tester ny teknologi§ Om bord på «Kon-Tiki 2» er [[det]] også forskjellige typer teknologisk utstyr. Dette teknologiske utstyret i flåten skal blant annet måle og registrere klorofyll og mengden planktonalger [[i]] vannet. Algene er havets gress og bidrar [[til]] at det kommer oksygen i havvannet og luften. Videre [[skal]] utstyret måle mineralpartikler i vannet, temperatur og hvor mye salt det er i havet.", "blanks": [["det"], ["i"], ["til"], ["skal"]], "labels": ["Perfektum partisipp", "Preposisjon: «mengden planktonalger i vannet. Algene»", "Fast uttrykk: «bidrar til»", "Modalverb + infinitiv"], "tags": ["part", "prep", "uttr", "verb"]}, {"id": "L31-11", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (11/13)", "text": "Fargen på havet skal [[også]] registreres. Havets [[farge]] påvirkes blant annet av planktonalger, og vi kan derfor få informasjon om [[hvordan]] algene bidrar til primærproduksjon. – Dette er en flott anledning [[for]] oss til å teste ut utstyr og vise fram Norge [[som]] teknologinasjon. Å utstyre et forskningsskip til å gjøre den samme forskningen [[ville]] ha kostet mange ganger så mye, [[sier/forteller]] Martin Ludvigsen ved Institutt for marin teknikk ved NTNU.", "blanks": [["også"], ["farge"], ["hvordan"], ["for"], ["som"], ["ville"], ["sier", "forteller"]], "labels": ["Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («registreres. Havets farge påvirkes blant»)", "Spørreord i indirekte spørsmål / leddsetning", "Preposisjon: «flott anledning for oss til»", "Relativpronomen «som» innleder en leddsetning", "Modalverb + infinitiv", "Ordforråd: ordet må passe i sammenhengen («så mye, sier Martin Ludvigsen»)"], "tags": ["konj", "prep", "verb"]}, {"id": "L31-12", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (12/13)", "text": "§Skoleklasser skal følge ekspedisjonen§ En viktig del av ekspedisjonen er å formidle og skape engasjement. Til [[tross]] for at Internett-forbindelsen til tider vil [[være]] svært dårlig, vil deltakerne på Kon-Tiki 2 være online stort [[sett]] hele ferden. Og de vil være tilgjengelige [[for]] folk som ønsker å [[komme]] i kontakt med dem. Håvard Holm ved NTNU er i ferd med å gjøre [[ferdig/klart]] et opplegg for skoleklasser, [[slik]] at ekspedisjonene kan integreres i undervisningen.", "blanks": [["tross"], ["være"], ["sett"], ["for"], ["komme"], ["ferdig", "klart"], ["slik"]], "labels": ["Fast uttrykk: «til tross for»", "Verb i infinitiv", "Fast uttrykk: «stort sett hele»", "Preposisjon: «være tilgjengelige for folk som»", "Verb i infinitiv", "Fast uttrykk: «gjøre ferdig»", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["konj", "prep", "uttr", "verb"]}, {"id": "L31-13", "src": "luke", "kind": "luke", "title": "Thor Heyerdahl (13/13)", "text": "– I og [[med]] at ekspedisjonsdeltakerne er tilgjengelige på Internett, kan skoleklasser være i dialog med dem, stille [[spørsmål]] og få direkte informasjon fra flåten. Det er en unik mulighet. Tenk deg at vi [[kunne]] ha kommunisert med Thor Heyerdahl [[mens]] han var ute på sin ekspedisjon, sier Holm.", "blanks": [["med"], ["spørsmål"], ["kunne"], ["mens"]], "labels": ["Fast uttrykk: «i og med»", "Fast uttrykk: «stille spørsmål»", "Modalverb + infinitiv", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["konj", "uttr", "verb"]}, {"id": "L32-1", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (1/7)", "text": "Alle vet at [[barn]] er ekstra glade i søtsaker, og forskere [[har]] nå funnet en sammenheng mellom godtesug og små barn [[som]] skal vokse seg store og sterke. - [[Barn]] er programmert til å like søtsaker [[fordi]] det leder dem mot mat med [[mye]] energi, sier den amerikanske professoren Danielle Reed i en [[artikkel]] i et internasjonalt tidsskrift. Artikkelen presenterer [[en]] studie der forskerne studerte nesten 150 [[barn/unger/ungdommer]] mellom 11 og 15 år.", "blanks": [["barn"], ["har"], ["som"], ["Barn"], ["fordi"], ["mye"], ["artikkel"], ["en"], ["barn", "unger", "ungdommer"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («vet at barn er ekstra»)", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Relativpronomen «som» innleder en leddsetning", "Ordforråd: ordet må passe i sammenhengen («sterke. - Barn er programmert»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («mat med mye energi, sier»)", "Ordforråd: ordet må passe i sammenhengen («i en artikkel i et»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Ordforråd: ordet må passe i sammenhengen («nesten 150 barn mellom 11»)"], "tags": ["best", "konj", "verb"]}, {"id": "L32-2", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (2/7)", "text": "De undersøkte [[hvor]] glade ungene var i sukker og [[hvordan]] dette utviklet seg etter hvert som [[de/ungene/barna]] ble større. De kom frem til [[at]] ungenes sug etter søtsaker hadde sammenheng [[med]] hvor mye de vokser, og at [[dette]] suget avtar etter hvert som de [[slutter]] å vokse.", "blanks": [["hvor"], ["hvordan"], ["de", "ungene", "barna"], ["at"], ["med"], ["dette"], ["slutter"]], "labels": ["Spørreord i indirekte spørsmål / leddsetning", "Spørreord i indirekte spørsmål / leddsetning", "Pronomen: riktig form (subjekt/objekt) og referanse", "Konjunksjon/subjunksjon som binder sammen setningene", "Fast uttrykk: «sammenheng med»", "Ordforråd: ordet må passe i sammenhengen («og at dette suget avtar»)", "Ordforråd: ordet må passe i sammenhengen («som de slutter å vokse.»)"], "tags": ["best", "konj", "uttr"]}, {"id": "L32-3", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (3/7)", "text": "- Vi vet nå at det [[å]] like søtsaker har sammenheng med det å [[vokse]]. Det neste skrittet er å identifisere [[hvilke]] faktorer som signaliserer til hjernen at [[barn/unger]] skal få lyst på sukker, sier Reed.", "blanks": [["å"], ["vokse"], ["hvilke"], ["barn", "unger"]], "labels": ["Infinitivsmerke «å» foran verbet", "Verb i infinitiv", "Spørreord i indirekte spørsmål / leddsetning", "Ordforråd: ordet må passe i sammenhengen («hjernen at barn skal få»)"], "tags": ["konj", "verb"]}, {"id": "L32-4", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (4/7)", "text": "Ernæringsekspert Hege Henriksen ved Universitetet i Oslo [[mener]] studien er interessant, og at det helt [[sikkert]] er en sammenheng mellom et behov for [[sukker]] og det å vokse. - En kropp [[som]] vokser trenger byggesteiner for å bli [[stor/større]], og i den prosessen er det et generelt [[behov]] for energi.", "blanks": [["mener"], ["sikkert"], ["sukker"], ["som"], ["stor", "større"], ["behov"]], "labels": ["Verb i presens: velg et verb som passer i sammenhengen («i Oslo mener studien er»)", "Ordforråd: ordet må passe i sammenhengen («det helt sikkert er en»)", "Verb i presens: velg et verb som passer i sammenhengen («behov for sukker og det»)", "Relativpronomen «som» innleder en leddsetning", "Ordforråd: ordet må passe i sammenhengen («å bli stor , og»)", "Fast uttrykk: «behov for»"], "tags": ["konj", "uttr", "verb"]}, {"id": "L32-5", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (5/7)", "text": "Problemet er bare at man [[ikke]] trenger tilsatt sukker, men karbohydrater som man [[finner]] i frukt, grønnsaker og grovbrød. - Dette er kroppens [[egen]] energikilde. Hjernen vår og alle cellene i [[kroppen]] trenger glukose, og det finner vi [[i]] karbohydrater, sier Berg Henriksen.", "blanks": [["ikke"], ["finner"], ["egen"], ["kroppen"], ["i"]], "labels": ["Nektelse – betydning og plassering (i leddsetning foran verbet)", "Verb i presens: velg et verb som passer i sammenhengen («som man finner i frukt,»)", "Ordforråd: ordet må passe i sammenhengen («er kroppens egen energikilde. Hjernen»)", "Ordforråd: ordet må passe i sammenhengen («cellene i kroppen trenger glukose,»)", "Preposisjon: «finner vi i karbohydrater, sier»"], "tags": ["konj", "prep", "verb"]}, {"id": "L32-6", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (6/7)", "text": "Hun mener at [[barns]] sug etter sjokolade og godteri er tillært, og at barn ikke [[må]] ha mer sukker enn voksne. Dessuten [[synes]] barn at frukt også er veldig [[godt]], så dette handler vel også mye [[om]] vaner og tradisjoner. Hun sier at sukkersug også [[kan]] forklares med at blodsukkernivået vårt må [[være]] stabilt. Erstatter man måltider med sjokolade, kaker eller godteri, [[går]] det nemlig bare en time eller to, og man er like [[sulten]] igjen.", "blanks": [["barns"], ["må"], ["synes"], ["godt"], ["om"], ["kan"], ["være"], ["går"], ["sulten"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («mener at barns sug etter»)", "Modalverb + infinitiv", "Verb i presens: velg et verb som passer i sammenhengen («voksne. Dessuten synes barn at»)", "Ordforråd: ordet må passe i sammenhengen («er veldig godt , så»)", "Preposisjon: «også mye om vaner og»", "Modalverb + infinitiv", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («eller godteri, går det nemlig»)", "Ordforråd: ordet må passe i sammenhengen («er like sulten igjen.»)"], "tags": ["prep", "verb"]}, {"id": "L32-7", "src": "luke", "kind": "luke", "title": "Derfor liker barn søtsaker (7/7)", "text": "Rent sukker gir bare energi, og [[ikke]] næringsstoffer som kroppen egentlig trenger. Vi [[må]] også huske at sukkeret i kaker [[og]] sjokolade vanligvis kommer i tillegg [[til]] alt annet man spiser. Man blir heller [[ikke]] så mett av å få i seg det [[sukkeret]] som er i for eksempel brus og [[sjokolade]], og når man ikke føler seg [[mett]], er det lett å spise mer. [[Da]] får man for mye energi, og [[om/hvis/dersom]] man da ikke får nok fysisk [[aktivitet]], så legger man på seg, avslutter Berg Henriksen.", "blanks": [["ikke"], ["må"], ["og"], ["til"], ["ikke"], ["sukkeret"], ["sjokolade"], ["mett"], ["Da"], ["om", "hvis", "dersom"], ["aktivitet"]], "labels": ["Nektelse – betydning og plassering (i leddsetning foran verbet)", "Modalverb + infinitiv", "Konjunksjon/subjunksjon som binder sammen setningene", "Fast uttrykk: «i tillegg til»", "Nektelse – betydning og plassering (i leddsetning foran verbet)", "Verb i preteritum: velg et verb som passer i sammenhengen («seg det sukkeret som er»)", "Ordforråd: ordet må passe i sammenhengen («brus og sjokolade , og»)", "Ordforråd: ordet må passe i sammenhengen («føler seg mett , er»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Preposisjon: «energi, og om man da»", "Ordforråd: ordet må passe i sammenhengen («nok fysisk aktivitet , så»)"], "tags": ["konj", "prep", "uttr", "verb"]}, {"id": "V-bli", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å bli (to become) → preteritum: ___ · perfektum: har ___", "ans": [["ble"], ["blitt"]], "tags": ["verb"], "expl": "Uregelrett: bli – ble – har blitt."}, {"id": "V-gå", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å gå (to go, to walk) → preteritum: ___ · perfektum: har ___", "ans": [["gikk"], ["gått"]], "tags": ["verb"], "expl": "Uregelrett: gå – gikk – har gått."}, {"id": "V-få", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å få (to get, to receive; may) → preteritum: ___ · perfektum: har ___", "ans": [["fikk"], ["fått"]], "tags": ["verb"], "expl": "Uregelrett: få – fikk – har fått."}, {"id": "V-gjøre", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å gjøre (to do, to make) → preteritum: ___ · perfektum: har ___", "ans": [["gjorde"], ["gjort"]], "tags": ["verb"], "expl": "Uregelrett: gjøre – gjorde – har gjort."}, {"id": "V-si", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å si (to say) → preteritum: ___ · perfektum: har ___", "ans": [["sa"], ["sagt"]], "tags": ["verb"], "expl": "Uregelrett: si – sa – har sagt."}, {"id": "V-spørre", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å spørre (to ask) → preteritum: ___ · perfektum: har ___", "ans": [["spurte"], ["spurt"]], "tags": ["verb"], "expl": "Vokalskifte ø → u: spørre – spurte – har spurt."}, {"id": "V-vite", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å vite (to know (a fact)) → preteritum: ___ · perfektum: har ___", "ans": [["visste"], ["visst"]], "tags": ["verb"], "expl": "Uregelrett: vite – visste – har visst (presens: vet)."}, {"id": "V-legge", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å legge (to lay, to put (down)) → preteritum: ___ · perfektum: har ___", "ans": [["la"], ["lagt"]], "tags": ["verb"], "expl": "Legge (å plassere noe) – la – har lagt. Ikke bland med ligge!"}, {"id": "V-ligge", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å ligge (to lie (be lying down)) → preteritum: ___ · perfektum: har ___", "ans": [["lå"], ["ligget"]], "tags": ["verb"], "expl": "Ligge (å være i liggende stilling) – lå – har ligget."}, {"id": "V-sette", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å sette (to set, to put) → preteritum: ___ · perfektum: har ___", "ans": [["satte"], ["satt"]], "tags": ["verb"], "expl": "Sette (å plassere) – satte – har satt. Ikke bland med sitte!"}, {"id": "V-sitte", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å sitte (to sit) → preteritum: ___ · perfektum: har ___", "ans": [["satt"], ["sittet"]], "tags": ["verb"], "expl": "Sitte – satt – har sittet. NB: preteritum «satt» er lik partisippet av «sette»."}, {"id": "V-stå", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å stå (to stand) → preteritum: ___ · perfektum: har ___", "ans": [["sto", "stod"], ["stått"]], "tags": ["verb"], "expl": "Stå – sto/stod – har stått."}, {"id": "V-ta", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å ta (to take) → preteritum: ___ · perfektum: har ___", "ans": [["tok"], ["tatt"]], "tags": ["verb"], "expl": "Ta – tok – har tatt."}, {"id": "V-gi", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å gi (to give) → preteritum: ___ · perfektum: har ___", "ans": [["ga", "gav"], ["gitt"]], "tags": ["verb"], "expl": "Gi – ga/gav – har gitt."}, {"id": "V-se", "src": "ny", "kind": "fill", "title": "Uregelrette verb", "q": "Bøy verbet: å se (to see) → preteritum: ___ · perfektum: har ___", "ans": [["så"], ["sett"]], "tags": ["verb"], "expl": "Se – så – har sett."}, {"id": "V-dra", "src": "ny", "kind": "fill"
