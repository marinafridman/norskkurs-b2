nde"], "tags": ["subadj"], "expl": "Presens partisipp (-ende) er ubøyelig."}, {"id": "N223", "src": "ny", "kind": "qa", "title": "", "q": "Bøy det substantiverte adjektivet: (en) gammel", "a": "en gammel – den gamle – gamle – de gamle", "alts": ["en gammel den gamle gamle de gamle"], "tags": ["subadj"], "expl": "«Gammel» har uregelrett bøying: gamle i bestemt form og flertall."}, {"id": "N224", "src": "ny", "kind": "qa", "title": "", "q": "Bøy det substantiverte adjektivet: (en) fremmed", "a": "en fremmed – den fremmede – fremmede – de fremmede", "alts": ["en fremmed den fremmede fremmede de fremmede"], "tags": ["subadj"], "expl": "Vi skal ikke snakke med fremmede."}, {"id": "N225", "src": "ny", "kind": "fill", "title": "", "q": "___ (ung) i dag bruker mye tid på sosiale medier. (alle unge som gruppe)", "ans": [["De unge"]], "tags": ["subadj"], "expl": "Substantivert adjektiv i bestemt flertall om en hel gruppe: de unge."}, {"id": "N226", "src": "ny", "kind": "fill", "title": "", "q": "Mange ___ (ansatt) er misfornøyde med lønna.", "ans": [["ansatte"]], "tags": ["subadj"], "expl": "Ubestemt flertall: ansatte."}, {"id": "N227", "src": "ny", "kind": "fill", "title": "", "q": "Sykehuset har ikke nok plass til alle ___ (syk).", "ans": [["de syke"]], "tags": ["subadj"], "expl": "Etter «alle» står det substantiverte adjektivet i bestemt form: alle de syke."}, {"id": "N228", "src": "ny", "kind": "fill", "title": "", "q": "En ___ (fremmed) banket på døra.", "ans": [["fremmed"]], "tags": ["subadj"], "expl": "Ubestemt entall: en fremmed."}, {"id": "N229", "src": "ny", "kind": "fill", "title": "", "q": "___ (død) ble begravet på fredag.", "ans": [["Den døde"]], "tags": ["subadj"], "expl": "Bestemt entall: den døde."}, {"id": "N230", "src": "ny", "kind": "fill", "title": "", "q": "Vi må hjelpe ___ (fattig).", "ans": [["de fattige"]], "tags": ["subadj"], "expl": "Bestemt flertall om gruppen: de fattige."}, {"id": "N231", "src": "ny", "kind": "fill", "title": "", "q": "Den ___ (tiltalt) nektet straffskyld.", "ans": [["tiltalte"]], "tags": ["subadj"], "expl": "Bestemt entall: den tiltalte."}, {"id": "N232", "src": "ny", "kind": "fill", "title": "", "q": "Vi vil takke alle ___ (frivillig).", "ans": [["frivillige"]], "tags": ["subadj"], "expl": "Etter «alle» kan man også bruke ubestemt form om en åpen gruppe: alle frivillige (eller alle de frivillige)."}, {"id": "N233", "src": "ny", "kind": "fill", "title": "", "q": "___ (viktig) er at du gjør ditt beste.", "ans": [["Det viktigste"]], "tags": ["subadj"], "expl": "Substantivert adjektiv i intetkjønn om noe abstrakt: det viktigste, det beste, det nye."}, {"id": "N234", "src": "ny", "kind": "fill", "title": "", "q": "Har du hørt noe ___ (ny)?", "ans": [["nytt"]], "tags": ["subadj"], "expl": "«Noe» + adjektiv i intetkjønn: noe nytt, noe godt, noe rart."}, {"id": "N235", "src": "ny", "kind": "fill", "title": "", "q": "Det ___ (rar) er at ingen merket noe.", "ans": [["rare"]], "tags": ["subadj"], "expl": "Substantivert adjektiv i bestemt form intetkjønn: det rare."}, {"id": "N236", "src": "ny", "kind": "fill", "title": "", "q": "Jeg har ingen ___ (kjent) i denne byen.", "ans": [["kjente"]], "tags": ["subadj"], "expl": "Ubestemt flertall: kjente (= folk jeg kjenner)."}, {"id": "N237", "src": "ny", "kind": "fill", "title": "", "q": "Hun er ___ (eldst) av de tre søstrene.", "ans": [["den eldste"]], "tags": ["subadj"], "expl": "Superlativ brukt substantivisk: den eldste."}, {"id": "N238", "src": "ny", "kind": "fill", "title": "", "q": "Mange ___ (voksen) har problemer med å lære nye språk.", "ans": [["voksne"]], "tags": ["subadj"], "expl": "Ubestemt flertall: voksne."}, {"id": "N239", "src": "ny", "kind": "fill", "title": "", "q": "Den ___ (skadd) ble kjørt til sykehuset.", "ans": [["skadde"]], "tags": ["subadj"], "expl": "Partisipp brukt som substantiv: den skadde."}, {"id": "N240", "src": "ny", "kind": "fill", "title": "", "q": "Politiet fant den ___ (stjele) sykkelen.", "ans": [["stjålne"]], "tags": ["part"], "expl": "Sterke verb med partisipp på -et (stjålet) får -ne i bestemt form og flertall: den stjålne sykkelen, stjålne sykler."}, {"id": "N241", "src": "ny", "kind": "fill", "title": "", "q": "En ___ (stjele) sykkel ble funnet i elva.", "ans": [["stjålet"]], "tags": ["part"], "expl": "Ubestemt entall: partisippet uforandret: en stjålet sykkel, et stjålet kjøretøy."}, {"id": "N242", "src": "ny", "kind": "fill", "title": "", "q": "Politiet har funnet mange ___ (stjele) sykler.", "ans": [["stjålne"]], "tags": ["part"], "expl": "Flertall av sterkt partisipp på -et → -ne: stjålne sykler."}, {"id": "N243", "src": "ny", "kind": "fill", "title": "", "q": "Han kjøpte en ___ (bruke) bil.", "ans": [["brukt"]], "tags": ["part"], "expl": "Partisipp på -t får ikke ekstra -t i intetkjønn og står uforandret i ubestemt entall: en brukt bil, et brukt hus."}, {"id": "N244", "src": "ny", "kind": "fill", "title": "", "q": "Vi kjøpte ___ (bruke) møbler.", "ans": [["brukte"]], "tags": ["part"], "expl": "Partisipp på -t får -e i flertall og bestemt form: brukte møbler, den brukte bilen."}, {"id": "N245", "src": "ny", "kind": "fill", "title": "", "q": "Vi spiste ___ (fryse) bær.", "ans": [["frosne"]], "tags": ["part"], "expl": "Fryse – frøs – frosset → bestemt form/flertall: frosne (frosne bær, den frosne innsjøen)."}, {"id": "N246", "src": "ny", "kind": "fill", "title": "", "q": "Han har et ___ (brekke) bein.", "ans": [["brukket"]], "tags": ["part"], "expl": "Ubestemt entall: et brukket bein."}, {"id": "N247", "src": "ny", "kind": "fill", "title": "", "q": "Etter ulykken hadde han to ___ (brekke) ribbein.", "ans": [["brukne"]], "tags": ["part"], "expl": "Brekke – brakk – brukket → flertall: brukne ribbein."}, {"id": "N248", "src": "ny", "kind": "fill", "title": "", "q": "I vinter har jeg hatt ___ (sprekke) lepper.", "ans": [["sprukne"]], "tags": ["part"], "expl": "Sprekke – sprakk – sprukket → flertall: sprukne lepper."}, {"id": "N249", "src": "ny", "kind": "fill", "title": "", "q": "De ___ (skrive) reglene er lette å følge, men de ___ (uskreven) er vanskeligere.", "ans": [["skrevne"], ["uskrevne"]], "tags": ["part"], "expl": "Skrive – skrev – skrevet → skrevne. «Uskrevne regler» = regler som alle kjenner, men som ikke står noe sted."}, {"id": "N250", "src": "ny", "kind": "fill", "title": "", "q": "Hun ga meg en bukett ___ (skjære) blomster.", "ans": [["skårne"]], "tags": ["part"], "expl": "Skjære – skar – skåret → skårne blomster."}, {"id": "N251", "src": "ny", "kind": "fill", "title": "", "q": "Jeg spiste et ___ (koke) egg til frokost.", "ans": [["kokt"]], "tags": ["part"], "expl": "Svakt verb (koke – kokte – kokt): et kokt egg."}, {"id": "N252", "src": "ny", "kind": "fill", "title": "", "q": "Vi serverte ___ (koke) poteter.", "ans": [["kokte"]], "tags": ["part"], "expl": "Flertall: kokte poteter."}, {"id": "N253", "src": "ny", "kind": "fill", "title": "", "q": "De bor i et nylig ___ (male) hus.", "ans": [["malt"]], "tags": ["part"], "expl": "Partisipp på -t: et malt hus (ingen ekstra -t)."}, {"id": "N254", "src": "ny", "kind": "fill", "title": "", "q": "De nylig ___ (åpne) butikkene trekker mange kunder.", "ans": [["åpnede", "åpnete"]], "tags": ["part"], "expl": "Svake verb med partisipp på -et får -ede eller -ete i bestemt form og flertall: åpnede/åpnete."}, {"id": "N255", "src": "ny", "kind": "fill", "title": "", "q": "Et ___ (synke) skip ble funnet på havbunnen.", "ans": [["sunket"]], "tags": ["part"], "expl": "Synke – sank – sunket. Ubestemt entall: et sunket skip."}, {"id": "N256", "src": "ny", "kind": "fill", "title": "", "q": "Dykkerne lette etter ___ (synke) skip.", "ans": [["sunkne"]], "tags": ["part"], "expl": "Flertall: sunkne skip."}, {"id": "N257", "src": "ny", "kind": "fill", "title": "", "q": "Han kom ___ (løpe) mot oss.", "ans": [["løpende"]], "tags": ["part"], "expl": "Presens partisipp (-ende) etter «komme»: kom løpende, kom syklende, kom gående."}, {"id": "N258", "src": "ny", "kind": "fill", "title": "", "q": "Hun er en svært ___ (love) student.", "ans": [["lovende"]], "tags": ["part"], "expl": "Presens partisipp brukt som adjektiv er ubøyelig: en lovende student, lovende resultater."}, {"id": "N259", "src": "ny", "kind": "fill", "title": "", "q": "Filmen var veldig ___ (spenne).", "ans": [["spennende"]], "tags": ["part"], "expl": "Presens partisipp: spennende – ingen bøying."}, {"id": "N260", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «for tiden»? Lag en setning.", "a": "For tiden = nå, i denne perioden. Eks.: Han jobber i Oslo for tiden.", "alts": [], "tags": ["uttr"], "expl": "Ikke bland med «for tida» i eldre tekster eller «i tide» (= ikke for sent)."}, {"id": "N261", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «et skritt i riktig retning»?", "a": "En forbedring – noe som går den veien man ønsker, selv om man ikke er i mål. Eks.: Den nye loven er et skritt i riktig retning.", "alts": [], "tags": ["uttr"], "expl": "Brukes ofte i politikk og debatt."}, {"id": "N262", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gå tapt»?", "a": "Å forsvinne, bli borte eller ødelagt. Eks.: Mye kunnskap har gått tapt.", "alts": [], "tags": ["uttr"], "expl": "Gå – gikk – har gått tapt."}, {"id": "N263", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å slå over til»?", "a": "Å skifte, plutselig begynne med noe annet. Eks.: Hun slo over til engelsk da hun så at jeg ikke forstod.", "alts": [], "tags": ["uttr"], "expl": "Slå – slo – har slått over til."}, {"id": "N264", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å komme godt ut av noe»?", "a": "Å klare seg bra i eller etter en situasjon. Eks.: Hun kom godt ut av intervjuet.", "alts": [], "tags": ["uttr"], "expl": "Motsatt: komme dårlig ut av noe."}, {"id": "N265", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «det stikk motsatte»?", "a": "Det helt motsatte. Eks.: Han sa ja, men gjorde det stikk motsatte.", "alts": [], "tags": ["uttr"], "expl": "«Stikk» forsterker: stikk i strid med = helt i strid med."}, {"id": "N266", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «på sikt»?", "a": "I det lange løp, etter en tid. Eks.: På sikt vil dette spare oss for penger.", "alts": [], "tags": ["uttr"], "expl": "Synonym: i det lange løp."}, {"id": "N267", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «i det hele tatt»?", "a": "Overhodet; eller: alt i alt. Eks.: Kommer han i det hele tatt?", "alts": [], "tags": ["uttr"], "expl": "Ofte i spørsmål og nektende setninger."}, {"id": "N268", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «til og med»?", "a": "Selv (= even). Eks.: Til og med læreren lo.", "alts": [], "tags": ["uttr"], "expl": "Kan også bety «inkludert»: fra mandag til og med fredag."}, {"id": "N269", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ta noe for gitt»?", "a": "Å tro at noe er selvsagt og ikke sette pris på det. Eks.: Vi tar ofte rent vann for gitt.", "alts": [], "tags": ["uttr"], "expl": "Ta – tok – har tatt."}, {"id": "N270", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gå ut over noen»?", "a": "At noe har negative følger for noen. Eks.: Kuttene går ut over elevene.", "alts": [], "tags": ["uttr"], "expl": "Ikke bland med «å gå ut» (= forlate et rom)."}, {"id": "N271", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ta hensyn til»?", "a": "Å tenke på andres behov eller på en faktor. Eks.: Vi må ta hensyn til naboene.", "alts": [], "tags": ["uttr"], "expl": "Fast preposisjon: til."}, {"id": "N272", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å få til»?", "a": "Å klare, lykkes med. Eks.: Jeg fikk ikke til oppgaven.", "alts": [], "tags": ["uttr"], "expl": "Få – fikk – har fått til."}, {"id": "N273", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å være i ferd med å»?", "a": "Å holde på å / skulle til å. Eks.: Butikken er i ferd med å stenge.", "alts": [], "tags": ["uttr"], "expl": "Brukes om noe som nettopp skjer eller snart skjer."}, {"id": "N274", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å stå overfor»?", "a": "Å møte (en utfordring eller et problem). Eks.: Landet står overfor store utfordringer.", "alts": [], "tags": ["uttr"], "expl": "Ofte med «utfordringer, et valg, et problem»."}, {"id": "N275", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å komme fram til»?", "a": "Å nå en konklusjon eller et resultat. Eks.: Forskerne kom fram til at …", "alts": [], "tags": ["uttr"], "expl": "Komme – kom – har kommet fram til."}, {"id": "N276", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ta stilling til»?", "a": "Å bestemme seg for hva man mener om noe. Eks.: Du må ta stilling til forslaget.", "alts": [], "tags": ["uttr"], "expl": "Vanlig i formelle tekster."}, {"id": "N277", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å få øynene opp for»?", "a": "Å begynne å legge merke til eller forstå noe. Eks.: Flere har fått øynene opp for sykling.", "alts": [], "tags": ["uttr"], "expl": "Noe man ikke så før."}, {"id": "N278", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å slå an»?", "a": "Å bli populær. Eks.: Den nye appen slo an blant unge.", "alts": [], "tags": ["uttr"], "expl": "Ikke bland med «slå av» (skru av) eller «slå opp»."}, {"id": "N279", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å slå opp»? (to betydninger)", "a": "1) Avslutte et kjæresteforhold. 2) Finne noe i en bok/ordbok.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Hun slo opp med kjæresten. / Slå opp ordet i ordboka."}, {"id": "N280", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ta seg av»?", "a": "Å passe på, ta ansvar for. Eks.: Hvem tar seg av barna?", "alts": [], "tags": ["uttr"], "expl": "Refleksivt: ta seg av."}, {"id": "N281", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gå i gang med»?", "a": "Å begynne med. Eks.: Vi går i gang med prosjektet i morgen.", "alts": [], "tags": ["uttr"], "expl": "Også: sette noen i gang med noe."}, {"id": "N282", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ha noe å si»?", "a": "Å bety noe, være viktig. Eks.: Det har ikke noe å si om du kommer sent.", "alts": [], "tags": ["uttr"], "expl": "Ofte nektet: det har ingenting å si."}, {"id": "N283", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å legge vekt på»?", "a": "Å synes at noe er viktig. Eks.: Skolen legger vekt på samarbeid.", "alts": [], "tags": ["uttr"], "expl": "Synonym: vektlegge."}, {"id": "N284", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «etter hvert»?", "a": "Gradvis, litt etter litt, etter en stund. Eks.: Etter hvert lærte hun seg norsk.", "alts": [], "tags": ["uttr"], "expl": "Står ofte først i setningen → inversjon."}, {"id": "N285", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «i stedet for»?", "a": "Istedenfor, som erstatning for. Eks.: Vi tok toget i stedet for bilen.", "alts": [], "tags": ["uttr"], "expl": "Med verb: i stedet for å + infinitiv."}, {"id": "N286", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «stort sett»?", "a": "For det meste, vanligvis. Eks.: Været var stort sett fint.", "alts": [], "tags": ["uttr"], "expl": "Synonym: for det meste, i det store og hele."}, {"id": "N287", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «mer eller mindre»?", "a": "Omtrent, nesten. Eks.: Jeg er mer eller mindre ferdig.", "alts": [], "tags": ["uttr"], "expl": ""}, {"id": "N288", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «så å si»?", "a": "Nesten, praktisk talt. Eks.: Det var så å si ingen der.", "alts": [], "tags": ["uttr"], "expl": ""}, {"id": "N289", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «med andre ord»?", "a": "Altså, sagt på en annen måte.", "alts": [], "tags": ["uttr"], "expl": "Brukes for å oppsummere eller forklare."}, {"id": "N290", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å komme på»? (to betydninger)", "a": "1) Å huske noe plutselig. 2) Å finne på en idé.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Jeg kom på at jeg hadde glemt nøklene. / Hun kom på en god løsning."}, {"id": "N291", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gi opp»?", "a": "Å slutte å prøve.", "alts": [], "tags": ["uttr"], "expl": "Gi – ga/gav – har gitt opp."}, {"id": "N292", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å være lei av»?", "a": "Å ha fått nok av, være trøtt av noe.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Jeg er lei av regnet."}, {"id": "N293", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å sette pris på»?", "a": "Å være glad for, verdsette.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Jeg setter stor pris på hjelpen."}, {"id": "N294", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ha råd til»?", "a": "Å ha nok penger til noe.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Vi har ikke råd til ny bil."}, {"id": "N295", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å legge merke til»?", "a": "Å se, oppdage, merke.", "alts": [], "tags": ["uttr"], "expl": "Legge – la – har lagt merke til."}, {"id": "N296", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gå rundt grøten»?", "a": "Å unngå å si det viktigste, snakke uklart.", "alts": [], "tags": ["uttr"], "expl": "Motsatt: komme til poenget."}, {"id": "N297", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å legge seg flat»?", "a": "Å innrømme feil og be om unnskyldning.", "alts": [], "tags": ["uttr"], "expl": "Vanlig om politikere og bedrifter."}, {"id": "N298", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «tidens tann»?", "a": "Tiden som sliter på og ødelegger ting.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Huset bar preg av tidens tann."}, {"id": "N299", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ta beina fatt»?", "a": "Å gå til fots.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Bussen kom ikke, så vi tok beina fatt."}, {"id": "N300", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å holde til»?", "a": "Å bo, ha tilholdssted.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Samene holder først og fremst til i Finnmark."}, {"id": "N301", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gå under»?", "a": "Å bli ødelagt, forsvinne, synke.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Atlantis skal ha gått under i en naturkatastrofe."}, {"id": "N302", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å slå seg ned»?", "a": "Å bosette seg et sted.", "alts": [], "tags": ["uttr"], "expl": "Eks.: De slo seg ned i Tromsø."}, {"id": "N303", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å komme an på»?", "a": "Å være avhengig av.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Det kommer an på været."}, {"id": "N304", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gjøre det godt»?", "a": "Å lykkes, klare seg bra.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Hun har gjort det godt som forfatter."}, {"id": "N305", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å gå seg vill»?", "a": "Å komme bort, ikke finne veien.", "alts": [], "tags": ["uttr"], "expl": "Gå – gikk – har gått seg vill."}, {"id": "N306", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «å ta del i»?", "a": "Å delta i.", "alts": [], "tags": ["uttr"], "expl": "Eks.: Alle kan ta del i debatten."}, {"id": "N307", "src": "ny", "kind": "fill", "title": "", "q": "Vi lærte ___ og ___, ikke alt på en gang.", "ans": [["litt"], ["litt"]], "tags": ["uttr"], "expl": "«Litt etter litt» = gradvis."}, {"id": "N308", "src": "ny", "kind": "fill", "title": "", "q": "Det var ___ og slett dumt gjort.", "ans": [["rett"]], "tags": ["uttr"], "expl": "«Rett og slett» = simpelthen."}, {"id": "N309", "src": "ny", "kind": "fill", "title": "", "q": "Han jobber i Tromsø ___ tiden.", "ans": [["for"]], "tags": ["uttr"], "expl": "«For tiden» = nå, i denne perioden."}, {"id": "N310", "src": "ny", "kind": "fill", "title": "", "q": "Mange gamle tradisjoner har gått ___.", "ans": [["tapt"]], "tags": ["uttr"], "expl": "«Gå tapt» = forsvinne."}, {"id": "N311", "src": "ny", "kind": "fill", "title": "", "q": "Han sa at han skulle hjelpe, men gjorde det ___ motsatte.", "ans": [["stikk"]], "tags": ["uttr"], "expl": "«Det stikk motsatte» = det helt motsatte."}, {"id": "N312", "src": "ny", "kind": "fill", "title": "", "q": "Hun slo ___ til norsk midt i samtalen.", "ans": [["over"]], "tags": ["uttr"], "expl": "«Slå over til» = skifte til."}, {"id": "N313", "src": "ny", "kind": "fill", "title": "", "q": "Laget kom godt ___ av sesongen.", "ans": [["ut"]], "tags": ["uttr"], "expl": "«Komme godt ut av» noe."}, {"id": "N314", "src": "ny", "kind": "fill", "title": "", "q": "Den nye avtalen er et skritt i ___ retning.", "ans": [["riktig"]], "tags": ["uttr"], "expl": "«Et skritt i riktig retning»."}, {"id": "N315", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «likevel»? Hva skjer med ordstillingen?", "a": "Likevel = allikevel, tross det. Adverb → inversjon når det står først: Det regnet. Likevel gikk vi tur.", "alts": [], "tags": ["konj"], "expl": "Kan erstattes med «selv om» + leddsetning: Selv om det regnet, gikk vi tur."}, {"id": "N316", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «dessuten»?", "a": "I tillegg, og så. Eks.: Leiligheten er stor. Dessuten er den billig.", "alts": [], "tags": ["konj"], "expl": "Adverb → inversjon: Dessuten er den …"}, {"id": "N317", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «derfor»? Ordstilling?", "a": "Av den grunn (følge). Adverb → inversjon: Jeg var syk. Derfor ble jeg hjemme.", "alts": [], "tags": ["konj"], "expl": "Kan skrives om med «så»: Jeg var syk, så jeg ble hjemme."}, {"id": "N318", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «uansett»?", "a": "Uavhengig av hva som skjer / i alle tilfeller. Eks.: Uansett hva du sier, drar jeg.", "alts": [], "tags": ["konj"], "expl": "«Uansett» + spørreord = uavhengig av: uansett vær, uansett hvor."}, {"id": "N319", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «slik at»?", "a": "Med det resultatet / den hensikten at. Eks.: Hun snakket sakte, slik at alle skulle forstå.", "alts": [], "tags": ["konj"], "expl": "Subjunksjon → leddsetning. Hensikt kan også uttrykkes med «for å»."}, {"id": "N320", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «gjorde at»?", "a": "Førte til at, var årsaken til at. Eks.: Snøen gjorde at flyet ble forsinket.", "alts": [], "tags": ["konj"], "expl": "Synonym: førte til at, resulterte i at."}, {"id": "N321", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «ettersom»?", "a": "Siden, fordi (årsak). Eks.: Ettersom det var sent, gikk vi hjem.", "alts": [], "tags": ["konj"], "expl": "Også: «etter hvert som» (= i takt med at)."}, {"id": "N322", "src": "ny", "kind": "qa", "title": "", "q": "Hva er de to betydningene av «mens»?", "a": "1) Samtidig som: Hun leste mens han lagde mat. 2) Kontrast (derimot): Jeg liker te, mens han liker kaffe.", "alts": [], "tags": ["konj"], "expl": "Subjunksjon → leddsetning."}, {"id": "N323", "src": "ny", "kind": "qa", "title": "", "q": "Hva er forskjellen på «for» og «fordi»?", "a": "Begge viser årsak. «For» er konjunksjon (hovedsetning: for jeg var syk). «Fordi» er subjunksjon (leddsetning: fordi jeg ikke var frisk).", "alts": [], "tags": ["konj"], "expl": "Etter «for» står «ikke» etter verbet; etter «fordi» står «ikke» foran verbet."}, {"id": "N324", "src": "ny", "kind": "qa", "title": "", "q": "Hva er forskjellen på «da» og «når»?", "a": "«Da» = én gang i fortiden (Da jeg var barn …). «Når» = gjentatt i fortiden, nå eller i framtiden (Når det regner …).", "alts": [], "tags": ["konj"], "expl": "Eks.: Hver gang jeg besøkte henne, … = «Når jeg besøkte henne, …»"}, {"id": "N325", "src": "ny", "kind": "qa", "title": "", "q": "Hva er forskjellen på «om» og «hvis»?", "a": "Begge kan bety betingelse (hvis/om du vil). Bare «om» kan innlede indirekte ja/nei-spørsmål: Han spør om jeg kommer.", "alts": [], "tags": ["konj"], "expl": "«Hvis» = dersom."}, {"id": "N326", "src": "ny", "kind": "qa", "title": "", "q": "Hva er de to betydningene av «så»?", "a": "1) Konjunksjon = følge (Jeg var sulten, så jeg spiste). 2) Adverb = deretter (Først spiste vi, så gikk vi).", "alts": [], "tags": ["konj"], "expl": "Som adverb først i setningen gir «så» inversjon: Så gikk vi."}, {"id": "N327", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «derimot»?", "a": "Men, på den andre siden (kontrast). Eks.: Han liker fotball. Hun, derimot, liker ski.", "alts": [], "tags": ["konj"], "expl": "Adverb."}, {"id": "N328", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «imidlertid»?", "a": "Men, likevel (formelt). Eks.: Planen var god. Den ble imidlertid ikke gjennomført.", "alts": [], "tags": ["konj"], "expl": "Brukes mest i skriftspråk."}, {"id": "N329", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «nemlig»?", "a": "Forklarer årsaken: «fordi, det er slik at». Eks.: Han kommer ikke. Han er nemlig syk.", "alts": [], "tags": ["konj"], "expl": "Står ikke først i setningen."}, {"id": "N330", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «altså»?", "a": "Det vil si, med andre ord / derfor. Eks.: Du kommer altså ikke?", "alts": [], "tags": ["konj"], "expl": "Brukes for å oppsummere eller konkludere."}, {"id": "N331", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «dermed»?", "a": "Derfor, som følge av det. Eks.: Han kom for sent og mistet dermed toget.", "alts": [], "tags": ["konj"], "expl": "Synonym: følgelig."}, {"id": "N332", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «med mindre»?", "a": "Hvis ikke. Eks.: Vi går tur, med mindre det regner.", "alts": [], "tags": ["konj"], "expl": "Subjunksjon → leddsetning."}, {"id": "N333", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «i og med at»?", "a": "Fordi, siden (om noe kjent). Eks.: I og med at du er her, kan vi begynne.", "alts": [], "tags": ["konj"], "expl": ""}, {"id": "N334", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «til tross for»?", "a": "Selv om, uten hensyn til. Med substantiv: til tross for regnet. Med setning: til tross for at det regnet.", "alts": [], "tags": ["konj"], "expl": "Synonym: tross."}, {"id": "N335", "src": "ny", "kind": "qa", "title": "", "q": "Hva betyr «ellers»?", "a": "1) Hvis ikke (Skynd deg, ellers kommer du for sent). 2) Bortsett fra det (Ellers er alt bra).", "alts": [], "tags": ["konj"], "expl": ""}, {"id": "N336", "src": "ny", "kind": "fill", "title": "", "q": "Det regnet hele dagen. ___ gikk vi en lang tur. (kontrast)", "ans": [["Likevel"]], "tags": ["konj"], "expl": "«Likevel» viser kontrast og gir inversjon: Likevel gikk vi …"}, {"id": "N337", "src": "ny", "kind": "fill", "title": "", "q": "Jeg var syk. ___ ble jeg hjemme fra jobben. (følge)", "ans": [["Derfor"]], "tags": ["konj"], "expl": "«Derfor» viser følge og gir inversjon."}, {"id": "N338", "src": "ny", "kind": "fill", "title": "", "q": "___ det regnet, gikk vi en tur. (= selv om)", "ans": [["Selv om"]], "tags": ["konj"], "expl": "«Selv om» innleder en innrømmelse i leddsetning."}, {"id": "N339", "src": "ny", "kind": "fill", "title": "", "q": "Jeg drikker ___ kaffe ___ te. (ingen av dem)", "ans": [["verken", "hverken"], ["eller"]], "tags": ["konj"], "expl": "«Verken … eller» = ikke det ene og ikke det andre."}, {"id": "N340", "src": "ny", "kind": "fill", "title": "", "q": "Du kan ___ ta bussen ___ toget. (ett av to)", "ans": [["enten"], ["eller"]], "tags": ["konj"], "expl": "«Enten … eller» = ett av to alternativer."}, {"id": "N341", "src": "ny", "kind": "fill", "title": "", "q": "Hun snakker ___ norsk ___ engelsk. (begge)", "ans": [["både"], ["og"]], "tags": ["konj"], "expl": "«Både … og» = det ene og det andre."}, {"id": "N342", "src": "ny", "kind": "fill", "title": "", "q": "Han spurte ___ jeg ville bli med på kino.", "ans": [["om"]], "tags": ["konj"], "expl": "Indirekte ja/nei-spørsmål innledes med «om»."}, {"id": "N343", "src": "ny", "kind": "fill", "title": "", "q": "___ jeg var liten, bodde vi i Trondheim.", "ans": [["Da"]], "tags": ["konj"], "expl": "«Da» om én periode/hendelse i fortiden."}, {"id": "N344", "src": "ny", "kind": "fill", "title": "", "q": "___ det snør, går vi på ski. (hver gang)", "ans": [["Når"]], "tags": ["konj"], "expl": "«Når» om noe som gjentas, eller om framtid."}, {"id": "N345", "src": "ny", "kind": "fill", "title": "", "q": "Hun studerte hardt, ___ hun skulle bestå eksamen.", "ans": [["slik at", "så"]], "tags": ["konj"], "expl": "«Slik at» / «så» uttrykker hensikt eller resultat."}, {"id": "N346", "src": "ny", "kind": "fill", "title": "", "q": "Jeg kan ikke komme, ___ jeg har en annen avtale.", "ans": [["for", "fordi"]], "tags": ["konj"], "expl": "«For» (konjunksjon) eller «fordi» (subjunksjon). Pass på ordstillingen hvis setningen har «ikke»."}, {"id": "N347", "src": "ny", "kind": "fill", "title": "", "q": "Leiligheten er stor og lys. ___ ligger den sentralt.", "ans": [["Dessuten"]], "tags": ["konj"], "expl": "«Dessuten» = i tillegg (inversjon: Dessuten ligger den …)."}, {"id": "N348", "src": "ny", "kind": "fill", "title": "", "q": "___ hva som skjer, skal jeg være der.", "ans": [["Uansett"]], "tags": ["konj"], "expl": "«Uansett» + spørreord = uavhengig av."}, {"id": "N349", "src": "ny", "kind": "fill", "title": "", "q": "Snøen ___ at flyet ble forsinket.", "ans": [["gjorde"]], "tags": ["konj"], "expl": "«Gjorde at» = førte til at."}, {"id": "N350", "src": "ny", "kind": "fill", "title": "", "q": "Vi drar på tur, ___ det regner. (= hvis det ikke regner)", "ans": [["med mindre"]], "tags": ["konj"], "expl": "«Med mindre» = hvis ikke."}, {"id": "N351", "src": "ny", "kind": "fill", "title": "", "q": "Hun leste avisen ___ han lagde frokost. (samtidig)", "ans": [["mens"]], "tags": ["konj"], "expl": "«Mens» = samtidig som."}, {"id": "N352", "src": "ny", "kind": "fill", "title": "", "q": "Han er like ___ (stor) som meg.", "ans": [["stor"]], "tags": ["sammenl"], "expl": "«Like + adjektiv + som» = samme grad. Adjektivet bøyes etter subjektet."}, {"id": "N353", "src": "ny", "kind": "fill", "title": "", "q": "Vi er like ___ (stor).", "ans": [["store"]], "tags": ["sammenl"], "expl": "Flertall subjekt → adjektivet i flertall: vi er like store."}, {"id": "N354", "src": "ny", "kind": "fill", "title": "", "q": "Huset ditt er like ___ (stor) som mitt.", "ans": [["stort"]], "tags": ["sammenl"], "expl": "Intetkjønn subjekt (huset) → stort."}, {"id": "N355", "src": "ny", "kind": "fill", "title": "", "q": "Søsteren min er like ___ (gammel) som meg.", "ans": [["gammel"]], "tags": ["sammenl"], "expl": "Entall: like gammel som …"}, {"id": "N356", "src": "ny", "kind": "fill", "title": "", "q": "Søsteren min og jeg er like ___ (gammel).", "ans": [["gamle"]], "tags": ["sammenl"], "expl": "Flertall: vi er like gamle."}, {"id": "N357", "src": "ny", "kind": "fill", "title": "", "q": "Oslo er større ___ Bergen.", "ans": [["enn"]], "tags": ["sammenl"], "expl": "Komparativ + «enn»."}, {"id": "N358", "src": "ny", "kind": "fill", "title": "", "q": "Bergen er ikke så stor ___ Oslo.", "ans": [["som"]], "tags": ["sammenl"], "expl": "«Ikke så + adjektiv + som»."}, {"id": "N359", "src": "ny", "kind": "fill", "title": "", "q": "Jeg har samme telefon ___ deg.", "ans": [["som"]], "tags": ["sammenl"], "expl": "«Samme … som»."}, {"id": "N360", "src": "ny", "kind": "fill", "title": "", "q": "Livet her er helt annerledes ___ i hjemlandet mitt.", "ans": [["enn"]], "tags": ["sammenl"], "expl": "«Annerledes enn»."}, {"id": "N361", "src": "ny", "kind": "fill", "title": "", "q": "Norsk er forskjellig ___ dansk i uttalen.", "ans": [["fra"]], "tags": ["sammenl"], "expl": "«Forskjellig fra». Også: «ulik»."}, {"id": "N362", "src": "ny", "kind": "fill", "title": "", "q": "Han likner ___ faren sin.", "ans": [["på"]], "tags": ["sammenl"], "expl": "«Likne på» noen."}, {"id": "N363", "src": "ny", "kind": "fill", "title": "", "q": "Kom så fort ___ mulig!", "ans": [["som"]], "tags": ["sammenl"], "expl": "«Så … som mulig»."}, {"id": "N364", "src": "ny", "kind": "fill", "title": "", "q": "Leiligheten vår er dobbelt så stor ___ den gamle.", "ans": [["som"]], "tags": ["sammenl"], "expl": "«Dobbelt så stor som»."}, {"id": "N365", "src": "ny", "kind": "fill", "title": "", "q": "Hun løper like ___ (fort) som broren sin.", "ans": [["fort"]], "tags": ["sammenl"], "expl": "Adverb med «like … som»: like fort som."}, {"id": "N366", "src": "ny", "kind": "fill", "title": "", "q": "De to søstrene er helt ___. (= identiske)", "ans": [["like"]], "tags": ["sammenl"], "expl": "«Like» (flertall av «lik») = nesten identiske."}, {"id": "N367", "src": "ny", "kind": "fill", "title": "", "q": "Han er ___ faren sin. (= ser ut som)", "ans": [["lik"]], "tags": ["sammenl"], "expl": "«Være lik noen» = likne på noen."}, {"id": "N368", "src": "ny", "kind": "fill", "title": "", "q": "Han er høyere enn ___. (jeg)", "ans": [["jeg", "meg"]], "tags": ["sammenl"], "expl": "Etter «enn» og «som» er både subjektsform (jeg) og objektsform (meg) godtatt."}, {"id": "N369", "src": "ny", "kind": "fill", "title": "", "q": "Sekken min er ___ tyngre ___ lettere enn din. (= like tung)", "ans": [["verken", "hverken"], ["eller"]], "tags": ["sammenl"], "expl": "«Verken tyngre eller lettere enn» = like tung som."}, {"id": "N370", "src": "ny", "kind": "fill", "title": "", "q": "Ståle er for svak. Han er ikke sterk ___ til å løfte sauen.", "ans": [["nok"]], "tags": ["sammenl"], "expl": "«Ikke + adjektiv + nok til å» = for + motsatt adjektiv."}, {"id": "N371", "src": "ny", "kind": "fill", "title": "", "q": "Det er ikke ___ kaldt i dag som i går.", "ans": [["så"]], "tags": ["sammenl"], "expl": "«Ikke så … som»."}, {"id": "N372", "src": "nyluke", "kind": "luke", "title": "Øvelse: Flytting", "text": "Da Amira kom [[til]] Norge for fem år [[siden]], kunne hun ikke et ord norsk. [[Etter]] hvert lærte hun språket, og nå snakker hun [[like]] godt som mange nordmenn. Hun bor i en liten leilighet i Bergen, og hun trives godt [[der]], [[selv]] om det regner mye. Hun er spesielt glad [[i]] fjellene rundt byen.", "blanks": [["til"], ["siden"], ["Etter"], ["like"], ["der"], ["selv"], ["i"]], "labels": ["Reise/komme til et sted", "For … siden = tid tilbake", "Fast uttrykk: etter hvert", "Like + adjektiv/adverb + som", "Stedsadverb: der (i leiligheten)", "Selv om = innrømmelse", "Glad i = være glad i (like godt)"], "tags": ["best", "konj", "prep"]}, {"id": "N373", "src": "nyluke", "kind": "luke", "title": "Øvelse: Innbrudd", "text": "I natt [[ble]] det begått innbrudd i en butikk i sentrum. Tyvene [[stjal]] penger og elektronikk for over 100 000 kroner. Politiet har [[funnet]] noen av de [[stjålne]] tingene i en bil utenfor byen, men tyvene har ennå ikke [[blitt]] tatt. Butikkeieren sier at hun er sjokkert: – Dette har aldri [[skjedd]] før.", "blanks": [["ble"], ["stjal"], ["funnet"], ["stjålne"], ["blitt"], ["skjedd"]], "labels": ["Upersonlig passiv i preteritum: det ble begått innbrudd", "Stjele – stjal – stjålet", "Har + partisipp: finne – fant – funnet", "Partisipp som adjektiv i flertall: stjålne", "Perfektum passiv: har blitt tatt", "Skje – skjedde – har skjedd"], "tags": ["pass", "verb", "part"]}, {"id": "N374", "src": "nyluke", "kind": "luke", "title": "Øvelse: Byer i Norge", "text": "Oslo er den [[største]] byen i Norge, og Bergen er den [[nest]] største. Bergen har [[færre]] innbyggere enn Oslo, men mange mener at Bergen er [[vakrere]]. Trondheim er ikke [[så]] stor som Bergen. [[Jo]] lenger nord man kommer, [[desto/jo]] mørkere blir vintrene.", "blanks": [["største"], ["nest"], ["færre"], ["vakrere"], ["så"], ["Jo"], ["desto", "jo"]], "labels": ["Superlativ med dobbel bestemmelse", "Nest + superlativ = nummer to", "Få – færre – færrest (tellbart)", "Vakker – vakrere – vakrest", "Ikke så … som", "Jo + komparativ", "desto/jo + komparativ"], "tags": ["komp", "sammenl"]}, {"id": "N375", "src": "nyluke", "kind": "luke", "title": "Øvelse: Ny jobb", "text": "Lise har nettopp begynt i ny jobb, og [[for]] tiden har hun mye å gjøre. Den første uken var vanskelig, men hun kom godt [[ut]] av det. Sjefen hennes legger stor vekt [[på]] samarbeid, og det setter Lise stor pris [[på]]. [[Dessuten]] er kollegaene hyggelige. Hun angrer ikke på at hun byttet jobb – [[tvert]] imot!", "blanks": [["for"], ["ut"], ["på"], ["på"], ["Dessuten"], ["tvert"]], "labels": ["For tiden = nå", "Komme godt ut av noe", "Legge vekt på", "Sette pris på", "Dessuten = i tillegg (inversjon)", "Tvert imot = det motsatte"], "tags": ["uttr", "konj"]}, {"id": "N376", "src": "nyluke", "kind": "luke", "title": "Øvelse: Helsevesenet", "text": "Sykehuset har ikke nok plass til alle [[de]] syke. Mange [[eldre]] må vente lenge på behandling, og de [[ansatte]] jobber mye overtid. Politikerne har lovet noe [[nytt]]: Et [[nytt]] sykehus skal bygges. Det [[viktigste]] nå er at pasientene får hjelp raskt.", "blanks": [["de"], ["eldre"], ["ansatte"], ["nytt"], ["nytt"], ["viktigste"]], "labels": ["Alle + de + substantivert adjektiv", "Substantivert komparativ: eldre (= eldre mennesker)", "Substantivert partisipp i bestemt flertall", "Noe + adjektiv i intetkjønn", "Et + adjektiv med -t", "Substantivert superlativ: det viktigste"], "tags": ["subadj", "best"]}, {"id": "N377", "src": "nyluke", "kind": "luke", "title": "Øvelse: Indirekte tale", "text": "Læreren spurte [[om]] alle hadde gjort leksene. Ahmed svarte at han ikke [[hadde]] rukket det. Læreren ville vite [[hvorfor]] han ikke hadde gjort dem. Ahmed forklarte at han [[hadde]] vært syk. Da sa læreren at han [[skulle]] levere dem neste dag, og at han [[ikke]] trengte å være bekymret.", "blanks": [["om"], ["hadde"], ["hvorfor"], ["hadde"], ["skulle"], ["ikke"]], "labels": ["Ja/nei-spørsmål → om", "Perfektum → pluskvamperfektum i indirekte tale", "Hv-spørsmål beholder spørreordet", "Perfektum → pluskvamperfektum", "Imperativ → skulle + infinitiv", "I leddsetning står «ikke» foran verbet"], "tags": ["indir", "konj"]}]</script>
<script>
"use strict";
const CARDS = JSON.parse(document.getElementById('cards-data').textContent);
const BY_ID = Object.fromEntries(CARDS.map(c=>[c.id,c]));
const TOPICS = {
  verb:'Uregelrette verb', prep:'Preposisjoner', best:'Bestemt/ubestemt form', komp:'Gradbøyning',
  pass:'Passiv', subadj:'Substantiverte adjektiv', part:'Partisipp som adjektiv', uttr:'Faste uttrykk',
  konj:'Konjunksjoner og bindeord', sammenl:'Sammenligning', indir:'Indirekte tale', tid:'Tidsuttrykk og perfektum',
  utbr:'Utbrytning og ordstilling', omskr:'Ordforråd og omskriving'
};
const SOURCES = {par:'Eksamen: parsetninger', luke:'Eksamen: lukeoppgaver', ny:'Nye kort', nyluke:'Nye lukeoppgaver'};
const BATCH = 15;
const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

/* ---------------- storage ---------------- */
const LS_KEY='nb2-progress-v1', LS_SESSION='nb2-session-v1', LS_FILTER='nb2-filter-v1';
let P = {cards:{}, history:[], updated:0};   // cards[id] = {b:box, s:seen, r:right, w:wrong, t:lastTs}
let syncState = 'local';
function lsGet(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function loadLocal(){const p=lsGet(LS_KEY); if(p&&p.cards) P=p;}
loadLocal();
function setSync(t){syncState=t; const el=document.getElementById('sync');
  el.textContent = t==='cloud' ? 'Fremgangen lagres på kontoen din og følger deg mellom enheter.' :
                   t==='loading' ? 'Henter lagret fremgang …' :
                   'Fremgangen lagres i denne nettleseren. Bruk «Eksporter» under Statistikk for å flytte den.';}
setSync('local');
function save(){
  P.updated=Date.now(); lsSet(LS_KEY,P);
}
function mergeInto(dst,src){
  for(const [id,s] of Object.entries(src.cards||{})){
    const d=dst.cards[id]; if(!d || (s.t||0)>(d.t||0)) dst.cards[id]=s;
  }
  const seen=new Set(dst.history.map(h=>h.ts));
  for(const h of src.history||[]) if(!seen.has(h.ts)) dst.history.push(h);
  dst.history.sort((a,b)=>a.ts-b.ts); dst.history=dst.history.slice(-300);
}

/* ---------------- filters & selection ---------------- */
let F = lsGet(LS_FILTER) || {topics:[], sources:['par','luke','ny','nyluke']};
function poolFor(f){
  return CARDS.filter(c => f.sources.includes(c.src) && (!f.topics.length || c.tags.some(t=>f.topics.includes(t))));
}
function weight(c){
  const s=P.cards[c.id]; const now=Date.now();
  if(!s) return 4;
  const W=[10,6,3.5,1.6,0.7,0.3]; let w=W[Math.min(s.b,5)];
  if(s.b===0 && s.w>0) w=12;
  const mins=(now-(s.t||0))/60000;
  if(mins<20 && s.b>0) w*=0.15; else if(mins<120 && s.b>1) w*=0.5;
  return w;
}
function pickBatch(pool, n){
  const chosen=[]; const items=pool.slice(); let luke=0;
  const lukeCap = pool.every(c=>c.kind==='luke') ? n : 3;
  while(chosen.length<n && items.length){
    let tot=0; const ws=items.map(c=>{const w=(c.kind==='luke'&&luke>=lukeCap)?0:weight(c); tot+=w; return w});
    if(tot<=0) break;
    let r=Math.random()*tot, i=0; for(;i<ws.length;i++){ r-=ws[i]; if(r<=0) break; }
    i=Math.min(i,items.length-1);
    const c=items.splice(i,1)[0]; if(c.kind==='luke') luke++; chosen.push(c.id);
  }
  return chosen;
}

/* ---------------- answer checking ---------------- */
function norm(s){
  return String(s||'').normalize('NFC').toLowerCase()
    .replace(/[«»“”"„]/g,'').replace(/[–—]/g,'-').replace(/[.,!?;:]/g,' ')
    .replace(/\s+/g,' ').trim();
}
function normVerb(s){ return norm(s).replace(/^har\s+/,''); }
function blankOk(val, alts, verb){
  const v = verb ? normVerb(val) : norm(val);
  if(!v) return false;
  return alts.some(a => (verb?normVerb(a):norm(a)) === v);
}
function assemblePair(c, vals){
  let i=0; return c.T.replace(/___/g, ()=> (vals[i++]||'').trim());
}

/* ---------------- session (one batch) ---------------- */
let S = lsGet(LS_SESSION);   // {ids, queue, first:{id:bool}, attempts:{id:[answers]}, again:[], wrongs:{}, start}
let view='home', cur=null, revealed=false, lastVals=[];
function startBatch(ids, label){
  if(!ids.length){ toast('Ingen kort passer til filteret.'); return }
  S={ids, queue:ids.slice(), first:{}, firstAns:{}, attempts:{}, again:[], label:label||'', start:Date.now()};
  lsSet(LS_SESSION,S); go('study');
}
function record(id, result){ // result: 'ok' | 'again' | 'bad'
  const firstTime = !(id in S.first);
  if(firstTime){
    S.first[id] = (result!=='bad');
    const s = P.cards[id] || {b:0,s:0,r:0,w:0,t:0};
    s.s++; s.t=Date.now();
    if(result==='ok'){ s.r++; s.b=Math.min(s.b+1,5); }
    else if(result==='again'){ s.r++; }
    else { s.w++; s.b=0; }
    P.cards[id]=s;
  } else if(result==='bad'){ const s=P.cards[id]; if(s){s.t=Date.now();} }
  (S.attempts[id] = S.attempts[id]||[]).push({vals:lastVals.slice(), res:result});
  S.queue.shift();
  if(result==='bad'){
    const pos=Math.min(S.queue.length, 3+Math.floor(Math.random()*3));
    S.queue.splice(pos,0,id);
  } else if(result==='again'){
    if(!S.again.includes(id)) S.again.push(id);
    const pos=Math.min(S.queue.length, 5+Math.floor(Math.random()*4));
    S.queue.splice(pos,0,id);
  }
  save(); lsSet(LS_SESSION,S);
  if(!S.queue.length) finishBatch(); else { revealed=false; render(); }
}
function finishBatch(){
  const right=S.ids.filter(id=>S.first[id]).length;
  P.history.push({ts:Date.now(), score:right, n:S.ids.length, mins:Math.round((Date.now()-S.start)/60000), label:S.label,
                   missed:S.ids.filter(id=>!S.first[id])});
  P.history=P.history.slice(-300); save();
  S.done=true; lsSet(LS_SESSION,S); go('summary');
}

/* ---------------- views ---------------- */
function go(v){ view=v; revealed=false; render(); window.scrollTo(0,0); }
function render(){
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('on', b.dataset.v===view || (view==='study'&&b.dataset.v==='home') || (view==='summary'&&b.dataset.v==='home')));
  const app=document.getElementById('app');
  if(view==='home') app.innerHTML=homeHTML();
  else if(view==='study') { if(!S||!S.queue||!S.queue.length){view='home';return render()} app.innerHTML=studyHTML(); afterStudyRender(); }
  else if(view==='summary') app.innerHTML=summaryHTML();
  else if(view==='stats') app.innerHTML=statsHTML();
}
function overall(){
  let seen=0, mastered=0, weak=0;
  for(const c of CARDS){const s=P.cards[c.id]; if(!s) continue; seen++; if(s.b>=3) mastered++; if(s.b===0&&s.w>0) weak++;}
  return {seen, mastered, weak, total:CARDS.length};
}
function homeHTML(){
  const o=overall(); const pool=poolFor(F);
  const tcount=t=>CARDS.filter(c=>F.sources.includes(c.src)&&c.tags.includes(t)).length;
  const scount=s=>CARDS.filter(c=>c.src===s&&(!F.topics.length||c.tags.some(t=>F.topics.includes(t)))).length;
  const resume = S && !S.done && S.queue && S.queue.length;
  const last = P.history.slice(-1)[0];
  return `
  <h1>God øving!</h1>
  <p class="muted">Runder på ${BATCH} kort. Kort du svarer feil på, kommer tilbake senere i samme runde. Kort du har bommet på før, dukker oftere opp i nye runder.</p>
  <div class="stats-strip">
    <div class="stat"><b>${o.total}</b><span>kort i banken</span></div>
    <div class="stat"><b>${o.seen}</b><span>kort du har øvd på</span></div>
    <div class="stat"><b>${o.mastered}</b><span>sitter godt (3+ riktige på rad)</span></div>
    <div class="stat"><b>${o.weak}</b><span>svake kort å øve på</span></div>
  </div>
  ${resume?`<div class="panel row" style="justify-content:space-between;margin-bottom:14px"><div><b>Du har en runde på gang.</b><br><span class="muted small">${S.ids.length - Object.keys(S.first).length} nye kort og ${S.queue.length} kort igjen i bunken.</span></div><div class="row"><button class="btn primary" onclick="go('study')">Fortsett</button><button class="btn ghost" onclick="S=null;lsSet(LS_SESSION,null);render()">Avbryt</button></div></div>`:''}
  <div class="panel">
    <h3 style="margin-top:0">Emner <span class="muted small">(ingen valgt = alle)</span></h3>
    <div class="chips">${Object.entries(TOPICS).map(([k,v])=>`<span class="chip ${F.topics.includes(k)?'on':''}" onclick="toggleTopic('${k}')">${esc(v)}<span class="n">${tcount(k)}</span></span>`).join('')}</div>
    <h3>Kilder</h3>
    <div class="chips">${Object.entries(SOURCES).map(([k,v])=>`<span class="chip ${F.sources.includes(k)?'on':''}" onclick="toggleSource('${k}')">${esc(v)}<span class="n">${scount(k)}</span></span>`).join('')}</div>
    <div class="row" style="margin-top:18px">
      <button class="btn primary" ${pool.length?'':'disabled'} onclick="startBatch(pickBatch(poolFor(F),BATCH),'')">Start runde (${Math.min(BATCH,pool.length)} kort)</button>
      <button class="btn" ${o.weak?'':'disabled'} onclick="startWeak()">Øv på feilene mine${o.weak?` (${o.weak})`:''}</button>
      <span class="muted small">${pool.length} kort passer til valget ditt.</span>
    </div>
  </div>
  ${last?`<p class="muted small" style="margin-top:14px">Forrige runde: <b>${last.score} av ${last.n}</b> riktige på første forsøk · ${new Date(last.ts).toLocaleString('nb-NO',{dateStyle:'medium',timeStyle:'short'})}</p>`:''}
  <div class="hint">Tastatur: <b>Enter</b> viser svaret (Shift+Enter gir ny linje i tekstfelt) · <b>1</b> riktig · <b>2</b> riktig, men vis igjen · <b>3</b> feil · <b>Tab</b> til neste luke.</div>`;
}
function toggleTopic(k){ F.topics = F.topics.includes(k)? F.topics.filter(x=>x!==k) : [...F.topics,k]; lsSet(LS_FILTER,F); render(); }
function toggleSource(k){ F.sources = F.sources.includes(k)? F.sources.filter(x=>x!==k) : [...F.sources,k]; if(!F.sources.length) F.sources=[k]; lsSet(LS_FILTER,F); render(); }
function startWeak(){
  const weak=CARDS.filter(c=>{const s=P.cards[c.id]; return s&&s.b===0&&s.w>0;});
  weak.sort((a,b)=>P.cards[b.id].w-P.cards[a.id].w || Math.random()-.5);
  const ids=shuffle(weak.slice(0,BATCH).map(c=>c.id));
  startBatch(ids,'Feilene mine');
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---- study ---- */
function tagLine(c){ return c.tags.map(t=>TOPICS[t]).filter(Boolean).slice(0,3).join(' · '); }
function blankInput(i, width){ return `<input class="blank" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${width}ch" aria-label="Luke ${i+1}">`; }
function cardBody(c){
  if(c.kind==='pair'){
    let i=0; const longest=Math.max(...c.alts.map(a=>a.length));
    const parts=c.T.split('___'); const per = Math.max(8, Math.min(30, Math.round((longest - c.T.replace(/___/g,'').length)/Math.max(1,parts.length-1))+4));
    const tpl = parts.map(p=>esc(p)).join('\u0000').replace(/\u0000/g,()=>blankInput(i++, per));
    return `<div class="pair"><p><span class="lbl">A</span>${esc(c.A)}</p><p><span class="lbl">B</span>${tpl}</p></div>
            <div class="muted small">Fyll ut det som mangler i B, slik at B får omtrent samme betydning som A.</div>`;
  }
  if(c.kind==='fill'){
    let i=0; const parts=c.q.split('___');
    const html=parts.map(esc).join('\u0000').replace(/\u0000/g,()=>{const a=c.ans[i]; const w=Math.max(6,Math.min(28,Math.max(...a.map(x=>x.length))+3)); return blankInput(i++,w)});
    return `<div class="q">${html}</div>`;
  }
  if(c.kind==='qa'){
    return `<div class="q">${esc(c.q)}</div><textarea class="answer" id="qa" placeholder="Skriv svaret ditt …"></textarea>`;
  }
  if(c.kind==='luke'){
    let i=0;
    const html=esc(c.text).replace(/§([^§]+)§/g,'<span class="head">$1</span>').replace(/\[\[(.*?)\]\]/g,(m,a)=>{const w=Math.max(5,Math.min(16,Math.max(...a.split('/').map(x=>x.length))+2)); return blankInput(i++,w)});
    return `<div class="muted small" style="margin-bottom:6px">Sett inn ett (1) ord i hver luke slik at teksten får en logisk sammenheng.</div><div class="luke">${html}</div>`;
  }
}
function kindLabel(c){
  return {pair:'Parsetning', fill: c.id.startsWith('V-')?'Verbbøying':'Fyll inn', qa:'Spørsmål', luke:'Lukeoppgave'}[c.kind];
}
function studyHTML(){
  const id=S.queue[0]; cur=BY_ID[id];
  const done=Object.keys(S.first).length; const pct=Math.round(100*done/S.ids.length);
  const isRepeat = id in S.first;
  return `
  <div class="progress"><span>${done} / ${S.ids.length}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${S.queue.length} igjen i bunken</span></div>
  <div class="card" id="card">
    <div class="kicker"><span>${kindLabel(cur)}${cur.title?' · '+esc(cur.title):''}${isRepeat?' · <span style="color:var(--bad)">på nytt</span>':''}</span><span class="tags">${esc(tagLine(cur))}</span></div>
    ${cardBody(cur)}
    <div id="reveal"></div>
    <div class="actions" id="actions">
      <button class="btn primary" onclick="reveal()">Vis svar <kbd>Enter</kbd></button>
      <button class="btn ghost" onclick="reveal(true)">Jeg vet ikke</button>
      <span style="flex:1"></span>
      <button class="btn ghost small" onclick="if(confirmQuit())go('home')">Avslutt runden</button>
    </div>
  </div>`;
}
function confirmQuit(){ return true; } // session is saved; user can resume from home
function afterStudyRender(){
  const first=document.querySelector('#card input.blank, #card textarea'); if(first) setTimeout(()=>{const a=document.activeElement; if(!a||a===document.body||a.tagName==='BUTTON') first.focus({preventScroll:true});},30);
}
function getVals(){
  if(cur.kind==='qa') return [document.getElementById('qa').value];
  return [...document.querySelectorAll('#card input.blank')].map(x=>x.value);
}
function reveal(gaveUp){
  if(revealed) return; revealed=true;
  lastVals=gaveUp? getVals().map(()=>'') : getVals();
  const c=cur; let allOk=false, html='';
  const inputs=[...document.querySelectorAll('#card input.blank')];
  inputs.forEach(x=>x.readOnly=true); const ta=document.getElementById('qa'); if(ta) ta.readOnly=true;
  if(c.kind==='pair'){
    const full=assemblePair(c,lastVals);
    allOk = c.alts.some(a=>norm(a)===norm(full));
    inputs.forEach(x=>x.classList.add(allOk?'ok':'bad'));
    html+=`<div class="fasit"><h4>Fasit</h4><b>${esc(c.B)}</b></div>`;
    html+=`<div class="why"><h4>Hvorfor</h4>${esc(c.expl)}</div>`;
  } else if(c.kind==='fill'){
    const verb=c.id.startsWith('V-'); let okN=0;
    inputs.forEach((x,i)=>{const ok=blankOk(lastVals[i],c.ans[i],verb); if(ok) okN++; x.classList.add(ok?'ok':'bad'); if(!ok) x.insertAdjacentHTML('afterend',`<span class="fix">${esc(c.ans[i].join(' / '))}</span>`)});
    allOk = okN===inputs.length;
    html+=`<div class="fasit"><h4>Fasit</h4><b>${esc(fillSolution(c))}</b></div><div class="why"><h4>Hvorfor</h4>${esc(c.expl)}</div>`;
  } else if(c.kind==='qa'){
    allOk = c.alts.length>0 && c.alts.some(a=>norm(a).replace(/-/g,' ').replace(/\s+/g,' ')===norm(lastVals[0]).replace(/-/g,' ').replace(/\s+/g,' '));
    html+=`<div class="fasit"><h4>Svar</h4><b>${esc(c.a)}</b></div>${c.expl?`<div class="why"><h4>Forklaring</h4>${esc(c.expl)}</div>`:''}`;
  } else if(c.kind==='luke'){
    let okN=0; const wrong=[];
    inputs.forEach((x,i)=>{const ok=blankOk(lastVals[i],c.blanks[i],false); if(ok) okN++; x.classList.add(ok?'ok':'bad');
      if(!ok){ x.insertAdjacentHTML('afterend',`<span class="fix">${esc(c.blanks[i].join('/'))}</span>`); wrong.push(i); }});
    allOk = okN===inputs.length;
    html+=`<div class="fasit"><h4>Resultat</h4><b>${okN} av ${inputs.length}</b> luker stemmer med fasiten.</div>`;
    if(wrong.length) html+=`<div class="why"><h4>Hvorfor</h4><ul class="mistakes">${wrong.map(i=>`<li><b>${esc(c.blanks[i].join(' / '))}</b>${lastVals[i]?` (du skrev «${esc(lastVals[i])}»)`:''}: ${esc(c.labels[i])}</li>`).join('')}</ul></div>`;
  }
  const verdict = allOk ? `<span class="verdict ok">Ser riktig ut!</span>` :
     (c.kind==='qa' && !c.alts.length) ? `<span class="verdict bad">Sammenlign med svaret og vurder selv</span>` :
     `<span class="verdict bad">Stemmer ikke helt med fasiten. Sjekk om svaret ditt likevel er riktig.</span>`;
  document.getElementById('reveal').innerHTML=`<div class="reveal">${verdict}${html}</div>`;
  document.getElementById('actions').innerHTML=`
    <button class="btn ok" onclick="record(cur.id,'ok')">Riktig <kbd>1</kbd></button>
    <button class="btn again" onclick="record(cur.id,'again')" title="Teller som riktig, men kortet kommer tilbake senere i runden">Riktig, men vis igjen <kbd>2</kbd></button>
    <button class="btn bad" onclick="record(cur.id,'bad')">Feil <kbd>3</kbd></button>`;
  const okBtn=document.querySelector(allOk?'.btn.ok':'.btn.bad'); if(okBtn) okBtn.focus({preventScroll:true});
}
function fillSolution(c){ let i=0; return c.q.replace(/___/g,()=>c.ans[i++].join('/')); }
document.addEventListener('keydown',e=>{
  if(view!=='study') return;
  if(!revealed){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); reveal(); }
    return;
  }
  if(e.key==='1'){e.preventDefault();record(cur.id,'ok')}
  else if(e.key==='2'){e.preventDefault();record(cur.id,'again')}
  else if(e.key==='3'){e.preventDefault();record(cur.id,'bad')}
});

/* ---- summary ---- */
function promptText(c){
  if(c.kind==='pair') return `<div><span class="muted">A:</span> ${esc(c.A)}<br><span class="muted">B:</span> ${esc(c.T)}</div>`;
  if(c.kind==='fill') return `<div>${esc(c.q)}</div>`;
  if(c.kind==='qa') return `<div>${esc(c.q)}</div>`;
  return `<div class="muted">${esc(c.title)}</div>`;
}
function yourAnswer(c, vals){
  if(c.kind==='pair') return assemblePair(c,vals)||'—';
  if(c.kind==='fill') return vals.map(v=>v||'…').join(' · ');
  if(c.kind==='qa') return vals[0]||'—';
  return null;
}
function missBlock(c){
  const att=(S.attempts[c.id]||[]); const firstA=att[0]; const vals=firstA?firstA.vals:[];
  let body='';
  if(c.kind==='luke'){
    const wrong=c.blanks.map((b,i)=>i).filter(i=>!blankOk(vals[i],c.blanks[i],false));
    body=`<ul class="mistakes">${wrong.map(i=>`<li><span class="yours">${esc(vals[i]||'—')}</span> → <span class="right"><b>${esc(c.blanks[i].join(' / '))}</b></span>: ${esc(c.labels[i])}</li>`).join('')}</ul>`;
    if(!wrong.length) body='<p class="small muted">Alle lukene stemte med fasiten, men du markerte kortet som feil.</p>';
  } else {
    const sol = c.kind==='pair'? c.B : c.kind==='fill'? fillSolution(c) : c.a;
    body=`<div class="small">Ditt svar: <span class="yours">${esc(yourAnswer(c,vals))}</span></div>
          <div class="small">Fasit: <span class="right"><b>${esc(sol)}</b></span></div>
          ${c.expl?`<div class="why small" style="margin-top:6px"><b>Hvorfor:</b> ${esc(c.expl)}</div>`:''}`;
  }
  const tries=att.length;
  return `<div class="miss"><div class="kicker"><span>${kindLabel(c)}${c.title?' · '+esc(c.title):''}</span><span class="tags">${esc(tagLine(c))}${tries>1?` · ${tries} forsøk`:''}</span></div>${promptText(c)}${body}</div>`;
}
function summaryHTML(){
  if(!S) return homeHTML();
  const right=S.ids.filter(id=>S.first[id]).length, n=S.ids.length;
  const missed=S.ids.filter(id=>!S.first[id]).map(id=>BY_ID[id]);
  const again=S.again.filter(id=>S.first[id]).map(id=>BY_ID[id]);
  const mins=Math.max(1,Math.round((Date.now()-S.start)/60000));
  const byTopic={}; missed.forEach(c=>c.tags.forEach(t=>byTopic[t]=(byTopic[t]||0)+1));
  const topWeak=Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([t,k])=>`${TOPICS[t]} (${k})`).join(', ');
  return `
  <div class="panel">
    <div class="row" style="justify-content:space-between;align-items:flex-end">
      <div><div class="muted small">Riktige på første forsøk</div><div class="score">${right}<span class="muted" style="font-size:1.4rem"> / ${n}</span></div></div>
      <div class="muted small" style="text-align:right">${Math.round(100*right/n)} % · ${mins} min${S.label?` · ${esc(S.label)}`:''}</div>
    </div>
    ${missed.length?`<p class="small" style="margin-bottom:0">Du bommet mest på: <b>${esc(topWeak)}</b>.</p>`:`<p class="small" style="margin-bottom:0">Alle riktige på første forsøk – sterkt!</p>`}
    <div class="row" style="margin-top:16px">
      <button class="btn primary" onclick="startBatch(pickBatch(poolFor(F),BATCH),'')">Ny runde</button>
      ${missed.length?`<button class="btn" onclick="startBatch(shuffle(${JSON.stringify(missed.map(c=>c.id))}),'Bommet i forrige runde')">Øv på disse ${missed.length} igjen</button>`:''}
      <button class="btn ghost" onclick="S=null;lsSet(LS_SESSION,null);go('home')">Til start</button>
    </div>
  </div>
  ${missed.length?`<h2>Dette bommet du på</h2>${missed.map(missBlock).join('')}`:''}
  ${again.length?`<h2>Riktig, men lagt tilbake</h2><p class="muted small">Disse svarte du riktig på, men valgte å se igjen.</p>${again.map(c=>`<div class="miss">${promptText(c)}</div>`).join('')}`:''}`;
}

/* ---- stats ---- */
function statsHTML(){
  const rows=Object.entries(TOPICS).map(([t,name])=>{
    const cs=CARDS.filter(c=>c.tags.includes(t)); let seen=0,m=0,r=0,w=0;
    cs.forEach(c=>{const s=P.cards[c.id]; if(s){seen++; if(s.b>=3)m++; r+=s.r; w+=s.w;}});
    const acc=(r+w)?Math.round(100*r/(r+w)):null;
    return `<tr><td>${esc(name)}</td><td class="num">${cs.length}</td><td class="num">${seen}</td><td class="num">${m}</td><td class="num">${acc===null?'–':acc+' %'}</td><td><span class="mini"><i style="width:${cs.length?Math.round(100*m/cs.length):0}%"></i></span></td></tr>`;
  }).join('');
  const weakest=CARDS.filter(c=>P.cards[c.id]&&P.cards[c.id].w>0).sort((a,b)=>(P.cards[b.id].w-P.cards[b.id].r/2)-(P.cards[a.id].w-P.cards[a.id].r/2)).slice(0,12);
  const hist=P.history.slice(-20).reverse();
  return `
  <h1>Statistikk</h1>
  <div class="panel">
    <h3 style="margin-top:0">Per emne</h3>
    <table><thead><tr><th>Emne</th><th class="num">Kort</th><th class="num">Øvd</th><th class="num">Sitter</th><th class="num">Treff</th><th>Mestret</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted small">«Sitter» = riktig minst tre runder på rad. «Treff» = andel riktige svar (første forsøk i hver runde). Ett kort kan høre til flere emner.</p>
  </div>
  <h2>Siste runder</h2>
  ${hist.length?`<div class="panel"><table><thead><tr><th>Når</th><th class="num">Riktige</th><th class="num">Min</th><th>Bommet på</th></tr></thead><tbody>${hist.map(h=>`<tr><td>${new Date(h.ts).toLocaleString('nb-NO',{dateStyle:'short',timeStyle:'short'})}${h.label?`<br><span class="muted small">${esc(h.label)}</span>`:''}</td><td class="num">${h.score}/${h.n}</td><td class="num">${h.mins||1}</td><td class="small">${(h.missed||[]).map(id=>BY_ID[id]).filter(Boolean).map(c=>esc(shortName(c))).join(' · ')||'–'}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted">Ingen runder ennå.</p>`}
  <h2>Kortene du sliter mest med</h2>
  ${weakest.length?`<div class="panel"><table><tbody>${weakest.map(c=>{const s=P.cards[c.id];return `<tr><td>${esc(shortName(c))}<br><span class="muted small">${esc(tagLine(c))}</span></td><td class="num small">${s.w} feil · ${s.r} riktig</td></tr>`}).join('')}</tbody></table>
  <div class="row" style="margin-top:12px"><button class="btn" onclick="startBatch(shuffle(${JSON.stringify(weakest.map(c=>c.id))}),'Vanskeligste kort')">Øv på disse</button></div></div>`:`<p class="muted">Ingen feil registrert ennå.</p>`}
  <h2>Lagring</h2>
  <div class="panel">
    <p class="small" style="margin-top:0">Fremgangen lagres i denne nettleseren. Vil du flytte den til en annen enhet, eksporterer du her og limer inn der.</p>
    <div class="row"><button class="btn" onclick="exportDlg()">Eksporter fremgang</button><button class="btn" onclick="importDlg()">Importer</button><button class="btn ghost" onclick="resetDlg()">Nullstill alt</button></div>
  </div>`;
}
function shortName(c){
  if(c.kind==='pair') return c.A;
  if(c.kind==='luke') return c.title;
  const t = c.q.replace(/___/g,'…'); return t.length>90? t.slice(0,88)+'…' : t;
}
function dlg(html){ const d=document.createElement('div'); d.className='dlg'; d.innerHTML=`<div class="panel">${html}</div>`; d.addEventListener('click',e=>{if(e.target===d)d.remove()}); document.body.appendChild(d); return d; }
function exportDlg(){
  const d=dlg(`<h3 style="margin-top:0">Eksporter fremgang</h3><p class="small muted">Kopier teksten og lim den inn under «Importer» på den andre enheten.</p><textarea readonly>${esc(JSON.stringify(P))}</textarea><div class="row" style="margin-top:10px"><button class="btn primary" id="cp">Kopier</button><button class="btn ghost" id="cl">Lukk</button></div>`);
  d.querySelector('#cl').onclick=()=>d.remove();
  d.querySelector('#cp').onclick=async()=>{ try{await navigator.clipboard.writeText(JSON.stringify(P)); d.querySelector('#cp').textContent='Kopiert!';}catch(e){ d.querySelector('textarea').select(); d.querySelector('#cp').textContent='Merk og kopier manuelt'; } };
}
function importDlg(){
  const d=dlg(`<h3 style="margin-top:0">Importer fremgang</h3><p class="small muted">Lim inn eksportert tekst. Den slås sammen med fremgangen du har her.</p><textarea id="imp"></textarea><p class="small" id="msg"></p><div class="row"><button class="btn primary" id="ok">Importer</button><button class="btn ghost" id="cl">Avbryt</button></div>`);
  d.querySelector('#cl').onclick=()=>d.remove();
  d.querySelector('#ok').onclick=()=>{ try{ const p=JSON.parse(d.querySelector('#imp').value); if(!p.cards) throw 0; mergeInto(P,p); save(); d.remove(); render(); }catch(e){ d.querySelector('#msg').textContent='Teksten kunne ikke leses. Sjekk at du har kopiert alt.'; } };
}
function resetDlg(){
  const d=dlg(`<h3 style="margin-top:0">Nullstille all fremgang?</h3><p class="small">All historikk og alle kortresultater slettes. Dette kan ikke angres.</p><div class="row"><button class="btn bad" id="ok">Ja, nullstill</button><button class="btn ghost" id="cl">Avbryt</button></div>`);
  d.querySelector('#cl').onclick=()=>d.remove();
  d.querySelector('#ok').onclick=()=>{ P={cards:{},history:[],updated:Date.now()}; S=null; lsSet(LS_SESSION,null); save(); d.remove(); render(); };
}
function toast(t){ const d=dlg(`<p style="margin:0">${esc(t)}</p><div class="row" style="margin-top:12px"><button class="btn" onclick="this.closest('.dlg').remove()">OK</button></div>`); }

if(S && S.done) S=null;
render();
</script>
</body>
</html>
