<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UiB Norsk trinn 3 – flashcards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --paper:#fffdf8; --ink:#1f2a37; --muted:#6b7280; --line:#e4ddd0;
  --fjord:#1e4e79; --fjord-soft:#e3ecf5; --ok:#2f7d4f; --ok-soft:#e2f2e8; --bad:#b4442f; --bad-soft:#f9e4de;
  --warn:#9a6a10; --warn-soft:#fbf0d6; --radius:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
.wrap{max-width:820px;margin:0 auto;padding:20px 16px 80px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:Fraunces,serif;font-weight:650;font-size:1.35rem;letter-spacing:-.01em;cursor:pointer}
.brand small{display:block;font-family:"Atkinson Hyperlegible";font-weight:400;font-size:.8rem;color:var(--muted);letter-spacing:0}
nav.tabs button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{border-color:var(--line);background:var(--paper);color:var(--ink)}
h1,h2,h3{font-family:Fraunces,serif;font-weight:650;letter-spacing:-.01em;line-height:1.2}
h1{font-size:2rem;margin:.2em 0 .3em} h2{font-size:1.35rem;margin:1.4em 0 .5em} h3{font-size:1.05rem;margin:1em 0 .4em}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.muted{color:var(--muted)} .small{font-size:.86rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:700;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--fjord);border-color:var(--fjord);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.again{background:var(--fjord-soft);border-color:#c5d6e8;color:var(--fjord)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}
.btn kbd{font-family:inherit;font-weight:400;font-size:.75rem;opacity:.75;margin-left:6px;border:1px solid currentColor;border-radius:4px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.92rem;user-select:none}
.chip.on{background:var(--fjord);border-color:var(--fjord);color:#fff}
.chip .n{opacity:.65;font-size:.8rem;margin-left:4px}
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:Fraunces,serif;font-size:1.6rem;line-height:1.1}
.stat span{font-size:.82rem;color:var(--muted)}
@media(max-width:600px){.stats-strip{grid-template-columns:repeat(2,1fr)} h1{font-size:1.6rem}}
/* study */
.progress{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:.9rem;color:var(--muted)}
.bar{flex:1;height:8px;background:#e8e1d3;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fjord);transition:width .3s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px 22px 18px;box-shadow:0 1px 0 #e9e2d4, 0 8px 24px -16px rgba(30,40,60,.25)}
.kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--fjord);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;gap:10px}
.kicker .tags{color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
.pair .lbl{display:inline-block;width:1.6em;font-weight:700;color:var(--fjord)}
.pair p{margin:.3em 0 .6em;font-size:1.08rem}
.q{font-size:1.1rem;margin:.2em 0 .8em}
.luke{font-size:1.02rem;line-height:2.15}
.luke .head{font-weight:700;display:block;margin-top:.4em;line-height:1.5}
input.blank{border:none;border-bottom:2px solid #9fb4c9;background:#f5f8fb;border-radius:6px 6px 0 0;padding:1px 6px;min-width:3.5em;font-size:inherit;outline:none;transition:background .2s}
input.blank:focus{border-bottom-color:var(--fjord);background:#e9f0f7}
input.blank.ok{border-bottom-color:var(--ok);background:var(--ok-soft)}
input.blank.bad{border-bottom-color:var(--bad);background:var(--bad-soft)}
.fix{display:inline-block;font-size:.8rem;line-height:1.2;color:var(--ok);font-weight:700;margin:0 4px 0 2px;vertical-align:1px}
textarea.answer{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafbfd;resize:vertical}
.reveal{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.verdict{display:inline-block;font-weight:700;border-radius:8px;padding:3px 10px;font-size:.9rem;margin-bottom:8px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--warn-soft);color:var(--warn)}
.fasit{background:var(--ok-soft);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.fasit b{color:var(--ok)}
.why{background:var(--fjord-soft);border-radius:10px;padding:10px 12px;margin:6px 0 10px}
.why h4,.fasit h4{margin:0 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em}
.why h4{color:var(--fjord)} .fasit h4{color:var(--ok)}
.mistakes{margin:4px 0 0;padding-left:1.1em} .mistakes li{margin:3px 0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.hint{font-size:.82rem;color:var(--muted);margin-top:10px}
/* summary */
.score{font-family:Fraunces,serif;font-size:3.2rem;font-weight:650;line-height:1}
.miss{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0;background:var(--paper)}
.miss .yours{color:var(--bad)} .miss .right{color:var(--ok)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mini{display:inline-block;height:7px;border-radius:9px;background:#e8e1d3;width:90px;overflow:hidden;vertical-align:middle}
.mini i{display:block;height:100%;background:var(--ok)}
.note{background:var(--warn-soft);color:#6b4a0b;border-radius:10px;padding:10px 12px;font-size:.9rem}
.dlg{position:fixed;inset:0;background:rgba(20,25,35,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.dlg .panel{max-width:560px;width:100%}
.dlg textarea{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:.78rem}
.hidden{display:none!important}
.sync{font-size:.78rem;color:var(--muted)}
</style>
</head>

ele klassen har kommet, kan timen begynne.", "T": "Timen kan ikke begynne ___.", "B": "Timen kan ikke begynne før hele klassen har kommet.", "alts": ["Timen kan ikke begynne før hele klassen har kommet."], "tags": ["konj"], "expl": "«Når hele klassen har kommet, kan timen begynne» = timen kan ikke begynne før hele klassen har kommet. «Ikke … før» betyr at noe skjer først når noe annet har skjedd."}, {"id": "E11-6", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 6", "A": "Petter spør: “Skal du ikke spise maten din, Anne?”", "T": "Petter spør ___.", "B": "Petter spør om Anne ikke skal spise maten sin / om ikke Anne skal spise maten sin.", "alts": ["Petter spør om Anne ikke skal spise maten sin.", "Petter spør om ikke Anne skal spise maten sin."], "tags": ["indir"], "expl": "Ja/nei-spørsmål i indirekte tale innledes med «om». «Ikke» står foran verbet i leddsetning (om Anne ikke skal …). «Din» blir «sin» fordi det viser tilbake til subjektet Anne."}, {"id": "E11-7", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 7", "A": "Denne oppgaven er vanskeligere enn jeg trodde.", "T": "Jeg trodde ikke at denne oppgaven skulle ___.", "B": "Jeg trodde ikke at denne oppgaven skulle være så vanskelig.", "alts": ["Jeg trodde ikke at denne oppgaven skulle være så vanskelig."], "tags": ["komp", "sammenl"], "expl": "Komparativ + «enn jeg trodde» ↔ «jeg trodde ikke at den skulle være så + positiv». Vanskeligere enn = ikke så vanskelig som jeg trodde."}, {"id": "E11-8", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 8", "A": "Boka var så god at jeg måtte lese den om igjen.", "T": "Boka var så god at jeg måtte lese den ___ til.", "B": "Boka var så god at jeg måtte lese den en gang til.", "alts": ["Boka var så god at jeg måtte lese den en gang til."], "tags": ["uttr"], "expl": "«Om igjen» = «en gang til»."}, {"id": "E11-9", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 9", "A": "Først skrev jeg brevet. Så gikk jeg på postkontoret.", "T": "Etter at ___, gikk jeg på postkontoret.", "B": "Etter at jeg hadde skrevet brevet, gikk jeg på postkontoret.", "alts": ["Etter at jeg hadde skrevet brevet, gikk jeg på postkontoret."], "tags": ["konj", "verb"], "expl": "«Etter at» + pluskvamperfektum når hovedsetningen står i preteritum: etter at jeg hadde skrevet brevet (skrive – skrev – har skrevet)."}, {"id": "E11-10", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 10", "A": "Det er tre år siden jeg flyttet hit, og jeg bor her ennå.", "T": "Jeg ___ i tre år.", "B": "Jeg har bodd her i tre år.", "alts": ["Jeg har bodd her i tre år."], "tags": ["tid"], "expl": "«Det er tre år siden … og jeg bor her ennå» → perfektum + «i» + tidsrom: Jeg har bodd her i tre år (handlingen pågår fortsatt)."}, {"id": "E11-11", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 11", "A": "Karin har ikke TV. Det har ikke Fredrik heller.", "T": "___ Karin ___ Fredrik har TV.", "B": "Verken/Hverken Karin eller Fredrik har TV.", "alts": ["Hverken Karin eller Fredrik har TV.", "Verken Karin eller Fredrik har TV."], "tags": ["konj"], "expl": "To nektende setninger (ikke … heller) = «verken/hverken … eller»."}, {"id": "E11-12", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 12", "A": "De spiste middag i taushet.", "T": "De spiste middag ___ noe.", "B": "De spiste middag uten å si noe.", "alts": ["De spiste middag uten å si noe."], "tags": ["omskr"], "expl": "«I taushet» = «uten å si noe». «Uten å» + infinitiv."}, {"id": "E11-13", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 13", "A": "Alle skal ta eksamen, unntatt Anita.", "T": "Anita er ___ ikke skal ta eksamen.", "B": "Anita er den eneste som ikke skal ta eksamen.", "alts": ["Anita er den eneste som ikke skal ta eksamen."], "tags": ["best", "utbr"], "expl": "«Alle unntatt Anita» = Anita er den eneste som ikke … «Den eneste» står i bestemt form; «ikke» kommer etter «som» i leddsetningen."}, {"id": "E11-14", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 14", "A": "Museene stenges klokka 16.", "T": "Museene er ___ til klokka 16.", "B": "Museene er åpne til klokka 16.", "alts": ["Museene er åpne til klokka 16."], "tags": ["omskr", "best"], "expl": "«Stenges klokka 16» = «er åpne til klokka 16». Adjektivet bøyes i flertall fordi subjektet er «museene»: åpen – åpent – åpne."}, {"id": "E11-15", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 15", "A": "Simon studerer geografi, ikke Erik.", "T": "Det ___ studerer geografi, ikke Erik.", "B": "Det er Simon som studerer geografi, ikke Erik.", "alts": ["Det er Simon som studerer geografi, ikke Erik."], "tags": ["utbr"], "expl": "Utbrytning: «Det er + X + som …» framhever Simon."}, {"id": "E11-16", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 16", "A": "Fire studenter sitter på benken.", "T": "___ fire studenter på benken.", "B": "Det sitter fire studenter på benken.", "alts": ["Det sitter fire studenter på benken."], "tags": ["utbr"], "expl": "Presentering med formelt subjekt: Det sitter fire studenter på benken. Det ubestemte subjektet flyttes etter verbet."}, {"id": "E11-17", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 17", "A": "De skal skrive stilen til mandag.", "T": "Stilen ___ til mandag.", "B": "Stilen skal skrives til mandag.", "alts": ["Stilen skal skrives til mandag."], "tags": ["pass"], "expl": "Aktiv med modalverb → modalverb + s-passiv: «skal skrives». Etter modalverb brukes nesten alltid s-passiv."}, {"id": "E11-18", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 18", "A": "Romanen ble stadig mer spennende.", "T": "Romanen ble ___ og ___.", "B": "Romanen ble mer og mer spennende.", "alts": ["Romanen ble mer og mer spennende."], "tags": ["komp"], "expl": "«Stadig mer» = «mer og mer» (gradvis økning)."}, {"id": "E11-19", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 19", "A": "Jeg skal møte Gunnar utenfor kinoen.", "T": "Jeg og Gunnar ___ utenfor kinoen.", "B": "Jeg og Gunnar skal møtes utenfor kinoen.", "alts": ["Jeg og Gunnar skal møtes utenfor kinoen."], "tags": ["pass", "omskr"], "expl": "«Møte noen» → «møtes» (resiprokt s-verb = møte hverandre). Jeg og Gunnar skal møtes."}, {"id": "E11-20", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 20", "A": "Ola sier til kona si at hun må lage middag.", "T": "Ola sier at ___ må lage middag.", "B": "Ola sier at kona hans må lage middag.", "alts": ["Ola sier at kona hans må lage middag."], "tags": ["indir"], "expl": "«Kona si» blir «kona hans» fordi «kona» nå er subjekt i leddsetningen. «Sin/si/sitt/sine» kan ikke stå i subjektet."}, {"id": "E11-21", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 21", "A": "Jeg har aldri spist en så god pizza.", "T": "Dette er ___ jeg har spist.", "B": "Dette er den beste pizzaen jeg har spist.", "alts": ["Dette er den beste pizzaen jeg har spist."], "tags": ["komp", "best"], "expl": "«Aldri spist en så god pizza» = «den beste pizzaen jeg har spist». Superlativ med dobbel bestemmelse: den + beste + pizzaen."}, {"id": "E11-22", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 22", "A": "Hvis du skal rekke bussen, må du sette opp farten.", "T": "Hvis du skal rekke bussen, må du ___ deg.", "B": "Hvis du skal rekke bussen, må du skynde/kjappe deg.", "alts": ["Hvis du skal rekke bussen, må du kjappe deg.", "Hvis du skal rekke bussen, må du skynde deg."], "tags": ["uttr"], "expl": "«Sette opp farten» = «skynde seg» / «kjappe seg» (refleksive verb)."}, {"id": "E11-23", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 23", "A": "Der borte sitter Annes nye venn.", "T": "Der borte sitter ___ Anne.", "B": "Der borte sitter den nye vennen til Anne.", "alts": ["Der borte sitter den nye vennen til Anne."], "tags": ["best"], "expl": "Genitiv: Annes nye venn (ingen artikkel, svak adjektivform «nye») = den nye vennen til Anne (dobbel bestemmelse: den + nye + vennen)."}, {"id": "E11-24", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 24", "A": "Paul satt og leste til klokka to om natten.", "T": "Paul ble ___ til klokka to om natten.", "B": "Paul ble sittende og lese til klokka to om natten.", "alts": ["Paul ble sittende og lese til klokka to om natten."], "tags": ["uttr", "verb"], "expl": "«Satt og leste» = «ble sittende og lese». «Bli sittende/stående/liggende og» + infinitiv viser at noe varte lenge."}, {"id": "E11-25", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 25", "A": "Sigrid må alltid støvsuge huset.", "T": "Alltid er ___ støvsuge huset.", "B": "Alltid er det Sigrid som må støvsuge huset.", "alts": ["Alltid er det Sigrid som må støvsuge huset."], "tags": ["utbr"], "expl": "Utbrytning med adverb først og inversjon: Alltid er det Sigrid som må …"}, {"id": "E11-26", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 26", "A": "Fotball er kjedelig, men alpinsport liker jeg godt.", "T": "Alpinsport interesserer jeg ___, men fotball er jeg ikke interessert ___.", "B": "Alpinsport interesserer jeg meg for, men fotball er jeg ikke interessert i.", "alts": ["Alpinsport interesserer jeg meg for, men fotball er jeg ikke interessert i."], "tags": ["prep"], "expl": "Interessere seg FOR noe, men være interessert I noe. Lær preposisjonen sammen med verbet."}, {"id": "E11-27", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 27", "A": "Først skal jeg spise middag. Så skal jeg gjøre hjemmeleksen.", "T": "Etter at ___, skal jeg gjøre hjemmeleksen.", "B": "Etter at jeg har spist middag, skal jeg gjøre hjemmeleksen.", "alts": ["Etter at jeg har spist middag, skal jeg gjøre hjemmeleksen."], "tags": ["konj"], "expl": "«Etter at» + perfektum når hovedsetningen er i presens/framtid: etter at jeg har spist middag, skal jeg …"}, {"id": "E11-28", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 28", "A": "Det er røykeforbud på denne kafeen.", "T": "Det er ikke ___ på denne kafeen.", "B": "Det er ikke tillatt å røyke / lov å røyke / lov til å røyke på denne kafeen.", "alts": ["Det er ikke lov til å røyke på denne kafeen.", "Det er ikke lov å røyke på denne kafeen.", "Det er ikke tillatt å røyke på denne kafeen."], "tags": ["omskr"], "expl": "«Røykeforbud» = det er ikke tillatt å røyke / ikke lov (til) å røyke."}, {"id": "E11-29", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 29", "A": "Denne filmen har 16 års aldersgrense.", "T": "Personer under 16 år har ikke ___ til denne filmen.", "B": "Personer under 16 år har ikke adgang til denne filmen.", "alts": ["Personer under 16 år har ikke adgang til denne filmen."], "tags": ["omskr"], "expl": "«Aldersgrense» → «ha (ikke) adgang til»."}, {"id": "E11-30", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 30", "A": "Dette huset er det høyeste i Bergen.", "T": "Dette er Bergens ___.", "B": "Dette er Bergens høyeste hus.", "alts": ["Dette er Bergens høyeste hus."], "tags": ["komp", "best"], "expl": "Genitiv + superlativ: Bergens høyeste hus. Etter genitiv er det ingen artikkel, og substantivet står i ubestemt form, men adjektivet har svak form."}, {"id": "E11-31", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 31", "A": "Marianne spiste opp alle kakestykkene som lå på fatet.", "T": "Marianne spiste opp ___ eneste kakestykke som lå på fatet.", "B": "Marianne spiste opp hvert eneste kakestykke som lå på fatet.", "alts": ["Marianne spiste opp hvert eneste kakestykke som lå på fatet."], "tags": ["best"], "expl": "«Alle kakestykkene» (bestemt flertall) = «hvert eneste kakestykke» (ubestemt entall!). «Hvert» fordi «kakestykke» er intetkjønn (et)."}, {"id": "E11-32", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 32", "A": "Jeg mistet veska mi i går, men i dag kom den til rette.", "T": "Jeg mistet veska mi i går, men i dag ___ jeg den igjen.", "B": "Jeg mistet veska mi i går, men i dag fant jeg den igjen.", "alts": ["Jeg mistet veska mi i går, men i dag fant jeg den igjen."], "tags": ["uttr", "verb"], "expl": "«Komme til rette» = bli funnet igjen. Finne – fant – har funnet."}, {"id": "E11-33", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 33", "A": "Først leste vi ei lærebok i norsk. Deretter leste vi en roman.", "T": "Vi leste en roman etter ___.", "B": "Vi leste en roman etter at vi hadde lest ei lærebok i norsk.", "alts": ["Vi leste en roman etter at vi hadde lest ei lærebok i norsk."], "tags": ["konj"], "expl": "«Først … deretter» = «etter at» + pluskvamperfektum (hadde lest), fordi hovedsetningen står i preteritum."}, {"id": "E11-34", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 34", "A": "De spiste fatet tomt for mat.", "T": "De spiste ___ som lå på fatet.", "B": "De spiste alt som lå på fatet. / De spiste all maten som lå på fatet.", "alts": ["De spiste all maten som lå på fatet.", "De spiste alt som lå på fatet."], "tags": ["omskr", "verb"], "expl": "«Spise fatet tomt» = spise all maten / alt som lå på fatet (ligge – lå – har ligget)."}, {"id": "E11-35", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 35", "A": "Petter spør: “Hvor ligger postkontoret?”", "T": "Petter spør ___ ligger.", "B": "Petter spør hvor postkontoret ligger.", "alts": ["Petter spør hvor postkontoret ligger."], "tags": ["indir"], "expl": "Hv-spørsmål i indirekte tale: spørreord + subjekt + verbal (hvor postkontoret ligger). Ingen inversjon."}, {"id": "E11-36", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 36", "A": "Far satte stor pris på boka jeg ga ham.", "T": "Far ___ for boka jeg ga ham.", "B": "Far var glad / ble glad for boka jeg ga ham.", "alts": ["Far ble glad for boka jeg ga ham.", "Far var glad for boka jeg ga ham."], "tags": ["uttr"], "expl": "«Sette stor pris på» = «være/bli glad for»."}, {"id": "E11-37", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 37", "A": "Vi har ikke sett hverandre på ett år.", "T": "Det ___ så hverandre.", "B": "Det er ett år siden vi så hverandre.", "alts": ["Det er ett år siden vi så hverandre."], "tags": ["tid"], "expl": "«Ikke sett hverandre på ett år» = «det er ett år siden vi så hverandre». Etter «det er … siden» brukes preteritum."}, {"id": "E11-38", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 38", "A": "Han flyttet til Bergen i desember.", "T": "Han ___ siden desember.", "B": "Han har bodd i Bergen siden desember.", "alts": ["Han har bodd i Bergen siden desember."], "tags": ["tid"], "expl": "«Flyttet i desember» → har bodd i Bergen siden desember (perfektum + siden + tidspunkt)."}, {"id": "E11-39", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 39", "A": "Ola har flere penger enn jeg har.", "T": "Ola har bedre ___ enn jeg har.", "B": "Ola har bedre råd/økonomi enn jeg har.", "alts": ["Ola har bedre råd enn jeg har.", "Ola har bedre økonomi enn jeg har."], "tags": ["uttr"], "expl": "«Ha bedre råd» = ha mer penger. Uttrykket er «ha god/dårlig råd»."}, {"id": "E11-40", "src": "par", "kind": "pair", "title": "Parsetninger 1, nr. 40", "A": "De slo seg ned i Tromsø.", "T": "De ___ seg i Tromsø.", "B": "De bosatte seg i Tromsø.", "alts": ["De bosatte seg i Tromsø."], "tags": ["uttr", "verb"], "expl": "«Slå seg ned» = «bosette seg» (bosette – bosatte – har bosatt)."}, {"id": "E12-1", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 1", "A": "Det er fire timer siden jeg spiste.", "T": "Jeg spiste ___.", "B": "Jeg spiste for fire timer siden.", "alts": ["Jeg spiste for fire timer siden."], "tags": ["tid"], "expl": "«Det er fire timer siden» = «for fire timer siden» (med preteritum)."}, {"id": "E12-2", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 2", "A": "Bergen og Oslo er ulike.", "T": "Bergen er ___ enn Oslo.", "B": "Bergen er annerledes enn Oslo.", "alts": ["Bergen er annerledes enn Oslo."], "tags": ["sammenl"], "expl": "«Ulike» = «annerledes enn» / «forskjellig fra»."}, {"id": "E12-3", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 3", "A": "Sekken min er akkurat like tung som din.", "T": "Sekken min er ___ eller lettere enn din.", "B": "Sekken min er verken/hverken tyngre eller lettere enn din.", "alts": ["Sekken min er hverken tyngre eller lettere enn din.", "Sekken min er verken tyngre eller lettere enn din."], "tags": ["sammenl"], "expl": "«Like tung som» = «verken tyngre eller lettere enn»."}, {"id": "E12-4", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 4", "A": "Jeg gikk ikke på festen fordi jeg ikke hadde lyst.", "T": "Jeg gikk ikke på festen, for ___.", "B": "Jeg gikk ikke på festen, for jeg hadde ikke lyst.", "alts": ["Jeg gikk ikke på festen, for jeg hadde ikke lyst."], "tags": ["konj"], "expl": "«Fordi» er subjunksjon (leddsetning: fordi jeg ikke hadde lyst). «For» er konjunksjon og gir hovedsetningsordstilling: for jeg hadde ikke lyst."}, {"id": "E12-5", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 5", "A": "Røyking er forbudt på sykehuset.", "T": "Røyking er ikke ___ på sykehuset.", "B": "Røyking er ikke tillatt/lov på sykehuset.", "alts": ["Røyking er ikke lov på sykehuset.", "Røyking er ikke tillatt på sykehuset."], "tags": ["omskr"], "expl": "«Forbudt» = «ikke tillatt» / «ikke lov»."}, {"id": "E12-6", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 6", "A": "Noen hjalp henne over gaten.", "T": "Hun ___ over gaten.", "B": "Hun ble hjulpet over gaten.", "alts": ["Hun ble hjulpet over gaten."], "tags": ["pass", "verb"], "expl": "Hjelpe – hjalp – har hjulpet. Bli-passiv: hun ble hjulpet."}, {"id": "E12-7", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 7", "A": "Jeg har lest hele boka, og jeg brukte bare to timer.", "T": "Jeg leste hele boka ___ to timer.", "B": "Jeg leste hele boka på bare to timer. / Jeg leste hele boka ferdig på bare to timer.", "alts": ["Jeg leste hele boka ferdig på bare to timer.", "Jeg leste hele boka på bare to timer."], "tags": ["prep", "tid"], "expl": "«Brukte to timer» = leste boka på (bare) to timer. «På» + tidsrom = hvor lang tid det tar å gjøre noe ferdig."}, {"id": "E12-8", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 8", "A": "“Gå og legg deg!”, sa mora til dattera.", "T": "Mora sa til dattera at ___.", "B": "Mora sa til dattera at hun burde/skulle/måtte gå og legge seg.", "alts": ["Mora sa til dattera at hun burde gå og legge seg.", "Mora sa til dattera at hun måtte gå og legge seg.", "Mora sa til dattera at hun skulle gå og legge seg."], "tags": ["indir"], "expl": "Imperativ i indirekte tale → at hun skulle/måtte/burde + infinitiv. «Deg» blir «seg»."}, {"id": "E12-9", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 9", "A": "Bilen som var stjålet, ble funnet dagen etter.", "T": "Den ___ bilen ble funnet dagen etter.", "B": "Den stjålne bilen ble funnet dagen etter.", "alts": ["Den stjålne bilen ble funnet dagen etter."], "tags": ["part"], "expl": "«Bilen som var stjålet» → «den stjålne bilen». Sterke verb med partisipp på -et får -ne i bestemt form og flertall: stjålet – stjålne."}, {"id": "E12-10", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 10", "A": "Han vant konkurransen. Likevel ble han ikke glad.", "T": "___ at han vant konkurransen, ble han ikke glad.", "B": "Til tross for at han vant konkurransen, ble han ikke glad.", "alts": ["Til tross for at han vant konkurransen, ble han ikke glad."], "tags": ["konj"], "expl": "«Likevel» = «til tross for at»."}, {"id": "E12-11", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 11", "A": "“Hvorfor kommer hun ikke?”, spurte Per.", "T": "Per spurte ___.", "B": "Per spurte hvorfor hun ikke kom.", "alts": ["Per spurte hvorfor hun ikke kom."], "tags": ["indir"], "expl": "Presens i direkte tale blir preteritum når innledningsverbet står i preteritum: spurte hvorfor hun ikke kom. «Ikke» foran verbet i leddsetningen."}, {"id": "E12-12", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 12", "A": "Jeg er kjempesulten! Det er åtte timer siden jeg spiste!", "T": "Jeg er kjempesulten! Jeg har ___ åtte timer!", "B": "Jeg er kjempesulten! Jeg har ikke spist på åtte timer!", "alts": ["Jeg er kjempesulten! Jeg har ikke spist på åtte timer!"], "tags": ["tid"], "expl": "«Det er åtte timer siden jeg spiste» = «jeg har ikke spist på åtte timer» (nektet perfektum + på + tidsrom)."}, {"id": "E12-13", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 13", "A": "Else fant katten.", "T": "Katten ___ av Else.", "B": "Katten ble funnet av Else.", "alts": ["Katten ble funnet av Else."], "tags": ["pass", "verb"], "expl": "Finne – fant – har funnet. Katten ble funnet av Else."}, {"id": "E12-14", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 14", "A": "Nå gjør du meg redd!", "T": "Nå ___ du meg!", "B": "Nå skremmer du meg!", "alts": ["Nå skremmer du meg!"], "tags": ["omskr"], "expl": "«Gjøre redd» = «skremme»."}, {"id": "E12-15", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 15", "A": "Trenger du mer hjelp?", "T": "Har ___ mer hjelp?", "B": "Har du bruk for mer hjelp? / Har du behov for mer hjelp? / Har du lyst på mer hjelp?", "alts": ["Har du behov for mer hjelp?", "Har du bruk for mer hjelp?", "Har du lyst på mer hjelp?"], "tags": ["uttr"], "expl": "«Trenge» = «ha bruk for» / «ha behov for»."}, {"id": "E12-16", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 16", "A": "Det gamle huset til bestemor er solgt nå.", "T": "Bestemors ___ er solgt nå.", "B": "Bestemors gamle hus er solgt nå.", "alts": ["Bestemors gamle hus er solgt nå."], "tags": ["best"], "expl": "«Det gamle huset til bestemor» = «bestemors gamle hus». Etter genitiv: ingen artikkel, ubestemt substantiv, men svak adjektivform (gamle)."}, {"id": "E12-17", "src": "par", "kind": "pair", "title": "Parsetninger 2, nr. 17", "A": "På turen ble jeg kjent med et ektepar fra Island.", "T": "På turen ble jeg kjent med ___ ektepar.", "B": "På turen ble jeg kjent med et islandsk ektepar.", "alts": ["På turen ble jeg kjent med et islandsk ektepar."], "tags": ["omskr", "best"], "expl": "«Fra Island» → «isla te til alle studentene.", "Klasserommet er ikke stort nok til alle studentene."], "tags": ["sammenl"], "expl": "«Ikke plass til alle» = «for lite» / «ikke stort nok»."}, {"id": "E17-35", "src": "par", "kind": "pair", "title": "Parsetninger 7, nr. 35", "A": "Hun har for mye å tenke på.", "T": "Hun har mer ___ å tenke på.", "B": "Hun har mer enn nok å tenke på.", "alts": ["Hun har mer enn nok å tenke på."], "tags": ["uttr"], "expl": "«For mye» = «mer enn nok»."}, {"id": "E17-36", "src": "par", "kind": "pair", "title": "Parsetninger 7, nr. 36", "A": "Hatefulle ytringer truer ytringsfriheten.", "T": "Hatefulle ytringer er en ___ ytringsfriheten.", "B": "Hatefulle ytringer er en trussel mot ytringsfriheten.", "alts": ["Hatefulle ytringer er en trussel mot ytringsfriheten."], "tags": ["prep"], "expl": "«True» → «en trussel MOT»."}, {"id": "E17-37", "src": "par", "kind": "pair", "title": "Parsetninger 7, nr. 37", "A": "Hva liker de best?", "T": "Hva setter de mest ___?", "B": "Hva setter de mest pris på?", "alts": ["Hva setter de mest pris på?"], "tags": ["uttr"], "expl": "«Liker best» = «setter mest pris på»."}, {"id": "E17-38", "src": "par", "kind": "pair", "title": "Parsetninger 7, nr. 38", "A": "Først var vi to timer på kurs, så gikk vi på fjelltur.", "T": "Etter å ___ gikk vi på fjelltur.", "B": "Etter å ha vært to timer på kurs gikk vi på fjelltur.", "alts": ["Etter å ha vært to timer på kurs gikk vi på fjelltur."], "tags": ["konj"], "expl": "«Først … så» = «etter å ha» + partisipp (etter å ha vært)."}, {"id": "E17-39", "src": "par", "kind": "pair", "title": "Parsetninger 7, nr. 39", "A": "De ble svært overrasket over det gode resultatet.", "T": "Resultatet var ___ de hadde ventet.", "B": "Resultatet var bedre/annerledes enn de hadde ventet.", "alts": ["Resultatet var annerledes enn de hadde ventet.", "Resultatet var bedre enn de hadde ventet."], "tags": ["komp"], "expl": "«Overrasket over det gode resultatet» = «resultatet var bedre enn de hadde ventet»."}, {"id": "E17-40", "src": "par", "kind": "pair", "title": "Parsetninger 7, nr. 40", "A": "Det nye viruset gjør at vi blir syke.", "T": "Sykdommen ___ det nye viruset.", "B": "Sykdommen skyldes / kommer av det nye viruset.", "alts": ["Sykdommen kommer av det nye viruset.", "Sykdommen skyldes det nye viruset."], "tags": ["prep"], "expl": "«Viruset gjør at vi blir syke» = «sykdommen skyldes / kommer av viruset»."}, {"id": "E18-1", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 1", "A": "En fremmed mann står på terrassen.", "T": "Det ___ på terrassen.", "B": "Det står en fremmed mann på terrassen.", "alts": ["Det står en fremmed mann på terrassen."], "tags": ["utbr"], "expl": "Presentering: Det står en fremmed mann på terrassen. Ubestemt subjekt etter formelt «det»."}, {"id": "E18-2", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 2", "A": "Læreren gråt da hun kom inn.", "T": "Læreren kom ___ inn.", "B": "Læreren kom gråtende inn.", "alts": ["Læreren kom gråtende inn."], "tags": ["part"], "expl": "«Gråt da hun kom» → «kom gråtende» (presens partisipp etter «komme»)."}, {"id": "E18-3", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 3", "A": "De fortsatte bare å sitte og se på TV.", "T": "De ble bare ___ på TV.", "B": "De ble bare sittende og se på TV.", "alts": ["De ble bare sittende og se på TV."], "tags": ["uttr"], "expl": "«Fortsatte å sitte og se» = «ble (bare) sittende og se»."}, {"id": "E18-4", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 4", "A": "Jeg har et annet syn på denne saken enn deg.", "T": "Jeg er ___ vurderingen din av saken.", "B": "Jeg er uenig i / ikke enig i vurderingen din av saken.", "alts": ["Jeg er ikke enig i vurderingen din av saken.", "Jeg er uenig i vurderingen din av saken."], "tags": ["prep"], "expl": "«Ha et annet syn enn deg» = «være uenig I / ikke enig I vurderingen din»."}, {"id": "E18-5", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 5", "A": "Jeg ble oppringt av rektor, ikke direktøren.", "T": "Det ___, ikke direktøren.", "B": "Det var rektor som ringte meg / var rektor jeg ble oppringt av, ikke direktøren.", "alts": ["Det var rektor jeg ble oppringt av, ikke direktøren.", "Det var rektor som ringte meg, ikke direktøren."], "tags": ["utbr", "pass"], "expl": "Utbrytning: Det var rektor som ringte meg / Det var rektor jeg ble oppringt av."}, {"id": "E18-6", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 6", "A": "Man må ikke bruke munnbind på bussen.", "T": "Det er ikke ___ å bruke munnbind på bussen.", "B": "Det er ikke nødvendig/påbudt å bruke munnbind på bussen.", "alts": ["Det er ikke nødvendig å bruke munnbind på bussen.", "Det er ikke påbudt å bruke munnbind på bussen."], "tags": ["omskr"], "expl": "Her betyr «må ikke» det samme som «trenger ikke»: Det er ikke nødvendig/påbudt å bruke munnbind."}, {"id": "E18-7", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 7", "A": "Er det noen kaker igjen etter festen?", "T": "Er det noen kaker til ___ etter festen?", "B": "Er det noen kaker til overs etter festen?", "alts": ["Er det noen kaker til overs etter festen?"], "tags": ["uttr"], "expl": "«Igjen» (om mat) = «til overs»."}, {"id": "E18-8", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 8", "A": "Vi må slutte å gå rundt grøten.", "T": "Vi må komme ___.", "B": "Vi må komme til poenget.", "alts": ["Vi må komme til poenget."], "tags": ["uttr"], "expl": "«Gå rundt grøten» = unngå det viktigste; motsatt: «komme til poenget»."}, {"id": "E18-9", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 9", "A": "Politikeren innrømte at hun hadde tatt feil.", "T": "Politikeren la ___.", "B": "Politikeren la seg flat.", "alts": ["Politikeren la seg flat."], "tags": ["uttr"], "expl": "«Legge seg flat» = innrømme at man tok feil, be om unnskyldning."}, {"id": "E18-10", "src": "par", "kind": "pair", "title": "Parsetninger 8, nr. 10", "A": "Vi trenger ikke flere oppgaver nå.", "T": "Vi har ___ oppgaver nå.", "B": "Vi har nok oppgaver nå.", "alts": ["Vi har nok oppgaver nå."], "tags": ["omskr"], "expl": "«Trenger ikke flere» = «har nok»."}, {"id": "L19-1", "src": "luke", "kind": "luke", "title": "Atlantis (1/6)", "text": "Et fantastisk kongerike ble oppslukt av Atlanterhavets bølger i løpet av én eneste natt. Siden den gang har jakten på Atlantis ført til et hav av teorier. På en fruktbar øy midt i havet lå det for over 11 000 år [[siden]] et mektig kongerike som var større [[enn]] Norden, Tyskland, Frankrike og Nederland til [[sammen]]. Dette kongeriket var Atlantis. Mens Europa [[ennå/enda/fremdeles/fortsatt]] var på steinalderstadiet, var Atlantis et paradis [[med]] praktfulle templer og palasser med tak [[av]] elfenben og skinnende gull.", "blanks": [["siden"], ["enn"], ["sammen"], ["ennå", "enda", "fremdeles", "fortsatt"], ["med"], ["av"]], "labels": ["Fast uttrykk: «år siden»", "Gradbøyning / sammenligning", "Fast uttrykk: «til sammen»", "Ordforråd: ordet må passe i sammenhengen («Mens Europa ennå var på»)", "Preposisjon: «et paradis med praktfulle templer»", "Preposisjon: «med tak av elfenben og»"], "tags": ["komp", "prep", "uttr"]}, {"id": "L19-2", "src": "luke", "kind": "luke", "title": "Atlantis (2/6)", "text": "Menneskene som [[bodde/levde]] her, dyrket jorda og var flinke [[til]] å bygge svære bygninger og lage brede, [[fine/vakre/lange]] gater. [[Men/Så]] plutselig forsvant Atlantis fra jordas overflate. [[Det]] sies at store eksplosjoner, jordskjelv og [[andre/mange/flere/voldsomme]] naturkatastrofer førte til at dette riket [[forsvant/sank]] i havet i år 9600 før Kristus [[i]] løpet av én natt.", "blanks": [["bodde", "levde"], ["til"], ["fine", "vakre", "lange"], ["Men", "Så"], ["Det"], ["andre", "mange", "flere", "voldsomme"], ["forsvant", "sank"], ["i"]], "labels": ["Verb i preteritum som passer i sammenhengen («Menneskene som bodde her, dyrket»)", "Preposisjon: «var flinke til å bygge»", "Ordforråd: ordet må passe i sammenhengen («lage brede, fine gater. Men»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Mengdeord / determinativ", "Verb i preteritum som passer i sammenhengen («dette riket forsvant i havet»)", "Fast uttrykk: «i løpet av»"], "tags": ["best", "konj", "prep", "uttr", "verb"]}, {"id": "L19-3", "src": "luke", "kind": "luke", "title": "Atlantis (3/6)", "text": "Det var [[den]] greske filosofen Platon som i 355 f.Kr. [[skrev/fortalte]] om Atlantis. Platons bøker ble sett [[på]] som vitenskapelige verk og brukt til [[undervisning/læring]] på skolene flere hundre år etter [[hans/Platons/forfatterens/filosofens]] død. Platon skriver at han har [[fått/hentet]] sine opplysninger fra Solon, en greker [[som]] levde 200 år før Platons tid. [[Vi/Man]] har bare Platons ord for at [[Atlantis/riket]] har eksistert.", "blanks": [["den"], ["skrev", "fortalte"], ["på"], ["undervisning", "læring"], ["hans", "Platons", "forfatterens", "filosofens"], ["fått", "hentet"], ["som"], ["Vi", "Man"], ["Atlantis", "riket"]], "labels": ["Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Verb i preteritum som passer i sammenhengen («355 f.Kr. skrev om Atlantis.»)", "Fast uttrykk: «sett på som»", "Ordforråd: ordet må passe i sammenhengen («brukt til undervisning på skolene»)", "Eiendomspronomen (ikke refleksivt fordi eieren ikke er subjekt)", "Perfektum partisipp", "Relativpronomen «som» innleder en leddsetning", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («for at Atlantis har eksistert.»)"], "tags": ["best", "konj", "part", "uttr", "verb"]}, {"id": "L19-4", "src": "luke", "kind": "luke", "title": "Atlantis (4/6)", "text": "Skal man tro den [[greske/berømte/store/kjente/gamle]] filosofen, eller er Atlantis bare en [[myte/legende/fantasi/skrøne]]? Flere vitenskapsmenn påstår at Atlantis virkelig [[eksisterte/fantes]] en gang for lenge siden, og at riket skal ha gått [[under]] i en voldsom naturkatastrofe akkurat på den [[tiden]] som Platon hevder at riket forsvant, [[altså/nemlig]] omkring år 9600 f.Kr. Men mange [[mener/tror/hevder/antar/sier/påstår]] at Platon overdriver, og at han [[bruker/brukte]] fantasien flittig.", "blanks": [["greske", "berømte", "store", "kjente", "gamle"], ["myte", "legende", "fantasi", "skrøne"], ["eksisterte", "fantes"], ["under"], ["tiden"], ["altså", "nemlig"], ["mener", "tror", "hevder", "antar", "sier", "påstår"], ["bruker", "brukte"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («tro den greske filosofen, eller»)", "Ordforråd: ordet må passe i sammenhengen («bare en myte ? Flere»)", "Verb i preteritum som passer i sammenhengen («Atlantis virkelig eksisterte en gang»)", "Fast uttrykk: «gått under»", "Ordforråd: ordet må passe i sammenhengen («på den tiden som Platon»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («Men mange mener at Platon»)", "Ordforråd: ordet må passe i sammenhengen («at han bruker fantasien flittig.»)"], "tags": ["konj", "uttr", "verb"]}, {"id": "L19-5", "src": "luke", "kind": "luke", "title": "Atlantis (5/6)", "text": "Ifølge Platon ble Atlantis [[styrt/ledet/regjert]] av ti konger – fem tvillingpar, født [[av]] en jordisk kvinne. Faren til disse [[kongene/barna/tvillingparene]] var den greske guden Poseidon. Den eldste gutten [[het/hette/var]] Atlas, og landet ble oppkalt etter [[ham/han]]. Forskerne er uenige om hvor stort område Atlantis dekket. De fleste gjetter på et område som er omtrent like stort som Grønland. Andre antar at det neppe kan ha vært så stort.", "blanks": [["styrt", "ledet", "regjert"], ["av"], ["kongene", "barna", "tvillingparene"], ["het", "hette", "var"], ["ham", "han"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («ble Atlantis styrt av ti»)", "Preposisjon: «tvillingpar, født av en jordisk»", "Ordforråd: ordet må passe i sammenhengen («til disse kongene var den»)", "Verb i preteritum som passer i sammenhengen («eldste gutten het Atlas, og»)", "Pronomen: riktig form (subjekt/objekt) og referanse"], "tags": ["best", "prep", "verb"]}, {"id": "L19-6", "src": "luke", "kind": "luke", "title": "Atlantis (6/6)", "text": "Siden Platons [[tid/dager]] har utallige forskere og eventyrere lett etter det legendariske riket, både i Atlanterhavet [[langs/utenfor/ved]] den spanske kysten der Platon i sine skrifter hevder at landet lå, og i andre havområder og på fastlandet. Alt i alt er Atlantis blitt plassert på over 40 [[forskjellige/ulike]] steder på verdenskartet. Nye teorier er blitt presentert i de senere årene. Arkeologiske [[funn/utgravninger/utgravinger/undersøkelser]] utenfor oldtidsbyen Troja i Hellas får [[en/noen/mange/flere]] forskere til å tro at Atlantis kanskje [[kan/kunne]] ha ligget her. Også spennende funn [[ved/på/utenfor]] øya Bimini i Florida får mange til å spekulere. Noen meter under havoverflaten har arkeologene funnet en brolagt gate med murer. [[I/På]] det samme området oppdaget en australier en gigantisk pyramideliknende gjenstand nede på havbunnen ved hjelp av satellittbilder. Likevel har ingen [[til/per]] dags dato klart å finne bevis [[for/på]] at Atlantis virkelig har eksistert.", "blanks": [["tid", "dager"], ["langs", "utenfor", "ved"], ["forskjellige", "ulike"], ["funn", "utgravninger", "utgravinger", "undersøkelser"], ["en", "noen", "mange", "flere"], ["kan", "kunne"], ["ved", "på", "utenfor"], ["I", "På"], ["til", "per"], ["for", "på"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («Siden Platons tid har utallige»)", "Preposisjon: «i Atlanterhavet langs den spanske»", "Ordforråd: ordet må passe i sammenhengen («over 40 forskjellige steder på»)", "Ordforråd: ordet må passe i sammenhengen («årene. Arkeologiske funn utenfor oldtidsbyen»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Modalverb + infinitiv", "Preposisjon: «spennende funn ved øya Bimini»", "Preposisjon: «med murer. I det samme»", "Fast uttrykk: «til dags dato»", "Preposisjon: «finne bevis for at Atlantis»"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L20-1", "src": "luke", "kind": "luke", "title": "Nobels fredspris (1/4)", "text": "Hvert år blir Nobels fredspris delt [[ut]] i Oslo. Folk som får prisen, [[har]] arbeidet lenge for fred i [[verden]] og mot tortur, sult og fattigdom. [[Prisen/Nobelprisen]] består av en pengesum, en gullmedalje [[og]] et diplom. Det var svensken Alfred Nobel [[som]] ville at en liten gruppe nordmenn [[skulle]] avgjøre hvem som skulle få fredsprisen. [[Det]] er Nobelkomiteens medlemmer som avgjør [[hvem]] som skal få prisen.", "blanks": [["ut"], ["har"], ["verden"], ["Prisen", "Nobelprisen"], ["og"], ["som"], ["skulle"], ["Det"], ["hvem"]], "labels": ["Fast uttrykk: «delt ut»", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Ordforråd: ordet må passe i sammenhengen («fred i verden og mot»)", "Ordforråd: ordet må passe i sammenhengen («og fattigdom. Prisen består av»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Relativpronomen «som» innleder en leddsetning", "Modalverb + infinitiv", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Spørreord i indirekte spørsmål / leddsetning"], "tags": ["konj", "uttr", "verb"]}, {"id": "L20-2", "src": "luke", "kind": "luke", "title": "Nobels fredspris (2/4)", "text": "Da Nobel var åtte år gammel, flyttet familien [[til]] Russland der faren hans arbeidet med [[å]] produsere landminer og sjøminer. Den unge Alfred Nobel [[ble]] så interessert i arbeidet faren holdt [[på]] med, at han valgte å [[studere]] kjemi. Etter studiene begynte han å [[arbeide]] i farens fabrikk i Sverige. Etter en [[stund]] oppfant han dynamitten som raskt ble [[tatt]] i bruk ved bergverk og veianlegg over [[hele]] verden, men også de militære [[brukte]] dynamitten til å lage våpen.", "blanks": [["til"], ["å"], ["ble"], ["på"], ["studere"], ["arbeide"], ["stund"], ["tatt"], ["hele"], ["brukte"]], "labels": ["Preposisjon: «flyttet familien til Russland der»", "Infinitivsmerke «å» foran verbet", "Verb i preteritum som passer i sammenhengen («Alfred Nobel ble så interessert»)", "Fast uttrykk: «holdt på med»", "Verb i infinitiv", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («Etter en stund oppfant han»)", "Fast uttrykk: «tatt i bruk»", "Mengdeord / determinativ", "Verb i preteritum som passer i sammenhengen («de militære brukte dynamitten til»)"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L20-3", "src": "luke", "kind": "luke", "title": "Nobels fredspris (3/4)", "text": "Etter [[hvert]] fikk Alfred Nobel fabrikker i flere land, og [[han]] ble en av verdens rikeste [[menn]]. Før han døde, bestemte han [[at]] rentene av formuen hans skulle [[gis]] ut som Nobelpriser. Svenskene skulle dele ut [[prisene]] i fysikk, kjemi, litteratur og medisin, Norge fikk ansvaret for fredsprisen. Det [[at]] Norge og Sverige var i union 1814 til 1905, kan ha vært [[grunnen/årsaken]] til at Norge fikk æren av [[å]] dele ut en pris.", "blanks": [["hvert"], ["han"], ["menn"], ["at"], ["gis"], ["prisene"], ["at"], ["grunnen", "årsaken"], ["å"]], "labels": ["Fast uttrykk: «etter hvert»", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («verdens rikeste menn . Før»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Verb i infinitiv", "Ordforråd: ordet må passe i sammenhengen («dele ut prisene i fysikk,»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («ha vært grunnen til at»)", "Infinitivsmerke «å» foran verbet"], "tags": ["best", "konj", "uttr", "verb"]}, {"id": "L20-4", "src": "luke", "kind": "luke", "title": "Nobels fredspris (4/4)", "text": "Mange [[forskjellige/viktige]] organisasjoner og personer, har fått fredsprisen. [[Den]] ble delt ut for første [[gang]] i 1901. Da ble den gitt [[til]] sveitseren Jean Henri Dunant og franskmannen Frédéric Passy. I 2003 [[gikk]] prisen til Shirin Ebadi fra Iran for [[hennes]] innsats for bl.a. kvinners rettigheter i hjemlandet.", "blanks": [["forskjellige", "viktige"], ["Den"], ["gang"], ["til"], ["gikk"], ["hennes"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («Mange forskjellige organisasjoner og»)", "Ordforråd: ordet må passe i sammenhengen («fått fredsprisen. Den ble delt»)", "Fast uttrykk: «for første gang»", "Preposisjon: «den gitt til sveitseren Jean»", "Verb i preteritum som passer i sammenhengen («I 2003 gikk prisen til»)", "Eiendomspronomen (ikke refleksivt fordi eieren ikke er subjekt)"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L21-1", "src": "luke", "kind": "luke", "title": "Sigrid Undset (1/7)", "text": "Sigrid Undset ble født i Danmark, men vokste [[opp]] i Kristiania. Faren døde da Sigrid [[var]] 11 år gammel. Derfor fikk familien [[dårlig]] råd, og de fattige ungdomsårene var [[med]] på å prege tankene hennes. Noen [[av]] tekstene hennes har motiver som sannsynligvis [[er]] hentet fra egen erfaring med fattigdom.", "blanks": [["opp"], ["var"], ["dårlig"], ["med"], ["av"], ["er"]], "labels": ["Fast uttrykk: «vokste opp»", "Verb i preteritum som passer i sammenhengen («da Sigrid var 11 år»)", "Fast uttrykk: «dårlig råd»", "Fast uttrykk: «med på å»", "Preposisjon: «hennes. Noen av tekstene hennes»", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)"], "tags": ["prep", "uttr", "verb"]}, {"id": "L21-2", "src": "luke", "kind": "luke", "title": "Sigrid Undset (2/7)", "text": "[[Den]] sterke interessen for historie arvet Undset [[fra]] sin far som var arkeolog. Han [[lærte]] henne mye om tidligere tider, noe [[som]] inspirerte henne. Men først da hun [[var]] nærmere 40 år, ble historiekunnskapene grunnlag [[for]] diktningen hennes.", "blanks": [["Den"], ["fra"], ["lærte"], ["som"], ["var"], ["for"]], "labels": ["Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Preposisjon: «arvet Undset fra sin far»", "Verb i preteritum: velg et verb som passer i sammenhengen («arkeolog. Han lærte henne mye»)", "Relativpronomen «som» innleder en leddsetning", "Verb i preteritum som passer i sammenhengen («da hun var nærmere 40»)", "Preposisjon: «historiekunnskapene grunnlag for diktningen hennes.»"], "tags": ["best", "konj", "prep", "verb"]}, {"id": "L21-3", "src": "luke", "kind": "luke", "title": "Sigrid Undset (3/7)", "text": "Romanen Kristin Lavransdatter ble [[gitt]] ut i 1920. Denne romanen blir [[av]] mange regnet som nyrealismens viktigste romanverk. [[I]] Kristin Lavransdatter forteller Undset om livet [[i]] middelalderen. Middelaldermiljøet beskrives på en overbevisende [[måte]], og det er tydelig at Undset [[har]] god kjennskap til tiden hun forteller [[om]]. Men selv om det er spennende [[å]] få innsikt i middelalderens miljø, er [[det]] først og fremst beskrivelsen av menneskene [[som]] gjør sterkest inntrykk.", "blanks": [["gitt"], ["av"], ["I"], ["i"], ["måte"], ["har"], ["om"], ["å"], ["det"], ["som"]], "labels": ["Fast uttrykk: «gitt ut»", "Preposisjon: «romanen blir av mange regnet»", "Preposisjon: «viktigste romanverk. I Kristin Lavransdatter»", "Preposisjon: «om livet i middelalderen. Middelaldermiljøet»", "Fast uttrykk: «på en overbevisende måte»", "Ordforråd: ordet må passe i sammenhengen («at Undset har god kjennskap»)", "Preposisjon: «hun forteller om . Men»", "Infinitivsmerke «å» foran verbet", "Perfektum partisipp", "Relativpronomen «som» innleder en leddsetning"], "tags": ["konj", "part", "prep", "uttr", "verb"]}, {"id": "L21-4", "src": "luke", "kind": "luke", "title": "Sigrid Undset (4/7)", "text": "Undset har også [[skrevet]] andre romaner og noveller med utgangspunkt [[i]] middelalderen, i tillegg til flere verk [[som]] omhandler Undsets egen tid. Felles [[for]] svært mange av disse verkene er [[at]] hovedpersonen ofte er en kvinne. Disse [[kvinnene]] følger stort sett samfunnets regler, men [[de]] er likevel ofte svært sterke personligheter [[som]] setter mennene i skyggen. Undset kjempet [[for]] kvinnens likeverd med mannen, men så [[på]] kvinnesaksforkjemperne som en trussel mot familien.", "blanks": [["skrevet"], ["i"], ["som"], ["for"], ["at"], ["kvinnene"], ["de"], ["som"], ["for"], ["på"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («har også skrevet andre romaner»)", "Preposisjon: «med utgangspunkt i middelalderen, i»", "Relativpronomen «som» innleder en leddsetning", "Preposisjon: «tid. Felles for svært mange»", "Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («kvinne. Disse kvinnene følger stort»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Relativpronomen «som» innleder en leddsetning", "Preposisjon: «Undset kjempet for kvinnens likeverd»", "Preposisjon: «men så på kvinnesaksforkjemperne som»"], "tags": ["best", "konj", "prep"]}, {"id": "L21-5", "src": "luke", "kind": "luke", "title": "Sigrid Undset (5/7)", "text": "[[De]] viktigste motivene i Sigrid Undsets verk [[er]] kjærlighet, pliktfølelse, gudstro og egenvilje. Men [[først]] og fremst kan vi si at [[hun]] skriver om mennesket. Det hun forteller [[om]] samfunnet rundt, fungerer mest som bakgrunn [[for]] presentasjonen av menneskene.", "blanks": [["De"], ["er"], ["først"], ["hun"], ["om"], ["for"]], "labels": ["Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Fast uttrykk: «først og fremst»", "Pronomen: riktig form (subjekt/objekt) og referanse", "Preposisjon: «hun forteller om samfunnet rundt,»", "Preposisjon: «som bakgrunn for presentasjonen av»"], "tags": ["best", "prep", "uttr", "verb"]}, {"id": "L21-6", "src": "luke", "kind": "luke", "title": "Sigrid Undset (6/7)", "text": "Sigrid Undset debuterte 1907. På denne tiden døde flere [[av]] de store forfatterne i Norge. Man kan si at vi fikk et generasjonsskifte, [[for]] det var nemlig en del flere som debuterte omtrent samtidig som Undset. [[Etter]] at de kjente middelalderromanene var utgitt [[i]] løpet av 1920-årene, fikk Undset Nobelprisen 1928.", "blanks": [["av"], ["for"], ["Etter"], ["i"]], "labels": ["Preposisjon: «døde flere av de store»", "Preposisjon: «et generasjonsskifte, for det var»", "Preposisjon: «som Undset. Etter at de»", "Fast uttrykk: «i løpet av»"], "tags": ["prep", "uttr"]}, {"id": "L21-7", "src": "luke", "kind": "luke", "title": "Sigrid Undset (7/7)", "text": "I 1948 døde Sigrid Undset. [[Før]] hun døde, hadde hun sagt at [[hun]] ønsket at graven skulle ligge på [[et]] rolig sted. Det ble som hun [[ønsket]]. Graven ligger opp mot høyfjellet.", "blanks": [["Før"], ["hun"], ["et"], ["ønsket"]], "labels": ["Konjunksjon/subjunksjon som binder sammen setningene", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Verb i preteritum: velg et verb som passer i sammenhengen («som hun ønsket . Graven»)"], "tags": ["best", "konj", "verb"]}, {"id": "L22-1", "src": "luke", "kind": "luke", "title": "Ivar Aasen (1/5)", "text": "Ivar Aasen fra Ørsta på Sunnmøre [[ble/er]] født i 1813. Han kom fra [[en]] ganske fattig familie, men han var [[svært/meget/veldig/lynende]] intelligent. I tillegg arbeidet han alltid [[svært/meget/veldig/ordentlig]] hardt og klarte på egen hånd [[å]] skaffe seg mye kunnskap. Aasen var [[i]] sin ungdom interessert i både botanikk [[og]] språk.", "blanks": [["ble", "er"], ["en"], ["svært", "meget", "veldig", "lynende"], ["svært", "meget", "veldig", "ordentlig"], ["å"], ["i"], ["og"]], "labels": ["Passiv: bli + perfektum partisipp", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Gradsadverb som forsterker adjektivet/adverbet", "Gradsadverb som forsterker adjektivet/adverbet", "Infinitivsmerke «å» foran verbet", "Preposisjon: «Aasen var i sin ungdom»", "Konjunksjon/subjunksjon som binder sammen setningene"], "tags": ["best", "komp", "konj", "pass", "prep", "verb"]}, {"id": "L22-2", "src": "luke", "kind": "luke", "title": "Ivar Aasen (2/5)", "text": "Det er først og fremst [[som]] dikter og språkforsker han er blitt [[kjent]] over hele Norge. I 1842 dro [[han/Aasen]] ut på en reise som kom [[til]] å vare i mange år. Han [[reiste/dro]] rundt i store deler av Norge, [[og]] samlet informasjon om de norske dialektene. [[Det]] var biskop Neumann i Bergen som [[satte/hjalp]] ham i gang med dette arbeidet.", "blanks": [["som"], ["kjent"], ["han", "Aasen"], ["til"], ["reiste", "dro"], ["og"], ["Det"], ["satte", "hjalp"]], "labels": ["Relativpronomen «som» innleder en leddsetning", "Perfektum partisipp", "Pronomen: riktig form (subjekt/objekt) og referanse", "Preposisjon: «som kom til å vare»", "Verb i preteritum som passer i sammenhengen («år. Han reiste rundt i»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Formelt subjekt «det» (eller utbrytning «det er … som»)", "Ordforråd: ordet må passe i sammenhengen («Bergen som satte ham i»)"], "tags": ["best", "konj", "part", "prep", "verb"]}, {"id": "L22-3", "src": "luke", "kind": "luke", "title": "Ivar Aasen (3/5)", "text": "[[På]] den tiden var det ofte vanskelig [[å]] reise, og Aasen måtte ofte gå [[lange]] strekninger til fots. Andre ganger måtte [[han]] vente i timevis på en båt [[som]] var svært forsinket. I dagbøkene hans [[kan/får]] vi lese om hvor frustrert han [[av]] og til ble.", "blanks": [["På"], ["å"], ["lange"], ["han"], ["som"], ["kan", "får"], ["av"]], "labels": ["Preposisjon: «På den tiden»", "Infinitivsmerke «å» foran verbet", "Ordforråd: ordet må passe i sammenhengen («ofte gå lange strekninger til»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Relativpronomen «som» innleder en leddsetning", "Modalverb + infinitiv", "Fast uttrykk: «av og til»"], "tags": ["best", "konj", "prep", "uttr", "verb"]}, {"id": "L22-4", "src": "luke", "kind": "luke", "title": "Ivar Aasen (4/5)", "text": "Ivar Aasen var [[veldig/ganske/nokså/svært/meget]] liten av vekst, og han gikk [[ikke]] alltid pent kledd. Noen steder sto [[folk]] og glante etter ham, og mange [[ganger]] hørte han at de lo av [[han/ham]]. Det hendte sågar at noen trodde [[at]] han var en skummel fyr som [[man/folk/en/de]] aller helst burde holde seg unna.", "blanks": [["veldig", "ganske", "nokså", "svært", "meget"], ["ikke"], ["folk"], ["ganger"], ["han", "ham"], ["at"], ["man", "folk", "en", "de"]], "labels": ["Gradsadverb som forsterker adjektivet/adverbet", "Nektelse – betydning og plassering (i leddsetning foran verbet)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («og mange ganger hørte han»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Konjunksjon/subjunksjon som binder sammen setningene", "Pronomen: riktig form (subjekt/objekt) og referanse"], "tags": ["best", "komp", "konj"]}, {"id": "L22-5", "src": "luke", "kind": "luke", "title": "Ivar Aasen (5/5)", "text": "[[Riktig]] ille gikk det en gang i [[en/ei]] bygd i nærheten av Bergen. Politiet [[hadde]] nettopp fått vite at en av [[de]] kriminelle fangene hadde rømt fra fengselet byen, og da de fikk øye [[på]] den dårlig kledde mannen, arresterte de [[ham/han]] og sendte ham tilbake til Bergen. [[Da/Mens]] de var på vei til fengselet, [[kom/gikk/dro]] de forbi huset der biskop Neumann [[bodde]] og da biskopen fikk se hvem [[de/politiet]] hadde arrestert, ble selvfølgelig Ivar Aasen [[satt/sluppet]] fri.", "blanks": [["Riktig"], ["en", "ei"], ["hadde"], ["de"], ["på"], ["ham", "han"], ["Da", "Mens"], ["kom", "gikk", "dro"], ["bodde"], ["de", "politiet"], ["satt", "sluppet"]], "labels": ["Gradsadverb som forsterker adjektivet/adverbet", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Fast uttrykk: «fikk øye på»", "Pronomen: riktig form (subjekt/objekt) og referanse", "Konjunksjon/subjunksjon som binder sammen setningene", "Verb i preteritum som passer i sammenhengen («til fengselet, kom de forbi»)", "Verb i preteritum som passer i sammenhengen («biskop Neumann bodde og da»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Fast uttrykk: «satt fri»"], "tags": ["best", "komp", "konj", "uttr", "verb"]}, {"id": "L23-1", "src": "luke", "kind": "luke", "title": "Nord-Norge (1/7)", "text": "Nord-Norge med fylkene Nordland, Troms og Finnmark er midnattsolens og nordlysets land. Sommernettene varierer med været, men [[uansett]] vær opplever vi det arktiske dagslyset. [[Man/En/Vi]] glemmer nesten å gå og legge [[seg/oss]] og går gjerne på besøk til [[hverandre]] nattestid.", "blanks": [["uansett"], ["Man", "En", "Vi"], ["seg", "oss"], ["hverandre"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («været, men uansett vær opplever»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Fast uttrykk: «gå og legge seg»", "Ordforråd: ordet må passe i sammenhengen («besøk til hverandre nattestid.»)"], "tags": ["best", "uttr"]}, {"id": "L23-2", "src": "luke", "kind": "luke", "title": "Nord-Norge (2/7)", "text": "Midtvinters blir det [[aldri]] riktig lyst. Da kan man ofte [[se]] nordlyset som flammer over himmelen i [[nesten/over]] 20 timer i døgnet. Uansett årstid [[er]] skiftningene i lyset kanskje det aller [[mest]] fascinerende i denne landsdelen. Det er [[både/veldig]] kontrastrikt og spennende, og gjør det [[å]] reise hit til en spesiell opplevelse året rundt. Den nordnorske naturen er [[veldig/svært/meget/utrolig]] spesiell og variert. Kystlandskapet i Finnmark [[er]] nakent, for det vokser verken trær [[eller]] gress der, men inne i landet [[er/finnes/fins]] det skogkledde daler med elver og [[mange/noen/flere/gamle]] gårder.", "blanks": [["aldri"], ["se"], ["nesten", "over"], ["er"], ["mest"], ["både", "veldig"], ["å"], ["veldig", "svært", "meget", "utrolig"], ["er"], ["eller"], ["er", "finnes", "fins"], ["mange", "noen", "flere", "gamle"]], "labels": ["Nektelse – betydning og plassering (i leddsetning foran verbet)", "Ordforråd: ordet må passe i sammenhengen («man ofte se nordlyset som»)", "Ordforråd: ordet må passe i sammenhengen («himmelen i nesten 20 timer»)", "Verb i presens: velg et verb som passer i sammenhengen («Uansett årstid er skiftningene i»)", "Gradbøyning / sammenligning", "Konjunksjon/subjunksjon som binder sammen setningene", "Infinitivsmerke «å» foran verbet", "Gradsadverb som forsterker adjektivet/adverbet", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Konjunksjon/subjunksjon som binder sammen setningene", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Mengdeord / determinativ"], "tags": ["best", "komp", "konj", "verb"]}, {"id": "L23-3", "src": "luke", "kind": "luke", "title": "Nord-Norge (3/7)", "text": "Kysten i Troms og Nordland [[er]] livligere og frodigere, mens fjellene derimot [[ser]] mer utilnærmelige ut. Langs hele kysten [[fra]] Polarsirkelen til Øst-Finnmark finner man fuglefjell [[med]] tusenvis av fugler på fjellene og [[i]] luften. På denne strekningen [[ligger]] øygruppene Lofoten og Vesterålen som er [[populære]] reisemål.", "blanks": [["er"], ["ser"], ["fra"], ["med"], ["i"], ["ligger"], ["populære"]], "labels": ["Verb i presens: velg et verb som passer i sammenhengen («og Nordland er livligere og»)", "Verb i presens: velg et verb som passer i sammenhengen («fjellene derimot ser mer utilnærmelige»)", "Preposisjon: «hele kysten fra Polarsirkelen til»", "Preposisjon: «man fuglefjell med tusenvis av»", "Preposisjon: «fjellene og i luften. På»", "Verb i presens: velg et verb som passer i sammenhengen («denne strekningen ligger øygruppene Lofoten»)", "Ordforråd: ordet må passe i sammenhengen («som er populære reisemål.»)"], "tags": ["prep", "verb"]}, {"id": "L23-4", "src": "luke", "kind": "luke", "title": "Nord-Norge (4/7)", "text": "I Nord-Norge bor det også [[mange]] samer. De holder først og fremst [[til]] i Finnmark, men det bor også [[samer/noen/noen samer]] lenger sør. Fiske og jordbruk har [[vært]] de viktigste næringsveiene for befolkningen i [[Nord-Norge/nord/årevis]]. Den harde tilværelsen har preget menneskene [[på]] mange måter. De karakteriseres som åpne [[og]] direkte, gjestfrie og humoristiske, og humoren [[har]] nok vært til god hjelp i [[den]] tøffe tilværelsen.", "blanks": [["mange"], ["til"], ["samer", "noen", "noen samer"], ["vært"], ["Nord-Norge", "nord", "årevis"], ["på"], ["og"], ["har"], ["den"]], "labels": ["Mengdeord / determinativ", "Preposisjon: «og fremst til i Finnmark,»", "Ordforråd: ordet må passe i sammenhengen («bor også samer lenger sør.»)", "Perfektum partisipp", "Ordforråd: ordet må passe i sammenhengen («befolkningen i Nord-Norge . Den»)", "Preposisjon: «preget menneskene på mange måter.»", "Konjunksjon/subjunksjon som binder sammen setningene", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form"], "tags": ["best", "konj", "part", "prep", "verb"]}, {"id": "L23-5", "src": "luke", "kind": "luke", "title": "Nord-Norge (5/7)", "text": "Nord-Norge har mange byer. [[Noen/Mange/Flere]] av dem ble ødelagt under den [[andre]] verdenskrigen, og den nye bebyggelsen er [[preget]] av rask gjenoppbygging etter krigen. Tromsø, [[Nord-Norges/landsdelens]] største by, er en sjarmerende by [[som]] absolutt er verdt et besøk. For [[de/den/dem]] som vil være ute i naturen, [[har]] landsdelen mange utfordringer både sommer og [[vinter]], både på sjø og på land, [[for]] eksempel fisketurer, hvalsafari eller dykking.", "blanks": [["Noen", "Mange", "Flere"], ["andre"], ["preget"], ["Nord-Norges", "landsdelens"], ["som"], ["de", "den", "dem"], ["har"], ["vinter"], ["for"]], "labels": ["Mengdeord / determinativ", "Mengdeord / determinativ", "Perfektum partisipp", "Ordforråd: ordet må passe i sammenhengen («krigen. Tromsø, Nord-Norges største by,»)", "Relativpronomen «som» innleder en leddsetning", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen («i naturen, har landsdelen mange»)", "Verb i presens: velg et verb som passer i sammenhengen («sommer og vinter , både»)", "Fast uttrykk: «for eksempel»"], "tags": ["best", "konj", "part", "uttr", "verb"]}, {"id": "L23-6", "src": "luke", "kind": "luke", "title": "Nord-Norge (6/7)", "text": "Vil [[du/en/man]] ta beina fatt, er det gode muligheter for turer i rolig fjellterreng. Overnattingstilbudet [[er]] variert, det finnes førsteklasses hoteller og [[billige/enkle/mange/noen]] vandrerhjem. Dessuten er det en spesiell [[erfaring/opplevelse]] å bo i rorbu, som er [[en]] fiskerhytte.", "blanks": [["du", "en", "man"], ["er"], ["billige", "enkle", "mange", "noen"], ["erfaring", "opplevelse"], ["en"]], "labels": ["Pronomen: riktig form (subjekt/objekt) og referanse", "Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Ordforråd: ordet må passe i sammenhengen («hoteller og billige vandrerhjem. Dessuten»)", "Ordforråd: ordet må passe i sammenhengen («en spesiell erfaring å bo»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen"], "tags": ["best", "verb"]}, {"id": "L23-7", "src": "luke", "kind": "luke", "title": "Nord-Norge (7/7)", "text": "Med postskipet Hurtigruten kan du [[få]] med deg hele kyststrekningen fra Bergen [[i]] sør til Kirkenes i nord på «Verdens vakreste sjøreise», [[som]] den kalles. Man kan også reise [[helt]] nord til øygruppen Svalbard. På Svalbard [[lever]] man av gruvedrift, forskning og turisme. [[Fordi/Siden/Ettersom]] naturen her er svært sårbar, er [[det]] strenge grenser for hva folk kan [[gjøre]]. Den økende turismen er derfor både [[en]] viktig inntektskilde og samtidig en trussel [[for/mot]] plante- og dyrelivet på øyene.", "blanks": [["få"], ["i"], ["som"], ["helt"], ["lever"], ["Fordi", "Siden", "Ettersom"], ["det"], ["gjøre"], ["en"], ["for", "mot"]], "labels": ["Fast uttrykk: «få med deg»", "Preposisjon: «fra Bergen i sør til»", "Relativpronomen «som» innleder en leddsetning", "Gradsadverb som forsterker adjektivet/adverbet", "Verb i presens: velg et verb som passer i sammenhengen («På Svalbard lever man av»)", "Konjunksjon/subjunksjon som binder sammen setningene", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Verb i infinitiv", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Preposisjon: «en trussel for plante- og»"], "tags": ["best", "komp", "konj", "prep", "uttr", "verb"]}, {"id": "L24-1", "src": "luke", "kind": "luke", "title": "Bør vi slutte å stille klokken om våren og høsten? (1/6)", "text": "Natt til søndag 31. oktober måtte vi på nytt [[stille]] klokken. Politikere i Europa vil ha slutt på dette. Men forskere er ikke helt [[enige]] om det er bra for oss eller ikke. Var det litt lettere [[å]] våkne mandag 1. november etter at vi stilte [[klokken/klokka]]? Når vi stiller klokken tilbake, [[får]] vi lysere morgener. Helt siden 1980 [[har]] vi i Norge stilt klokken en time fram om våren til det vi [[kaller]] sommertid. I slutten av oktober har vi stilt klokken [[tilbake]] til det som er normaltid. Dette blir [[også/gjerne/derfor]] kalt vintertid. Tanken bak å stille klokken fram en time om [[våren]] er at vi skal få utnyttet dagslyset [[bedre/maksimalt]]. Vi får en time ekstra lys [[om/på]] kvelden.", "blanks": [["stille"], ["enige"], ["å"], ["klokken", "klokka"], ["får"], ["har"], ["kaller"], ["tilbake"], ["også", "gjerne", "derfor"], ["våren"], ["bedre", "maksimalt"], ["om", "på"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («på nytt stille klokken. Politikere»)", "Ordforråd: ordet må passe i sammenhengen («ikke helt enige om det»)", "Infinitivsmerke «å» foran verbet", "Ordforråd: ordet må passe i sammenhengen («vi stilte klokken ? Når»)", "Modalverb + infinitiv", "Ordforråd: ordet må passe i sammenhengen («siden 1980 har vi i»)", "Verb i presens: velg et verb som passer i sammenhengen («det vi kaller sommertid. I»)", "Ordforråd: ordet må passe i sammenhengen («stilt klokken tilbake til det»)", "Ordforråd: ordet må passe i sammenhengen («Dette blir også kalt vintertid.»)", "Ordforråd: ordet må passe i sammenhengen («time om våren er at»)", "Gradbøyning / sammenligning", "Preposisjon: «ekstra lys om kvelden.»"], "tags": ["komp", "prep", "verb"]}, {"id": "L24-2", "src": "luke", "kind": "luke", "title": "Bør vi slutte å stille klokken om våren og høsten? (2/6)", "text": "Den svenske forskeren Arne Lowden forsker [[på]] søvn og stress ved Stockholms universitet. Han mener vi bør fortsette [[med]] å stille klokken vår og høst, og sier at vi på denne [[måten]] får det beste av to verdener. Med sommertid får vi [[mer]] lys om kveldene uten at morgenene [[blir]] mørke. Med vintertid får vi [[lyse]] morgener. Vi trenger dette morgenlyset på den mørkeste [[tiden]] på året.", "blanks": [["på"], ["med"], ["måten"], ["mer"], ["blir"], ["lyse"], ["tiden"]], "labels": ["Preposisjon: «Lowden forsker på søvn og»", "Fast uttrykk: «fortsette med»", "Fast uttrykk: «på denne måten»", "Gradbøyning / sammenligning", "Passiv: bli + perfektum partisipp", "Ordforråd: ordet må passe i sammenhengen («får vi lyse morgener. Vi»)", "Ordforråd: ordet må passe i sammenhengen («den mørkeste tiden på året.»)"], "tags": ["komp", "pass", "prep", "uttr"]}, {"id": "L24-3", "src": "luke", "kind": "luke", "title": "Bør vi slutte å stille klokken om våren og høsten? (3/6)", "text": "Dette lyset er nemlig mye sterkere [[enn]] det elektriske lyset i lampene våre. Det gjør at kroppstemperaturen [[vår]] øker tidligere på morgenen. Vi blir piggere og [[mer]] våkne. Mye lys om morgenen øker også produksjonen [[av]] det hormonet som får oss til å bli trøtte om [[kvelden]]. Det gjør at vi kommer [[oss]] tidligere i seng om kveldene og får en [[lengre]] og bedre søvn, forteller Lowden.", "blanks": [["enn"], ["vår"], ["mer"], ["av"], ["kvelden"], ["oss"], ["lengre"]], "labels": ["Gradbøyning / sammenligning", "Eiendomspronomen (ikke refleksivt fordi eieren ikke er subjekt)", "Gradbøyning / sammenligning", "Preposisjon: «også produksjonen av det hormonet»", "Ordforråd: ordet må passe i sammenhengen («trøtte om kvelden . Det»)", "Refleksivt pronomen (refleksivt verb)", "Gradbøyning / sammenligning"], "tags": ["best", "komp", "prep", "verb"]}, {"id": "L24-4", "src": "luke", "kind": "luke", "title": "Bør vi slutte å stille klokken om våren og høsten? (4/6)", "text": "Den norske søvnforskeren Ståle Pallesen ved Universitetet i Bergen er [[derimot/imidlertid]] ikke så begeistret for at vi [[driver]] og stiller klokken fram og tilbake. Han [[mener]] vi bør slutte med det fordi det [[forstyrrer/ødelegger]] søvnen vår. De fleste klarer det, men [[noen]] sliter, sier han. Han viser til at studier fra andre land [[viser]] at det blir flere trafikkulykker, flere skader i arbeidslivet og at flere får hjerteinfarkt når vi [[skrur/endrer/forandrer]] på tiden.", "blanks": [["derimot", "imidlertid"], ["driver"], ["mener"], ["forstyrrer", "ødelegger"], ["noen"], ["viser"], ["skrur", "endrer", "forandrer"]], "labels": ["Konjunksjon/subjunksjon som binder sammen setningene", "Verb i presens: velg et verb som passer i sammenhengen («at vi driver og stiller»)", "Verb i presens: velg et verb som passer i sammenhengen («tilbake. Han mener vi bør»)", "Ordforråd: ordet må passe i sammenhengen («fordi det forstyrrer søvnen vår.»)", "Mengdeord / determinativ", "Verb i presens: velg et verb som passer i sammenhengen («andre land viser at det»)", "Ordforråd: ordet må passe i sammenhengen («når vi skrur på tiden.»)"], "tags": ["best", "konj", "verb"]}, {"id": "L24-5", "src": "luke", "kind": "luke", "title": "Bør vi slutte å stille klokken om våren og høsten? (5/6)", "text": "De som jobber i Den europeiske unionen (EU) mener det [[bør/må]] bli slutt på denne vekslingen mellom sommertid og [[vintertid]]. De bestemte seg derfor for å spørre innbyggerne i de 27 landene [[som]] samarbeider i EU, om hva de mener. Det ble [[en]] gigantisk undersøkelse, faktisk den [[største]] som noen gang er gjort i EU. Av de 500 millionene som [[ble]] spurt, var det 4,6 millioner som svarte. Men disse [[var]] ganske enige. Åtte av ti svarte at de var enige [[i]] at vi bør slutte med sommertid. [[Derfor]] vil EU at politikerne i de landene som er medlem, selv skal stemme [[over]] forslaget om å slutte med å stille klokken. Kanskje vil det bli slutt på dette med å [[stille]] klokken i Europa neste år.", "blanks": [["bør", "må"], ["vintertid"], ["som"], ["en"], ["største"], ["ble"], ["var"], ["i"], ["Derfor"], ["over"], ["stille"]], "labels": ["Modalverb + infinitiv", "Ordforråd: ordet må passe i sammenhengen («sommertid og vintertid . De»)", "Relativpronomen «som» innleder en leddsetning", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Gradbøyning / sammenligning", "Passiv: bli + perfektum partisipp", "Verb i preteritum som passer i sammenhengen («Men disse var ganske enige.»)", "Preposisjon: «var enige i at vi»", "Konjunksjon/subjunksjon som binder sammen setningene", "Fast uttrykk: «stemme over»", "Verb i infinitiv"], "tags": ["best", "komp", "konj", "pass", "prep", "uttr", "verb"]}, {"id": "L24-6", "src": "luke", "kind": "luke", "title": "Bør vi slutte å stille klokken om våren og høsten? (6/6)", "text": "Norge er ikke [[medlem]] av EU. Likevel mener næringsministeren i Norge at det [[kan/vil]] være lurt at vi gjør som de andre [[landene]] i Europa. Vi bør derfor vente å se [[hva]] de bestemmer. Nabolandet vårt, Sverige, har ikke bestemt [[seg]] ennå. De har heller ikke bestemt [[om]] de vil ha vintertid hele [[året/tiden]] eller sommertid alltid, om de nå skal [[slutte]] å stille klokken.", "blanks": [["medlem"], ["kan", "vil"], ["landene"], ["hva"], ["seg"], ["om"], ["året", "tiden"], ["slutte"]], "labels": ["Ordforråd: ordet må passe i sammenhengen («er ikke medlem av EU.»)", "Modalverb + infinitiv", "Ordforråd: ordet må passe i sammenhengen («de andre landene i Europa.»)", "Spørreord i indirekte spørsmål / leddsetning", "Refleksivt pronomen (refleksivt verb)", "Preposisjon: «ikke bestemt om de vil»", "Ordforråd: ordet må passe i sammenhengen («vintertid hele året eller sommertid»)", "Verb i infinitiv"], "tags": ["konj", "prep", "verb"]}, {"id": "L25-1", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (1/8)", "text": "5. januar 1432 drev et forlist italiensk båtmannskap i land på ei lita øy utenfor øya Røst i Lofoten. Lederen for sjømennene var handelsmannen Pietro Querini [[fra]] Venezia i Italia. Den 25. april [[året]] før hadde de seilt fra Kreta med [[et]] fullastet skip med kurs for Brügge [[i]] Belgia. På reisen dit slo [[de/skipet]] følge med to andre handelsskip. Mannskapet [[på]] de tre skipene var på til [[sammen]] 68 menn, og de fleste av sjømennene [[var/kom]] fra Italia. Alle skipene var lastet [[med]] vintønner, krydder og andre varer som skulle [[selges]] på det vesteuropeiske markedet.", "blanks": [["fra"], ["året"], ["et"], ["i"], ["de", "skipet"], ["på"], ["sammen"], ["var", "kom"], ["med"], ["selges"]], "labels": ["Preposisjon: «Pietro Querini fra Venezia i»", "Ordforråd: ordet må passe i sammenhengen («25. april året før hadde»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Preposisjon: «for Brügge i Belgia. På»", "Fast uttrykk: «slo de følge»", "Preposisjon: «handelsskip. Mannskapet på de tre»", "Fast uttrykk: «til sammen»", "Verb i preteritum som passer i sammenhengen («av sjømennene var fra Italia.»)", "Preposisjon: «var lastet med vintønner, krydder»", "s-passiv etter modalverb"], "tags": ["best", "pass", "prep", "uttr", "verb"]}, {"id": "L25-2", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (2/8)", "text": "Querini [[hadde]] tenkt seg en fredelig handelsreise, men [[nær/ved/utenfor]] den franske vestkysten kom handelsskipene ut for [[et]] voldsomt uvær. Skipene drev fra [[kysten]] og drev hjelpeløst omkring ute på [[det]] store havet, helt ute av kurs. [[Den]] gangen trodde man at jorda var [[flat]], og mannskapet fryktet at de skulle [[falle/drive]] utfor kanten og ned i avgrunnen.", "blanks": [["hadde"], ["nær", "ved", "utenfor"], ["et"], ["kysten"], ["det"], ["Den"], ["flat"], ["falle", "drive"]], "labels": ["Hjelpeverb: perfektum/pluskvamperfektum (har/hadde + partisipp)", "Ordforråd: ordet må passe i sammenhengen («handelsreise, men nær den franske»)", "Ubestemt artikkel (en/ei/et): kjønnet på substantivet bestemmer formen", "Ordforråd: ordet må passe i sammenhengen («drev fra kysten og drev»)", "Dobbel bestemmelse: den/det/de + adjektiv + substantiv i bestemt form", "Ordforråd: ordet må passe i sammenhengen («av kurs. Den gangen trodde»)", "Perfektum partisipp", "Verb i infinitiv"], "tags": ["best", "part", "verb"]}, {"id": "L25-3", "src": "luke", "kind": "luke", "title": "Kulturmøte i middelalderen (3/8)", "text": "[[Men]] slik gikk det ikke. Sannsynligvis fulgte [[skipene]] med vinden nordvest for Irland og Skottland. [[Skipene]] ble etter hvert rasert av stormen, og sjøfolkene [[måtte]] gå i livbåtene. I ukevis kjempet [[de/sjøfolkene/sjømennene]] mot storm og kulde i de små [[båtene/livbåtene]]. Mange av mennene druknet eller døde [[av]] sult og utmattelse. Båtene drev med Golfstrømmen over Nordsjøen, og [[like]] etter nyttår, i januar 1432, kom [[de]] få som fortsatt levde, til [[ei]] lita øy like ved Røst i Lofoten.", "blanks": [["Men"], ["skipene"], ["Skipene"], ["måtte"], ["de", "sjøfolkene", "sjømennene"], ["båtene", "livbåtene"], ["av"], ["like"], ["de"], ["ei"]], "labels": ["Konjunksjon/subjunksjon som binder sammen setningene", "Ordforråd: ordet må passe i sammenhengen («Sannsynligvis fulgte skipene med vinden»)", "Ordforråd: ordet må passe i sammenhengen («og Skottland. Skipene ble etter»)", "Ordforråd: ordet må passe i sammenhengen («og sjøfolkene måtte gå i»)", "Pronomen: riktig form (subjekt/objekt) og referanse", "Ordforråd: ordet må passe i sammenhengen
